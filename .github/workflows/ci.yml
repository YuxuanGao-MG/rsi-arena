name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["runs/**", "benchmarks/windows/**", "docs/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The reader has its own checks, in node, because the failures they catch are
  # not the kind pytest can see: the site once showed the best of the worst five
  # hundred windows under a heading that said "Where it won", and no Python test
  # could have known. They drive the real router against fixtures built from the
  # real run directories.
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the reader
        run: |
          set -o pipefail
          for check in router checks arch a11y vote; do
            echo "--- $check"
            node "web/tests/$check.mjs"
          done
      # They passed on the machine that wrote them because they imported
      # /tmp/rsicheck/harness.mjs by absolute path and that directory was still
      # there. Every path is resolved from the test file now; this proves it,
      # cheaply, on a runner that has never had such a directory.
      - name: No check may reach outside the repository
        run: |
          ! grep -rn "/tmp/\|/Users/\|/home/" web/tests/*.mjs || \
            { echo "::error::a reader check refers to a path outside the repository"; exit 1; }
