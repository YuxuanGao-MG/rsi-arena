# One turn of the loop, run on GitHub's machines. Trigger it from the Actions tab
# (Run workflow) or from the API. Results are committed back to main under runs/,
# the question set under benchmarks/windows/, and a summary is written to the run page.
#
# Needs one repository secret for anything but "windows": OPENROUTER_API_KEY.
name: loop
on:
  # Two generations a day, twelve hours apart. A generation is about an hour of
  # wall clock and thirty dollars once the incumbent's evaluation is cached, so
  # this is roughly sixty dollars a day — a pace chosen to be read, not to be
  # the fastest possible.
  #
  # Each one continues from the last: `rsi-arena next` finds the deepest
  # generation and names the one after it, so nobody has to remember whether the
  # lineage is on gen4 or gen5. A schedule that always started from the seed
  # would not be a lineage, only the same experiment repeated.
  schedule:
    # One generation a day, with two chances to start it. GitHub's scheduler is
    # documented best-effort and it means it: on 17 September neither this
    # workflow's 03:17 nor live.yml's 01:05 fired at all. The second cron is the
    # retry; the once-a-day guard below makes the pair safe, so two firings can
    # never mean two generations - the day cap is about money, this is about
    # not running the experiment twice because the scheduler hiccuped once.
    - cron: "17 3 * * *"
    - cron: "47 5 * * *"
    # Four crons across two workflows were dropped inside thirty hours - not
    # delayed, never delivered. The likely cause is our own churn: every push
    # to this file re-registers its schedules, and the file was pushed all
    # night. A third chance costs nothing when an earlier one succeeded, and
    # the guard makes any number of chances mean one generation.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "windows = build the question set (no key). bench = score a harness. optimize = one generation."
        type: choice
        options: [windows, bench, optimize]
        default: bench
      chain:
        description: "ignore harness/run_dir and continue from the deepest generation"
        type: boolean
        default: false
      harness:
        description: "harness file, or a run directory to continue from (runs/gen1)"
        default: harnesses/horizon-5m.json
      run_dir:
        description: "optimize: where this generation is written"
        default: runs/gen1
      split:
        description: "bench: which fixtures"
        type: choice
        options: [holdout, train, all]
        default: holdout
      max_metric_calls:
        description: "optimize: window evaluations GEPA may spend"
        # A dispatch input's declared default is what a manual run gets - the
        # || '600' fallbacks downstream apply only on a schedule, where inputs
        # are empty. This said 200 from the era of the five-match benchmark, so
        # the first manual dispatch after the valset fix handed preflight
        # 240 valset against 200 calls and was correctly refused for $0.
        # Declared default and fallback must agree.
        default: "600"
      benchmark:
        description: "the fixture list"
        default: benchmarks/soccer-2026.json
      holdout:
        description: "fixtures kept from the optimizer"
        default: "100"
      audit:
        description: "fixtures shown to nothing until a promotion needs confirming"
        default: "60"
      per_fixture:
        description: "windows kept per match; 0 keeps all. Power comes from matches, not windows within one"
        # Four, not eight, and chosen on the science rather than the bill - though
        # the bill is what prompted the question. What the gate can resolve is set
        # by the number of *matches*: thirty-four windows of one match share a
        # scoreline and a five-minute horizon, and a goal moves all of them at
        # once, so they are closer to one observation than to thirty-four. Halving
        # the windows within a match costs little resolution; halving the matches
        # would cost a lot. It also takes a cold generation from $86 to $53, which
        # is the difference between fitting the ceiling and not.
        default: "4"
      max_generation_usd:
        description: "override the ceiling; 0 derives it from what preflight predicts"
        default: "0"
      max_day_usd:
        description: "if the key has already spent this much today, start nothing"
        default: "100"
      trace:
        description: "keep every step each harness took, so the reader can show it"
        type: boolean
        default: true
      model:
        description: "override the harness model (blank keeps the file's)"
        default: ""
      reflection_model:
        description: "optimize: the model that rewrites harnesses"
        default: anthropic/claude-sonnet-4.5

permissions:
  contents: write
  issues: write

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Measured, not guessed. A baseline of four hundred and forty windows took
    # nineteen minutes, so about twenty-three a minute at concurrency four. A
    # cold generation on the hundred-match held-out set is roughly twenty-five
    # hundred window evaluations - baseline, search, candidate - which is under
    # two hours; a warm one is closer to seventy-five minutes, because the
    # incumbent's held-out rollouts are still in the cache until the held-out
    # set rotates.
    #
    # 330 was high enough to hide a runaway: the first scheduled attempt ran the
    # full five and a half hours and was killed by it, having bought a train
    # pass it then discarded. This is the wrong backstop for that anyway -
    # max-generation-usd is, because money is what was being wasted. This just
    # stops a hung job from holding the runner all day.
    timeout-minutes: 150
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # At job level, not on the publish step. A step's own `env:` block is not
      # in scope when that step's `if:` is evaluated, so `env.SUPABASE_DB_URL != ''`
      # read empty every time and the reader has never once been fed.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The publish extra carries psycopg2, which both the end-of-run publish
      # and the mid-run progress heartbeat need. The heartbeat is fail-open, so
      # a missing driver would not break anything - it would just mean the run
      # goes dark for ninety minutes, which is the thing it exists to prevent.
      - run: pip install -e ".[publish]"

      - name: Restore tool and model caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: loop-cache-${{ github.run_id }}
          restore-keys: loop-cache-

      - name: Check the key
        if: inputs.command != 'windows'
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # `inputs` is empty on a schedule, so every one of these needs the same
      # default the optimize step uses. It did not have them: a scheduled run
      # called `--holdout ''`, argparse rejected it, and the question set was
      # never rebuilt. Nobody noticed because the command is piped into tee, and
      # a pipeline's exit code is the last command's — so a step that failed
      # reported success and the job went green. pipefail is on for that reason.
      - name: Build the question set
        run: |
          set -o pipefail
          rsi-arena windows \
            --benchmark "${{ inputs.benchmark || 'benchmarks/soccer-2026.json' }}" \
            --holdout "${{ inputs.holdout || '100' }}" \
            --audit "${{ inputs.audit || '60' }}" | tee windows.txt
          { echo "### Question set"; echo '```'; cat windows.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Bench
        if: inputs.command == 'bench'
        shell: bash
        run: |
          set -o pipefail
          args=(--harness "${{ inputs.harness }}" --split "${{ inputs.split }}"
                --benchmark "${{ inputs.benchmark }}" --holdout "${{ inputs.holdout }}"
                --per-fixture "${{ inputs.per_fixture }}")
          [ "${{ inputs.trace }}" = "true" ] && args+=(--trace)
          [ -n "${{ inputs.model }}" ] && args+=(--model "${{ inputs.model }}")
          mkdir -p runs/bench
          rsi-arena bench "${args[@]}" --out "runs/bench/$(date -u +%Y%m%dT%H%M)-${{ inputs.split }}.rollouts.json" | tee bench.txt
          { echo "### Bench"; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # A scheduled run arrives with no inputs at all, so the chain is resolved
      # here and everything downstream reads these rather than `inputs.*`.
      # Fifteen things that have to hold before a generation is worth paying
      # for, none of which need a key. Every one of them is something that went
      # wrong here and was found after a run rather than before one.
      # The second cron's safety: a schedule finds a generation already made
      # today and starts nothing. Reads the manifests in the checkout rather
      # than asking an API, because the checkout is what the run would chain
      # from anyway. Manual dispatches skip this on purpose - a person
      # re-running after a fix knows why they are doing it.
      - name: One a day means one
        id: today
        if: github.event_name == 'schedule'
        run: |
          latest=$(python - <<'EOF'
          import json, pathlib
          # Only generations that reached a verdict count. A crashed partial
          # gets committed too (the commit step runs on failure so nothing is
          # lost), and if it counted, an early crash would block the very retry
          # this guard exists to make safe.
          done = []
          for d in pathlib.Path("runs").glob("*"):
              m = d / "manifest.json"
              if not m.exists():
                  continue
              j = json.loads(m.read_text())
              if j.get("decision"):
                  done.append(j.get("created", ""))
          print(max(done)[:10] if done else "")
          EOF
          )
          today=$(date -u +%Y-%m-%d)
          if [ "$latest" = "$today" ]; then
            echo "made=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=already ran today::a generation dated $today exists; this firing starts nothing"
            echo "### Skipped - a generation already ran today ($today)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "made=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Where this generation goes
        id: chain
        if: steps.today.outputs.made != 'true' && (github.event_name == 'schedule' || inputs.chain)
        run: |
          eval "$(rsi-arena next --runs-dir runs --seed harnesses/horizon-5m.json)"
          # eval of an empty substitution returns 0, so if `next` dies this step
          # goes green with empty outputs — and on a schedule the downstream
          # fallbacks are empty too, which makes Path('') the repository root.
          # Same shape as the --holdout '' bug, fixed for inputs.* and left
          # standing here until now.
          if [ -z "$harness" ] || [ -z "$run_dir" ]; then
            echo "::error::rsi-arena next produced no chain; refusing to guess where this generation goes"
            exit 1
          fi
          echo "harness=$harness"          >> "$GITHUB_OUTPUT"
          echo "run_dir=$run_dir"          >> "$GITHUB_OUTPUT"
          echo "generations=$generations"  >> "$GITHUB_OUTPUT"
          echo "continuing from ${harness} into ${run_dir} (generation $((generations + 1)))"

      # After the chain, not before it: the held-out set rotates on the
      # generation number, so a preflight that did not know which generation it
      # was checked a different split from the one the run would use - and
      # priced it against answers that split does not own.
      - name: Preflight
        id: preflight
        if: steps.today.outputs.made != 'true' && (github.event_name == 'schedule' || inputs.command == 'optimize')
        run: |
          python scripts/preflight.py \
            --benchmark "${{ inputs.benchmark || 'benchmarks/soccer-2026.json' }}" \
            --holdout "${{ inputs.holdout || '100' }}" \
            --audit "${{ inputs.audit || '60' }}" \
            --per-fixture "${{ inputs.per_fixture || '4' }}" \
            --max-metric-calls "${{ inputs.max_metric_calls || '600' }}" \
            --generation "${{ steps.chain.outputs.generations || '0' }}"


      # The ceiling, reconciled with what is actually on the key.
      #
      # A configured ceiling of sixty dollars against a balance of thirty is not
      # a ceiling, it is a promise the account cannot keep: the generation would
      # run until the provider started answering 402, and a 402 is a per-call
      # error the runner scores as silence — a full set of rollouts reading as a
      # harness that chose to stay quiet. The client now treats the first 402 as
      # exhaustion, so that failure is at least honest, but it is better not to
      # reach it. Half the balance, so a second generation in the same day still
      # has something to spend.
      # The budget is what the run costs, plus margin — not a number typed once.
      #
      # Every generation that failed rather than concluded failed the same way:
      # it started something it could not finish. A flat ceiling cannot know
      # that, because the cost moves with the split, with what the scoreboard
      # already owns, and with the price of the model. Preflight does know, and
      # has just said so. So: take its figure, add a margin, and check the day
      # and the balance can cover it. If they cannot, run nothing at all — a
      # skip is honest and finishes green, where a half-funded generation
      # produces refusals that read like a verdict.
      - name: What this generation may spend
        id: ceiling
        if: steps.today.outputs.made != 'true' && (github.event_name == 'schedule' || inputs.command == 'optimize')
        shell: bash
        run: |
          predicted="${{ steps.preflight.outputs.predicted_usd || '0' }}"
          want="${{ inputs.max_generation_usd || '0' }}"
          cap="${{ inputs.max_day_usd || '100' }}"
          margin=1.35

          # The balance is deliberately not consulted. This account tops itself up
          # by thirty dollars whenever it falls below ten, so it sits between
          # about ten and forty and is never once above what a generation costs —
          # a balance check would skip every night forever while the money to run
          # was arriving the whole time. What bounds the spending is the day's
          # total, which the top-ups do not reset.
          # `or 0` here reported "$0 spent today" whenever the field was absent,
          # which is not unknown — it is a confident zero that disables the cap
          # while the step summary asserts the cap is fine. OpenRouter does not
          # return usage_daily for every key type. Absent means unknown.
          read_key="import json,sys; v=(json.load(sys.stdin)['data'] or {}).get('usage_daily'); print('unknown' if v is None else round(float(v), 4))"
          today=$(curl -sS --max-time 20 -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                    https://openrouter.ai/api/v1/key 2>/dev/null | python -c "$read_key" 2>/dev/null || echo unknown)

          # An explicit --max-generation-usd overrides the estimate; otherwise the
          # estimate plus margin is the ceiling.
          usd=$(python -c "w=float('$want'); p=float('$predicted'); print(round(w if w > 0 else max(5.0, p * $margin), 2))")

          room="unknown"
          if [ "$today" != "unknown" ]; then
            room=$(python -c "print(round(max(0.0, float('$cap') - float('$today')), 2))")
          fi

          skip=""
          if [ "$today" = "unknown" ]; then
            skip="could not read what this key has spent today, and the daily cap is the only bound left"
          elif python -c "import sys; sys.exit(0 if float('$room') < float('$usd') else 1)"; then
            skip="\$$today of a \$$cap daily cap is already spent, leaving \$$room; this generation needs \$$usd"
          fi

          if [ -n "$skip" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=not enough to finish::$skip — starting nothing"
            { echo "### Generation not started";
              echo "$skip.";
              echo "";
              echo "A half-funded generation does not produce a weak result, it produces refusals that read like one. Nothing was spent."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "predicted \$$predicted, ceiling \$$usd, \$$today spent today of \$$cap"
            { echo "### Budget";
              echo "- preflight predicts **\$$predicted**, ceiling **\$$usd** (x$margin)";
              echo "- \$$today spent today of a \$$cap cap"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "usd=$usd" >> "$GITHUB_OUTPUT"

      - name: Optimize
        if: steps.today.outputs.made != 'true' && steps.ceiling.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.command == 'optimize')
        run: |
          harness="${{ steps.chain.outputs.harness || inputs.harness }}"
          run_dir="${{ steps.chain.outputs.run_dir || inputs.run_dir }}"
          args=(--harness "$harness" --run-dir "$run_dir"
                --benchmark "${{ inputs.benchmark || 'benchmarks/soccer-2026.json' }}"
                --holdout "${{ inputs.holdout || '100' }}"
                --audit "${{ inputs.audit || '60' }}"
                --generation "${{ steps.chain.outputs.generations || '0' }}"
                --per-fixture "${{ inputs.per_fixture || '4' }}"
                --max-metric-calls "${{ inputs.max_metric_calls || '600' }}"
                --max-generation-usd "${{ steps.ceiling.outputs.usd }}"
                --reflection-model "${{ inputs.reflection_model || 'anthropic/claude-sonnet-4.5' }}")
          [ "${{ inputs.trace || 'true' }}" = "true" ] && args+=(--trace)
          [ -n "${{ inputs.model }}" ] && args+=(--model "${{ inputs.model }}")
          set -o pipefail
          rsi-arena optimize "${args[@]}" | tee optimize.txt
          { echo "### Generation ${run_dir}"; echo '```'; cat optimize.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The reader is the point of keeping traces at all. Publishing here means a
      # run is readable the moment it finishes rather than when someone
      # remembers to push it, and a missing database secret is a warning rather
      # than a failed generation — the run already happened and is committed.
      - name: Publish to the reader
        if: always() && env.SUPABASE_DB_URL != ''
        run: |
          pip install -q psycopg2-binary || { echo "::warning::psycopg2 install failed; not publishing"; exit 0; }
          # Only this run's directory. Publishing runs/*/ every night deleted and
          # re-inserted every historical rollout - quadratic work that would fill
          # the shared 500 MB database inside two months, behind a || that kept
          # the job green while the reader silently froze. Republishing an old
          # run after an amendment is a deliberate act, done by hand.
          run_dir="${{ steps.chain.outputs.run_dir || inputs.run_dir }}"
          if [ -d "$run_dir" ]; then
            python scripts/publish_runs.py "$run_dir" \
              || echo "::warning::publishing failed; the run is still committed"
          else
            echo "nothing new to publish"
          fi

      # Full working trajectories, off the repository's back.
      #
      # Every tool call and model turn is already recorded three ways: full
      # traces in runs/<gen>/rollouts when --trace is on, trimmed spans in
      # rsi.traces, and the per-run artifact below. What none of those gives is
      # a durable home that is not git - a generation adds ~2,600 files and
      # ~50 MB, which is an 82,000-file repository by day 30. With AWS secrets
      # set, the whole run directory syncs to S3 and the bulky search outputs
      # can stay out of git; without them this step says so and moves on.
      - name: Keep the trajectories in S3
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          bucket="${{ secrets.TRACE_BUCKET }}"
          run_dir="${{ steps.chain.outputs.run_dir || inputs.run_dir }}"
          if [ -z "$bucket" ]; then
            echo "::notice::AWS key is set but TRACE_BUCKET is not; skipping"
          elif [ -d "$run_dir" ]; then
            # cp --recursive, not sync. sync lists the bucket to diff against
            # it, and the first real attempt died on exactly that: AccessDenied
            # on s3:ListBucket, because the IAM policy named a different bucket
            # than TRACE_BUCKET does. A run directory is immutable and uploaded
            # exactly once, so there is nothing to diff - and with cp the policy
            # can drop ListBucket entirely and become write-only, which is the
            # tighter shape anyway: a leaked key could add trajectories but
            # never read or enumerate them.
            aws s3 cp "$run_dir" "s3://$bucket/rsi-arena/$(basename "$run_dir")/" \
                --recursive --only-show-errors \
              && echo "- trajectories uploaded to s3://$bucket/rsi-arena/$(basename "$run_dir")/" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::S3 upload failed; the artifact below still has everything"
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "rsi-arena loop"
          git config user.email "loop@users.noreply.github.com"
          for d in benchmarks/windows runs; do [ -d "$d" ] && git add -A -- "$d"; done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "loop: ${{ inputs.command }} (${{ inputs.harness }}) run ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Prune before the cache save: the key is unique per run, so every run
      # writes a fresh entry of a .cache that never shrank - 10 GB of repo cache
      # and LRU eviction in about seven weeks, after which the hit rate falls
      # and the bill rises with no signal. Fourteen days covers a rotation.
      - name: Prune the model cache
        if: always()
        run: find .cache -type f -mtime +14 -delete 2>/dev/null || true

      - name: Keep the run as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          retention-days: 14
          path: |
            runs
            benchmarks/windows
          if-no-files-found: ignore

      # The only alerting there is. Three crons and real money, and until now a
      # failed run's sole witness was a step summary nobody opens. An issue in
      # the repo notifies its owner the way anything else in the repo does.
      - name: Say so if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "loop failed: $(date -u +%Y-%m-%d) run ${{ github.run_id }}" \
            --body "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. A generation may have spent money without producing a record." \
            || echo "::warning::could not open an issue about the failure"
