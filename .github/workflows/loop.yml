# One turn of the loop, run on GitHub's machines. Trigger it from the Actions tab
# (Run workflow) or from the API. Results are committed back to main under the
# topic's runs directory, the question set under benchmarks/windows*/, and a
# summary is written to the run page.
#
# One workflow, several topics. Which topic a firing is for comes from the
# dispatch input or, on a schedule, from the cron string that fired; what that
# topic runs on - its seed harness, benchmark, prices, sizes - comes from
# `rsi-arena topic --shell`, evaluated once into the job's environment. No step
# below names a Kalshi file; the spec does.
#
# Needs one repository secret for anything but "windows": OPENROUTER_API_KEY.
# The news topic also needs APCA_API_KEY_ID and APCA_API_SECRET_KEY to build a
# question set; without them it says so and fails preflight in a sentence.
name: loop
on:
  # A generation a day per topic, with two or three chances to start it.
  # GitHub's scheduler is documented best-effort and it means it: on 17
  # September neither this workflow's 03:17 nor live.yml's 01:05 fired at all.
  # The later crons are the retry; the once-a-day guard below makes them safe,
  # so two firings can never mean two generations - the day cap is about
  # money, this is about not running the experiment twice because the
  # scheduler hiccuped once.
  #
  # Each one continues from the last: `rsi-arena next` finds the deepest
  # generation of its topic and names the one after it, so nobody has to
  # remember whether the lineage is on gen4 or gen5.
  #
  # The cron string that fired is the topic. The map lives in the `resolve`
  # job below and this list has to agree with it.
  schedule:
    - cron: "17 3 * * *"      # kalshi-horizon-5m
    - cron: "17 11 * * *"     # kalshi-horizon-5m
    - cron: "17 19 * * *"     # kalshi-horizon-5m
    - cron: "47 5 * * *"      # crypto-horizon-1m
    - cron: "47 13 * * *"     # crypto-horizon-1m
    - cron: "47 21 * * *"     # crypto-horizon-1m
    - cron: "17 8 * * *"      # news-equity-5m
    - cron: "17 16 * * *"     # news-equity-5m
    - cron: "17 0 * * *"      # news-equity-5m
  workflow_dispatch:
    inputs:
      topic:
        description: "which loop"
        type: choice
        options: [kalshi-horizon-5m, news-equity-5m, crypto-horizon-1m]
        default: kalshi-horizon-5m
      command:
        description: "windows = build the question set (no key). bench = score a harness. optimize = one generation."
        type: choice
        options: [windows, bench, optimize]
        default: bench
      chain:
        description: "ignore harness/run_dir and continue from the deepest generation"
        type: boolean
        default: false
      # Blank means the topic's. A declared default here would be Kalshi's
      # file on every topic, so the spec answers unless a person types a value.
      harness:
        description: "harness file, or a run directory to continue from; blank uses the topic's seed"
        default: ""
      run_dir:
        description: "optimize: where this generation is written; blank uses <runs dir>/gen1"
        default: ""
      split:
        description: "bench: which fixtures"
        type: choice
        options: [holdout, train, all]
        default: holdout
      max_metric_calls:
        description: "optimize: window evaluations GEPA may spend; blank uses the topic's"
        default: ""
      benchmark:
        description: "the fixture list; blank uses the topic's"
        default: ""
      holdout:
        description: "fixtures kept from the optimizer; blank uses the topic's"
        default: ""
      audit:
        description: "fixtures shown to nothing until a promotion needs confirming; blank uses the topic's"
        default: ""
      per_fixture:
        description: "windows kept per match; 0 keeps all; blank uses the topic's"
        default: ""
      max_generation_usd:
        description: "override the ceiling; 0 derives it from what preflight predicts"
        default: "0"
      daily_cap:
        description: "if the key has already spent this much today, start nothing; blank uses the topic's"
        default: ""
      trace:
        description: "keep every step each harness took, so the reader can show it"
        type: boolean
        default: true
      model:
        description: "override the harness model (blank keeps the file's)"
        default: ""
      reflection_model:
        description: "optimize: the model that rewrites harnesses"
        default: anthropic/claude-sonnet-4.5

permissions:
  contents: write
  issues: write

jobs:
  # Which topic this firing is for, and whether this checkout knows it.
  #
  # Its own job because a concurrency key is evaluated before any step runs
  # and cannot read a step's output or the environment; a job's `needs` it
  # can. Two topics may run at once; two generations of one topic may not.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      topic: ${{ steps.pick.outputs.topic }}
      known: ${{ steps.spec.outputs.known }}
    steps:
      - name: Which topic
        id: pick
        shell: bash
        run: |
          topic="${{ inputs.topic }}"
          if [ -z "$topic" ]; then
            # The cron map. Keep it in step with the `schedule:` list above.
            case "${{ github.event.schedule }}" in
              "17 3 * * *"|"17 11 * * *"|"17 19 * * *")  topic=kalshi-horizon-5m ;;
              "47 5 * * *"|"47 13 * * *"|"47 21 * * *")  topic=crypto-horizon-1m ;;
              "17 8 * * *"|"17 16 * * *"|"17 0 * * *")   topic=news-equity-5m ;;
            esac
          fi
          if [ -z "$topic" ]; then
            echo "::error::no topic for schedule '${{ github.event.schedule }}'; add it to the cron map in loop.yml"
            exit 1
          fi
          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "topic: $topic"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      # A topic can be on the schedule before its package is on main - the
      # crypto crons above are exactly that. A firing for one ends here,
      # green, saying so; it is not a failure and must not open an issue
      # every morning until the package lands.
      - name: Does this checkout know it
        id: spec
        shell: bash
        run: |
          topic="${{ steps.pick.outputs.topic }}"
          if rsi-arena topic --topic "$topic" --shell; then
            echo "known=true" >> "$GITHUB_OUTPUT"
          else
            echo "known=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=topic not in this checkout::$topic is scheduled but this checkout's rsi-arena does not know it yet; nothing runs"
            { echo "### Skipped - $topic is not in this checkout yet";
              echo "The cron fired, the package is not on main. Nothing was spent."; } >> "$GITHUB_STEP_SUMMARY"
          fi

  run:
    needs: resolve
    if: needs.resolve.outputs.known == 'true'
    runs-on: ubuntu-latest
    # Measured, not guessed. A baseline of four hundred and forty windows took
    # nineteen minutes, so about twenty-three a minute at concurrency four. A
    # cold generation on the hundred-match held-out set is roughly twenty-five
    # hundred window evaluations - baseline, search, candidate - which is under
    # two hours; a warm one is closer to seventy-five minutes, because the
    # incumbent's held-out rollouts are still in the cache until the held-out
    # set rotates.
    #
    # 330 was high enough to hide a runaway: the first scheduled attempt ran the
    # full five and a half hours and was killed by it, having bought a train
    # pass it then discarded. This is the wrong backstop for that anyway -
    # max-generation-usd is, because money is what was being wasted. This just
    # stops a hung job from holding the runner all day.
    timeout-minutes: 150
    # One generation of a topic at a time; different topics may overlap. The
    # key reads the resolve job's output because it cannot read the environment.
    concurrency:
      group: loop-${{ needs.resolve.outputs.topic }}
      cancel-in-progress: false
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # At job level, not on the publish step. A step's own `env:` block is not
      # in scope when that step's `if:` is evaluated, so `env.SUPABASE_DB_URL != ''`
      # read empty every time and the reader has never once been fed.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The news topic's venue. Unset on a Kalshi run, and unset is fine: the
      # Alpaca client reads its keys at the first request, never at
      # construction, so a topic that does not ask never notices.
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The publish extra carries psycopg2, which both the end-of-run publish
      # and the mid-run progress heartbeat need. The heartbeat is fail-open, so
      # a missing driver would not break anything - it would just mean the run
      # goes dark for ninety minutes, which is the thing it exists to prevent.
      - run: pip install -e ".[publish]"

      # What this topic runs on, once, into the environment of every step
      # after this one. The spec answers; a dispatch input that was actually
      # typed overrides it. Every later step reads $BENCHMARK, $HOLDOUT and the
      # rest and none of them repeats a default - a scheduled Kalshi run reads
      # exactly the values the steps used to carry as literals, because the
      # Kalshi spec is those values.
      - name: Resolve the topic
        shell: bash
        run: |
          TOPIC="${{ needs.resolve.outputs.topic }}"
          eval "$(rsi-arena topic --topic "$TOPIC" --shell)"
          override() { if [ -n "$2" ]; then printf -v "$1" '%s' "$2"; fi; }
          override HARNESS          "${{ inputs.harness }}"
          override BENCHMARK        "${{ inputs.benchmark }}"
          override HOLDOUT          "${{ inputs.holdout }}"
          override AUDIT            "${{ inputs.audit }}"
          override PER_FIXTURE      "${{ inputs.per_fixture }}"
          override MAX_METRIC_CALLS "${{ inputs.max_metric_calls }}"
          override MAX_DAY_USD      "${{ inputs.daily_cap }}"
          RUN_DIR="${{ inputs.run_dir }}"
          RUN_DIR="${RUN_DIR:-$RUNS_DIR/gen1}"
          for k in TOPIC HARNESS BENCHMARK WINDOWS_DIR RUNS_DIR RUN_DIR PER_FIXTURE WINDOW_USD \
                   HOLDOUT AUDIT MAX_METRIC_CALLS VALSET MODEL_CHOICES MAX_DAY_USD JEV_HARNESS COST_FLOOR_USD RUNS_PER_DAY; do
            echo "$k=${!k}" >> "$GITHUB_ENV"
            echo "  $k=${!k}"
          done
          { echo "### Topic: $TOPIC";
            echo "- seed \`$HARNESS\`, benchmark \`$BENCHMARK\`, runs in \`$RUNS_DIR\`";
            echo "- holdout $HOLDOUT, audit $AUDIT, $PER_FIXTURE a fixture, $MAX_METRIC_CALLS calls, valset $VALSET, \$$MAX_DAY_USD a day"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore tool and model caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: loop-cache-${{ github.run_id }}
          restore-keys: loop-cache-

      - name: Check the key
        if: inputs.command != 'windows'
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The question set, from the venue's history and whatever discovery left
      # on disk. pipefail is on because the command is piped into tee, and a
      # pipeline's exit code is the last command's - a step that failed used to
      # report success and the job went green.
      - name: Build the question set
        run: |
          set -o pipefail
          rsi-arena windows --topic "$TOPIC" --runs-dir "$RUNS_DIR" \
            --benchmark "$BENCHMARK" \
            --holdout "$HOLDOUT" \
            --audit "$AUDIT" \
            --per-fixture "$PER_FIXTURE" | tee windows.txt
          { echo "### Question set"; echo '```'; cat windows.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Bench
        if: inputs.command == 'bench'
        shell: bash
        run: |
          set -o pipefail
          args=(--topic "$TOPIC" --runs-dir "$RUNS_DIR"
                --harness "$HARNESS" --split "${{ inputs.split }}"
                --benchmark "$BENCHMARK" --holdout "$HOLDOUT"
                --per-fixture "$PER_FIXTURE")
          [ "${{ inputs.trace }}" = "true" ] && args+=(--trace)
          [ -n "${{ inputs.model }}" ] && args+=(--model "${{ inputs.model }}")
          mkdir -p "$RUNS_DIR/bench"
          rsi-arena bench "${args[@]}" --out "$RUNS_DIR/bench/$(date -u +%Y%m%dT%H%M)-${{ inputs.split }}.rollouts.json" | tee bench.txt
          { echo "### Bench"; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The second cron's safety: a schedule finds a generation of this topic
      # already made today and starts nothing. Reads the manifests in the
      # checkout rather than asking an API, because the checkout is what the
      # run would chain from anyway. Manual dispatches skip this on purpose - a
      # person re-running after a fix knows why they are doing it.
      - name: The day's slots
        id: today
        if: github.event_name == 'schedule'
        run: |
          made=$(python - <<'EOF'
          import json, os, pathlib
          # Only generations that reached a verdict count. A crashed partial
          # gets committed too (the commit step runs on failure so nothing is
          # lost), and if it counted, an early crash would block the very retry
          # this guard exists to make safe. Only this topic's, and only today's:
          # the spec says how many a UTC day may hold, and the crons offer that
          # many slots.
          import datetime
          root, topic = pathlib.Path(os.environ["RUNS_DIR"]), os.environ["TOPIC"]
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          n = 0
          for m in root.glob("*/manifest.json"):
              j = json.loads(m.read_text())
              if j.get("decision") and j.get("topic") == topic and str(j.get("created", ""))[:10] == today:
                  n += 1
          print(n)
          EOF
          )
          cap="${RUNS_PER_DAY:-1}"
          if [ "$made" -ge "$cap" ]; then
            echo "made=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=the day is full::$made $TOPIC generations today, the spec allows $cap; this firing starts nothing"
            echo "### Skipped - $made $TOPIC generations already today (the spec allows $cap)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "made=false" >> "$GITHUB_OUTPUT"
          fi

      # A scheduled run arrives with no inputs at all, so the chain is resolved
      # here and everything downstream reads these rather than `inputs.*`.
      - name: Where this generation goes
        id: chain
        if: steps.today.outputs.made != 'true' && (github.event_name == 'schedule' || inputs.chain)
        run: |
          eval "$(rsi-arena next --runs-dir "$RUNS_DIR" --seed "$HARNESS")"
          # eval of an empty substitution returns 0, so if `next` dies this step
          # goes green with empty outputs — and on a schedule the downstream
          # fallbacks are empty too, which makes Path('') the repository root.
          # Same shape as the --holdout '' bug, fixed for inputs.* and left
          # standing here until now.
          if [ -z "$harness" ] || [ -z "$run_dir" ]; then
            echo "::error::rsi-arena next produced no chain; refusing to guess where this generation goes"
            exit 1
          fi
          echo "harness=$harness"          >> "$GITHUB_OUTPUT"
          echo "run_dir=$run_dir"          >> "$GITHUB_OUTPUT"
          echo "generations=$generations"  >> "$GITHUB_OUTPUT"
          echo "continuing from ${harness} into ${run_dir} (generation $((generations + 1)))"

      # Fifteen things that have to hold before a generation is worth paying
      # for, none of which need a key. Every one of them is something that went
      # wrong here and was found after a run rather than before one.
      #
      # After the chain, not before it: the held-out set rotates on the
      # generation number, so a preflight that did not know which generation it
      # was checked a different split from the one the run would use - and
      # priced it against answers that split does not own.
      - name: Preflight
        id: preflight
        if: steps.today.outputs.made != 'true' && (github.event_name == 'schedule' || inputs.command == 'optimize')
        run: |
          python scripts/preflight.py --topic "$TOPIC" --runs-dir "$RUNS_DIR" \
            --benchmark "$BENCHMARK" \
            --holdout "$HOLDOUT" \
            --audit "$AUDIT" \
            --per-fixture "$PER_FIXTURE" \
            --max-metric-calls "$MAX_METRIC_CALLS" \
            --valset "$VALSET" \
            --generation "${{ steps.chain.outputs.generations || '0' }}"

      # The ceiling, reconciled with what is actually on the key.
      #
      # A configured ceiling of sixty dollars against a balance of thirty is not
      # a ceiling, it is a promise the account cannot keep: the generation would
      # run until the provider started answering 402, and a 402 is a per-call
      # error the runner scores as silence — a full set of rollouts reading as a
      # harness that chose to stay quiet. The client now treats the first 402 as
      # exhaustion, so that failure is at least honest, but it is better not to
      # reach it.
      #
      # The budget is what the run costs, plus margin — not a number typed once.
      # Every generation that failed rather than concluded failed the same way:
      # it started something it could not finish. A flat ceiling cannot know
      # that, because the cost moves with the split, with what the scoreboard
      # already owns, and with the price of the model. Preflight does know, and
      # has just said so. So: take its figure, add a margin, and check the day
      # can cover it under the topic's daily cap. If it cannot, run nothing at
      # all — a skip is honest and finishes green, where a half-funded
      # generation produces refusals that read like a verdict.
      - name: What this generation may spend
        id: ceiling
        if: steps.today.outputs.made != 'true' && (github.event_name == 'schedule' || inputs.command == 'optimize')
        shell: bash
        run: |
          predicted="${{ steps.preflight.outputs.predicted_usd || '0' }}"
          want="${{ inputs.max_generation_usd || '0' }}"
          # The topic's, unless a daily cap was typed into the dispatch.
          cap="$MAX_DAY_USD"
          # Was 1.35, when the prediction was one pot priced at the incumbent's
          # rate and the margin was the only allowance for candidates costing
          # more. The prediction is now three shares: a reserve for judging the
          # winner at the most the gate lets a candidate cost, a search share
          # the run enforces in dollars, and the baseline. Two of the three are
          # caps, not guesses, so the margin covers only the reflection model
          # and rate drift. 1.35 on top of a 2x reserve was paying twice for
          # the same fear, and pricing a night out of the daily cap.
          margin=1.1

          # The balance is deliberately not consulted. This account tops itself up
          # by thirty dollars whenever it falls below ten, so it sits between
          # about ten and forty and is never once above what a generation costs —
          # a balance check would skip every night forever while the money to run
          # was arriving the whole time. What bounds the spending is the day's
          # total, which the top-ups do not reset.
          # `or 0` here reported "$0 spent today" whenever the field was absent,
          # which is not unknown — it is a confident zero that disables the cap
          # while the step summary asserts the cap is fine. OpenRouter does not
          # return usage_daily for every key type. Absent means unknown.
          read_key="import json,sys; v=(json.load(sys.stdin)['data'] or {}).get('usage_daily'); print('unknown' if v is None else round(float(v), 4))"
          today=$(curl -sS --max-time 20 -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                    https://openrouter.ai/api/v1/key 2>/dev/null | python -c "$read_key" 2>/dev/null || echo unknown)

          # An explicit --max-generation-usd overrides the estimate; otherwise the
          # estimate plus margin is the ceiling.
          usd=$(python -c "w=float('$want'); p=float('$predicted'); print(round(w if w > 0 else max(5.0, p * $margin), 2))")

          room="unknown"
          if [ "$today" != "unknown" ]; then
            room=$(python -c "print(round(max(0.0, float('$cap') - float('$today')), 2))")
          fi

          skip=""
          if [ "$today" = "unknown" ]; then
            skip="could not read what this key has spent today, and the daily cap is the only bound left"
          elif python -c "import sys; sys.exit(0 if float('$room') < float('$usd') else 1)"; then
            skip="\$$today of a \$$cap daily cap is already spent, leaving \$$room; this generation needs \$$usd"
          fi

          if [ -n "$skip" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=not enough to finish::$skip — starting nothing"
            { echo "### Generation not started";
              echo "$skip.";
              echo "";
              echo "A half-funded generation does not produce a weak result, it produces refusals that read like one. Nothing was spent."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "predicted \$$predicted, ceiling \$$usd, \$$today spent today of \$$cap"
            { echo "### Budget";
              echo "- preflight predicts **\$$predicted**, ceiling **\$$usd** (x$margin)";
              echo "- \$$today spent today of a \$$cap cap ($TOPIC)"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "usd=$usd" >> "$GITHUB_OUTPUT"

      - name: Optimize
        if: steps.today.outputs.made != 'true' && steps.ceiling.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.command == 'optimize')
        run: |
          harness="${{ steps.chain.outputs.harness }}"
          run_dir="${{ steps.chain.outputs.run_dir }}"
          harness="${harness:-$HARNESS}"
          run_dir="${run_dir:-$RUN_DIR}"
          args=(--topic "$TOPIC" --runs-dir "$RUNS_DIR"
                --harness "$harness" --run-dir "$run_dir"
                --benchmark "$BENCHMARK"
                --holdout "$HOLDOUT"
                --audit "$AUDIT"
                --generation "${{ steps.chain.outputs.generations || '0' }}"
                --per-fixture "$PER_FIXTURE"
                --max-metric-calls "$MAX_METRIC_CALLS"
                --valset "$VALSET"
                --max-generation-usd "${{ steps.ceiling.outputs.usd }}"
                --reflection-model "${{ inputs.reflection_model || 'anthropic/claude-sonnet-4.5' }}")
          [ "${{ inputs.trace || 'true' }}" = "true" ] && args+=(--trace)
          [ -n "${{ inputs.model }}" ] && args+=(--model "${{ inputs.model }}")
          set -o pipefail
          rsi-arena optimize "${args[@]}" | tee optimize.txt
          { echo "### Generation ${run_dir}"; echo '```'; cat optimize.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The reader is the point of keeping traces at all. Publishing here means a
      # run is readable the moment it finishes rather than when someone
      # remembers to push it, and a missing database secret is a warning rather
      # than a failed generation — the run already happened and is committed.
      - name: Publish to the reader
        if: always() && env.SUPABASE_DB_URL != ''
        run: |
          pip install -q psycopg2-binary || { echo "::warning::psycopg2 install failed; not publishing"; exit 0; }
          # Only this run's directory. Publishing runs/*/ every night deleted and
          # re-inserted every historical rollout - quadratic work that would fill
          # the shared 500 MB database inside two months, behind a || that kept
          # the job green while the reader silently froze. Republishing an old
          # run after an amendment is a deliberate act, done by hand.
          run_dir="${{ steps.chain.outputs.run_dir }}"
          run_dir="${run_dir:-$RUN_DIR}"
          if [ -d "$run_dir" ]; then
            python scripts/publish_runs.py "$run_dir" \
              || echo "::warning::publishing failed; the run is still committed"
          else
            echo "nothing new to publish"
          fi

      # Full working trajectories, off the repository's back.
      #
      # Every tool call and model turn is already recorded three ways: full
      # traces in <run>/rollouts when --trace is on, trimmed spans in
      # rsi.traces, and the per-run artifact below. What none of those gives is
      # a durable home that is not git - a generation adds ~2,600 files and
      # ~50 MB, which is an 82,000-file repository by day 30. With AWS secrets
      # set, the whole run directory syncs to S3 and the bulky search outputs
      # can stay out of git; without them this step says so and moves on.
      - name: Keep the trajectories in S3
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          bucket="${{ secrets.TRACE_BUCKET }}"
          run_dir="${{ steps.chain.outputs.run_dir }}"
          run_dir="${run_dir:-$RUN_DIR}"
          if [ -z "$bucket" ]; then
            echo "::notice::AWS key is set but TRACE_BUCKET is not; skipping"
          elif [ -d "$run_dir" ]; then
            # cp --recursive, not sync. sync lists the bucket to diff against
            # it, and the first real attempt died on exactly that: AccessDenied
            # on s3:ListBucket, because the IAM policy named a different bucket
            # than TRACE_BUCKET does. A run directory is immutable and uploaded
            # exactly once, so there is nothing to diff - and with cp the policy
            # can drop ListBucket entirely and become write-only, which is the
            # tighter shape anyway: a leaked key could add trajectories but
            # never read or enumerate them.
            aws s3 cp "$run_dir" "s3://$bucket/rsi-arena/$TOPIC/$(basename "$run_dir")/" \
                --recursive --only-show-errors \
              && echo "- trajectories uploaded to s3://$bucket/rsi-arena/$TOPIC/$(basename "$run_dir")/" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::S3 upload failed; the artifact below still has everything"
          fi

      # Everything a generation writes that the next one reads: the question
      # set and the venue data discovery left beside it, the archive and the
      # scoreboard (flat in runs/, one pair per topic), and the topic's run
      # directories. For the first topic $RUNS_DIR is runs/ itself, which is
      # what this step always added.
      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name "rsi-arena loop"
          git config user.email "loop@users.noreply.github.com"
          shopt -s nullglob
          for d in benchmarks/windows benchmarks/windows-* benchmarks/crypto-data benchmarks/news-data \
                   runs/archive*.json runs/scoreboard*.json "$RUNS_DIR"; do
            [ -e "$d" ] && git add -A -- "$d"
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "loop: $TOPIC ${{ inputs.command || 'optimize' }} run ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Prune before the cache save: the key is unique per run, so every run
      # writes a fresh entry of a .cache that never shrank - 10 GB of repo cache
      # and LRU eviction in about seven weeks, after which the hit rate falls
      # and the bill rises with no signal. Fourteen days covers a rotation.
      - name: Prune the model cache
        if: always()
        run: find .cache -type f -mtime +14 -delete 2>/dev/null || true

      - name: Keep the run as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          retention-days: 14
          path: |
            runs
            benchmarks/windows
            benchmarks/windows-*
          if-no-files-found: ignore

      # The only alerting there is. Seven crons and real money, and until now a
      # failed run's sole witness was a step summary nobody opens. An issue in
      # the repo notifies its owner the way anything else in the repo does.
      - name: Say so if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "loop failed ($TOPIC): $(date -u +%Y-%m-%d) run ${{ github.run_id }}" \
            --body "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. A $TOPIC generation may have spent money without producing a record." \
            || echo "::warning::could not open an issue about the failure"
