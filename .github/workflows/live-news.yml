# Forecasts on US stocks as the stories break, collected during the session.
#
# The news loop scores the harness against items that have already been
# priced: every answer is graded against a bar already on disk. This is the
# other half — the same harness, the same frozen toolbox, pointed at a story
# nobody has read the tape after — and it only exists during regular hours.
# Rows go to Postgres and nothing is committed back: runs/live/ is gitignored
# on purpose.
#
# Needs OPENROUTER_API_KEY (the decisions model, at two thousandths of a cent
# a forecast), APCA_API_KEY_ID and APCA_API_SECRET_KEY (bars and news), and
# SUPABASE_DB_URL for the reader. Without the Alpaca pair it skips, green.
name: live-news
on:
  # Four forty-five-minute sweeps a weekday, in UTC, inside regular hours
  # (13:30–20:00 UTC in summer, 14:30–21:00 in winter):
  #
  #   13:35 — the open, five minutes settled; the morning's items land here
  #   16:05 — late morning, where the day's second wave of guidance and
  #           analyst notes tends to break
  #   18:05 — early afternoon
  #   20:05 — the last hour in summer; in winter this is the lunch lull, and
  #           the first one lands before the open and waits for it
  #
  # Each firing polls the news feed every minute for forty-five minutes and
  # forecasts each new item on a name in the universe once. Twenty invocations
  # a week at a five-cent ceiling: a dollar a week.
  schedule:
    - cron: "35 13 * * 1-5"
    - cron: "5 16 * * 1-5"
    - cron: "5 18 * * 1-5"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:
    inputs:
      minutes:
        description: "how long to collect; must leave room under the job timeout"
        default: "45"
      poll:
        description: "seconds between polls of the news feed"
        default: "60"
      max_usd:
        description: "model spend this invocation may not pass"
        default: "0.05"
      max_per_sweep:
        description: "forecasts per poll; a burst of items is sampled, not chased"
        default: "8"
      universe:
        description: "the symbols swept"
        default: benchmarks/universe-us.txt
      harness:
        description: "the harness that forecasts"
        default: harnesses/news-equity-5m-jev.json

# Read-only on purpose. Live rows belong in Postgres, and the one thing this
# workflow must never do is write to the branch the loop chains its generations
# off.
permissions:
  contents: read
  issues: write

# Sweeps are hours apart, but a queued runner and a forty-five-minute
# collection can still overlap two of them — two collectors appending to one
# forecasts file and each spending its own ceiling. Queue instead.
concurrency:
  group: live-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Forty-five minutes of collection, then up to six more waiting out the
    # horizon of the last poll's forecasts, then the publish. Sixty leaves room
    # for a slow checkout without leaving room for a hang.
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      # At job level, not on the publish step: a step's own `env:` block is not
      # in scope when that step's `if:` is evaluated, which is how the loop's
      # reader went unfed for a week.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      # The model cache only. The tool cache is deliberately not used here: it
      # has no TTL because settled history cannot change, and these names are
      # still trading, so the collector builds its box through `live_tools`.
      - name: Restore the model cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: live-news-cache-${{ github.run_id }}
          restore-keys: live-news-cache-

      - name: Check the keys
        id: keys
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # No venue keys is not a broken workflow: the news topic simply is
          # not switched on yet. Say so and finish green.
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=no Alpaca keys::APCA_API_KEY_ID / APCA_API_SECRET_KEY are not set; nothing to collect from"
            { echo "### Live news collection skipped";
              echo "No Alpaca keys in this repository's secrets. A free account gives the IEX feed and the news feed; add APCA_API_KEY_ID and APCA_API_SECRET_KEY to switch this on."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # Asked before spending rather than discovered afterwards. A balance
      # below this invocation's ceiling skips the collection and says so; it is
      # not a failure, there was simply nothing to collect with. A balance this
      # cannot read does not block anything: --max-usd still bounds the run.
      - name: Is there anything left to spend
        id: credit
        if: steps.keys.outputs.have == 'true'
        shell: bash
        run: |
          ceiling="${{ inputs.max_usd || '0.05' }}"
          balance="import json,sys; d=json.load(sys.stdin)['data']; print(round(float(d['total_credits']) - float(d['total_usage']), 4))"
          left=$(curl -sS --max-time 20 -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                   https://openrouter.ai/api/v1/credits 2>/dev/null \
                 | python -c "$balance" 2>/dev/null || echo unknown)
          if [ "$left" = "unknown" ]; then
            echo "::warning title=balance unknown::could not read the OpenRouter balance; --max-usd is the only bound this run"
            echo "enough=true" >> "$GITHUB_OUTPUT"
          elif python -c "import sys; sys.exit(0 if float('$left') >= float('$ceiling') else 1)"; then
            echo "enough=true" >> "$GITHUB_OUTPUT"
            echo "### Live news collection" >> "$GITHUB_STEP_SUMMARY"
            echo "- \$$left on the key, spending at most \$$ceiling" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enough=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=nothing to spend::\$$left left, under the \$$ceiling this invocation would need; skipping"
            { echo "### Live news collection skipped";
              echo "\$$left left on the key, under the \$$ceiling ceiling. The loop has first claim on what is left, so this invocation collected nothing and the job is green."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The script writes the spend, the counts and what it skipped into the
      # step summary itself, and stops on its own if either feed refuses.
      - name: Collect
        if: steps.keys.outputs.have == 'true' && steps.credit.outputs.enough == 'true'
        # Named explicitly because that is what turns on `pipefail`: the default
        # shell is `bash -e`, under which `python ... | tee` reports tee's exit
        # code.
        shell: bash
        run: |
          set -o pipefail
          python scripts/collect_live_news.py \
            --universe "${{ inputs.universe || 'benchmarks/universe-us.txt' }}" \
            --harness "${{ inputs.harness || 'harnesses/news-equity-5m-jev.json' }}" \
            --minutes "${{ inputs.minutes || '45' }}" \
            --poll "${{ inputs.poll || '60' }}" \
            --max-per-sweep "${{ inputs.max_per_sweep || '8' }}" \
            --max-usd "${{ inputs.max_usd || '0.05' }}" | tee live.txt

      # `always()`, because a cancelled job leaves real forecasts on disk that
      # nothing else will ever publish. A missing database secret is a warning
      # rather than a failure for the same reason it is in the loop: the work
      # already happened.
      - name: Publish to the reader
        if: always() && env.SUPABASE_DB_URL != '' && steps.keys.outputs.have == 'true'
        shell: bash
        run: |
          pip install -q psycopg2-binary
          python scripts/publish_live.py runs/live/news-forecasts.jsonl | tee -a live.txt \
            || echo "::warning::publishing failed; the forecasts are in the run artifact"
          if [ -s live.txt ]; then
            { echo '```'; tail -n 40 live.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The only copy outside Postgres. Kept for the days the publish fails, and
      # kept short: nothing here is worth a month of storage.
      - name: Keep the forecasts as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-news-${{ github.run_id }}
          path: runs/live
          retention-days: 14
          if-no-files-found: ignore

      - name: Say so if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "live news collection failed: $(date -u +%Y-%m-%d) run ${{ github.run_id }}" \
            --body "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed — most likely the news feed, the bars, or the key." \
            || echo "::warning::could not open an issue about the failure"
