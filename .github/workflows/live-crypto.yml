# Forecasts on the spot market as it trades, one a minute per coin.
#
# The crypto loop scores the harness against bars already on disk. This is the
# other half - the same harness, the same box, pointed at BTC, ETH and SOL as
# they trade - and it is the only place the arena sees an order book, which has
# no history and so no replay form. The market never closes, so the schedule is
# a cadence rather than a fixture list: a four-hour sweep every four hours,
# one forecast per coin per minute, each scored a minute later when the bar
# prints - near-continuous, because a forecast costs two thousandths of a cent
# and the book snapshots are the only record of the book there will ever be. Rows go to Postgres and nothing is committed back: runs/live/ is
# gitignored on purpose.
#
# No exchange key. The bars, the tape and the book come from
# data-api.binance.vision, which answers a GitHub runner; api.binance.com and
# fapi.binance.com return 451 from one, which is why the perp side reads OKX's
# public endpoints instead. Needs two repository secrets: OPENROUTER_API_KEY
# and SUPABASE_DB_URL.
name: live-crypto
on:
  schedule:
    # Six sweeps a day, five past the hour so a queued runner still lands on
    # a round minute. On the Jev seed a sweep is seventy-five forecasts at
    # about two thousandths of a cent each; the ceiling is the runner's time.
    # Every four hours, not every hour: GitHub's scheduler fired the hourly
    # cron three to five hours apart on this repository (seven runs in a day
    # against twenty-four asked for), so continuous coverage cannot lean on
    # the cron. A sweep is nearly four hours long instead, and the concurrency
    # group queues the next firing behind it.
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "how long to collect; must leave room under the job timeout"
        default: "230"
      max_usd:
        description: "model spend this invocation may not pass"
        default: "0.30"

# Read-only on purpose. Live rows belong in Postgres, and the one thing this
# workflow must never do is write to the branch the loop chains its generations
# off.
permissions:
  contents: read
  issues: write

# A queued runner and a four-hour sweep can overlap the next firing:
# two collectors appending to one file and each spending its own ceiling.
# Queue instead.
concurrency:
  group: live-crypto
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Nearly four hours of collection, a few more waiting out the last tick's
    # horizon, then the publish. Two-fifty leaves room for a slow checkout without
    # leaving room for a hang; the concurrency group keeps the next hour's sweep
    # from starting on top of this one.
    timeout-minutes: 250
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # At job level, not on the publish step: a step's own `env:` block is not
      # in scope when that step's `if:` is evaluated.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Check the key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The tool cache under .cache/tools is deliberately not restored here:
      # it has no TTL because settled history cannot change, and this market
      # is still trading, so the collector builds its box through `live_tools`.
      # The script stops on its own if the key refuses three calls in a row,
      # and writes its counts into the step summary itself.
      - name: Collect
        shell: bash
        run: |
          python scripts/collect_live_crypto.py \
            --harness harnesses/crypto-horizon-1m-jev.json \
            --minutes "${{ inputs.minutes || '230' }}" \
            --every 60 \
            --max-usd "${{ inputs.max_usd || '0.30' }}" \
            --window-usd 0.01 | tee live.txt

      # `always()`, because a cancelled job still leaves real forecasts on disk
      # that nothing else will ever publish. A missing database secret is a
      # warning rather than a failure: the work already happened.
      - name: Publish to the reader
        if: always() && env.SUPABASE_DB_URL != ''
        shell: bash
        run: |
          pip install -q psycopg2-binary
          python scripts/publish_live.py runs/live/crypto-forecasts.jsonl | tee -a live.txt \
            || echo "::warning::publishing forecasts failed; they are in the run artifact"
          python scripts/publish_books.py runs/live/crypto-books.jsonl | tee -a live.txt \
            || echo "::warning::publishing books failed; they are in the run artifact"
          if [ -s live.txt ]; then
            { echo '```'; tail -n 40 live.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The paper book: what this sweep's forecasts would have bought. The
      # trader starts from the previous run's state, restored here by prefix -
      # each run saves under its own run id and the newest match wins - so the
      # book runs on across sweeps. `always()`, for the same reason the publish
      # is: a cancelled sweep still left forecasts on disk. The cache is a
      # convenience with a week's TTL, not the record. The database is the
      # durable copy, and `paper_trade.py --restore-from-db --topic crypto-horizon-1m`
      # rebuilds the state from it when the cache has been evicted.
      - name: Restore the paper book
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: runs/live/books
          key: paper-book-crypto-horizon-1m-${{ github.run_id }}
          restore-keys: paper-book-crypto-horizon-1m-

      - name: Paper-trade the sweep
        if: always()
        shell: bash
        run: |
          if [ ! -f runs/live/crypto-forecasts.jsonl ]; then
            echo "no forecasts this run; the book is unchanged"
            exit 0
          fi
          python scripts/paper_trade.py \
            --topic crypto-horizon-1m \
            --forecasts runs/live/crypto-forecasts.jsonl \
            --books runs/live/crypto-books.jsonl \
            --harness harnesses/crypto-horizon-1m-jev.json \
            --state runs/live/books/crypto-horizon-1m.json | tee -a live.txt \
            || echo "::warning::paper trading failed; the forecasts are in the run artifact"

      # Saved whenever there is a state to save, whether or not this run
      # traded, so the next sweep starts where this one stopped.
      - name: Save the paper book
        if: always() && hashFiles('runs/live/books/**') != ''
        uses: actions/cache/save@v4
        with:
          path: runs/live/books
          key: paper-book-crypto-horizon-1m-${{ github.run_id }}

      # The trades and marks appended this run, and the book's running stats.
      # Same sidecar as the forecasts: only rows past the last commit go.
      - name: Publish the paper book
        if: always() && env.SUPABASE_DB_URL != ''
        shell: bash
        run: |
          pip install -q psycopg2-binary
          python scripts/publish_trading.py --topic crypto-horizon-1m | tee -a live.txt \
            || echo "::warning::publishing the paper book failed; it is in the run artifact"

      # The only copy outside Postgres. Kept for the days the publish fails,
      # and kept short: nothing here is worth a month of storage.
      - name: Keep the forecasts as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-crypto-${{ github.run_id }}
          # runs/live/books - the paper book's state - rides in it, so a run
          # whose cache was evicted still has yesterday's book somewhere.
          path: |
            runs/live
            runs/live/books
          retention-days: 14
          if-no-files-found: ignore

      - name: Say so if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "live crypto collection failed: $(date -u +%Y-%m-%d) run ${{ github.run_id }}" \
            --body "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed - most likely a feed (Binance data host, OKX) or the key." \
            || echo "::warning::could not open an issue about the failure"
