# Forecasts on markets that are still trading, collected while the matches are on.
#
# The loop scores the harness against settled matches: every answer is graded
# against a price already on disk. This is the other half — the same harness,
# the same frozen toolbox, pointed at a book nobody has read the end of — and it
# only exists during the hours somebody is playing football. Rows go to Postgres
# and nothing is committed back: runs/live/ is gitignored on purpose, because a
# workflow that pushes to main every hour makes the lineage unreadable.
#
# Needs two repository secrets: OPENROUTER_API_KEY and SUPABASE_DB_URL.
name: live
on:
  # Kickoff times, in UTC, and the schedule that follows them:
  #
  #   European weekday evenings   17:00–22:00 (a 22:00 kickoff ends about 23:50)
  #   European weekend afternoons 11:00 onwards, through the evening slots
  #   MLS and Liga MX             23:00–05:00, the night after each of those
  #
  # An earlier draft of this file ran hourly across all three bands — ninety-six
  # invocations a week, which is the right shape when the point is coverage. It
  # is the wrong shape now: the key is down to about twelve dollars of its
  # original 5,626 and the evolution loop has first claim on what is left. So
  # one invocation per band instead, placed mid-window where the most matches
  # are in play rather than at its edge:
  #
  #   19:05 weekdays — the 18:45 and 19:00 kickoffs are twenty minutes old and
  #                    the 20:00 ones are pricing
  #   15:05 weekends — Saturday's 14:00 and 15:00 slates, before the evening
  #   01:05 daily    — two hours into the MLS and Liga MX card, which is the
  #                    same block whether the evening that fed it was Tuesday's
  #                    or Saturday's, so it runs every day rather than twice
  #
  # Fourteen invocations a week at fifty cents each: seven dollars a week of
  # ceiling, against a loop that wants seventy a day when it is funded. The
  # balance check below is what actually decides, and it is written to skip
  # rather than fail — an empty key is not a broken workflow.
  schedule:
    # Where the matches are, not where a tidy schedule would put them. The
    # first ninety-seven live forecasts included exactly three on markets that
    # moved, because one short sweep a day mostly caught pre-match books pinned
    # days from kickoff. Eight kickoff-shaped slots replaced that, and on 28
    # September GitHub fired none of the two weekday ones: a Belgium-France
    # Nations League match played out with no forecast at all. The scheduler is
    # best-effort on a busy repository and drops firings without saying so, the
    # same way it turned the crypto sweep's hourly cron into seven runs a day.
    # So coverage comes from the length of a sweep rather than the punctuality
    # of a cron: six firings a day, each running nearly four hours, queued
    # behind each other by the concurrency group. A sweep with no match in play
    # costs the poll loop and nothing else.
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "leagues to sweep, or 'all' for every verified competition"
        # 'all' is the seventy-three competitions with a verified series ticker
        # and a working fixture feed in rsi_arena/kalshi/_series.py, biggest
        # first. This input used to name eight domestic leagues, which is why a
        # Thursday of UEFA Nations League fixtures produced no forecasts at all:
        # no continental or national-team competition was swept, and the series
        # ticker the sweep would have asked for did not exist.
        default: all
      minutes:
        description: "how long to collect; must leave room under the job timeout"
        default: "230"
      max_usd:
        description: "model spend this invocation may not pass"
        default: "0.5"
      max_contracts:
        description: "markets forecast per sweep; the ceiling divided over the window"
        # Eight, not two. Two was sized for a narrow card and a nearly empty key;
        # the card is now seventy-three competitions, and a forecast on the Jev
        # harness costs about $0.0002, so eight a sweep over six or seven sweeps
        # is fifty forecasts for roughly a cent. The clock is what binds: each
        # forecast is a model call with tool calls behind it, twenty to thirty
        # seconds, and eight of them is most of the five minutes between sweeps.
        default: "8"
      max_unidentified:
        description: "fail the job past this fraction of unlinkable open events"
        # A fifth, not a tenth. The alarm exists to catch a ticker format
        # changing under us, and it still does at this level. What changed is the
        # card: among seventy-three competitions there are always a few in a
        # round the fixture feed files under a different competition, and holding
        # a wide sweep to the tenth a narrow one achieved would turn every
        # weeknight into a red job nobody reads.
        default: "0.20"
      harness:
        description: "the harness that forecasts"
        default: harnesses/horizon-5m-jev.json

# Read-only on purpose. Live rows belong in Postgres, and the one thing this
# workflow must never do is write to the branch the loop chains its generations
# off.
permissions:
  contents: read
  issues: write

# Bands are hours apart now, but a queued runner and a fifty-minute collection
# can still overlap two of them — two collectors appending to one forecasts.jsonl
# and each spending its own ceiling. Queue instead.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Fifty minutes of collection, then up to six more waiting out the horizon
    # of the last sweep's forecasts — a forecast is only worth keeping once the
    # price it predicted has printed — then the publish. Seventy leaves room for
    # a slow checkout without leaving room for a hang.
    timeout-minutes: 250
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # At job level, not on the publish step: a step's own `env:` block is not
      # in scope when that step's `if:` is evaluated, which is how the loop's
      # reader went unfed for a week.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      # The model cache only, and it earns its place on a re-run of a failed
      # invocation. The tool cache under .cache/tools is deliberately not used
      # here: it has no TTL because settled history cannot change, and these
      # markets are still trading, so collect_live.py builds its box through
      # `live_tools` instead.
      - name: Restore the model cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: live-cache-${{ github.run_id }}
          restore-keys: live-cache-

      - name: Check the key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Asked before spending rather than discovered afterwards. With the key
      # nearly empty, the failure this avoids is a cron that turns every
      # remaining dollar into live evidence the loop needed for a generation —
      # and does it fifty-nine minutes at a time, writing a file of 402s. A
      # balance below this invocation's ceiling skips the collection and says so;
      # it is not a failure, there was simply nothing to collect with. A balance
      # this cannot read does not block anything: --max-usd still bounds the run.
      - name: Is there anything left to spend
        id: credit
        shell: bash
        run: |
          ceiling="${{ inputs.max_usd || '2' }}"
          balance="import json,sys; d=json.load(sys.stdin)['data']; print(round(float(d['total_credits']) - float(d['total_usage']), 4))"
          left=$(curl -sS --max-time 20 -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                   https://openrouter.ai/api/v1/credits 2>/dev/null \
                 | python -c "$balance" 2>/dev/null || echo unknown)
          if [ "$left" = "unknown" ]; then
            echo "::warning title=balance unknown::could not read the OpenRouter balance; --max-usd is the only bound this run"
            echo "enough=true" >> "$GITHUB_OUTPUT"
          elif python -c "import sys; sys.exit(0 if float('$left') >= float('$ceiling') else 1)"; then
            echo "enough=true" >> "$GITHUB_OUTPUT"
            echo "### Live collection" >> "$GITHUB_STEP_SUMMARY"
            echo "- \$$left on the key, spending at most \$$ceiling" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enough=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=nothing to spend::\$$left left, under the \$$ceiling this invocation would need; skipping"
            { echo "### Live collection skipped";
              echo "\$$left left on the key, under the \$$ceiling ceiling. The evolution loop has first claim on what is left, so this invocation collected nothing and the job is green."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fails the job when more than a tenth of the open events could not be
      # attached to a fixture. Identification was 112 of 112 across eight leagues
      # today, so this is a regression alarm: the failure worth catching is the
      # quiet one, where a ticker format shifts and the collection keeps running
      # against a third fewer matches while looking merely uneventful. The script
      # writes the spend, the counts and a ::warning:: per unlinked event into
      # the step summary itself, and stops on its own if the key refuses.
      - name: Collect
        if: steps.credit.outputs.enough == 'true'
        # Named explicitly because that is what turns on `pipefail`: the default
        # shell is `bash -e`, under which `python ... | tee` reports tee's exit
        # code and the identification alarm below would never fail anything.
        shell: bash
        run: |
          python scripts/collect_live.py \
            --league "${{ inputs.league || 'all' }}" \
            --harness "${{ inputs.harness || 'harnesses/horizon-5m-jev.json' }}" \
            --minutes "${{ inputs.minutes || '230' }}" \
            --max-contracts "${{ inputs.max_contracts || '8' }}" \
            --max-usd "${{ inputs.max_usd || '2' }}" \
            --window-usd "0.60" \
            --max-unidentified "${{ inputs.max_unidentified || '0.20' }}" | tee live.txt

      # `always()`, because the two ways the collect step fails — identification
      # degrading past the threshold, or the job being cancelled — both leave
      # real forecasts on disk that nothing else will ever publish. A missing
      # database secret is a warning rather than a failure for the same reason
      # it is in the loop: the work already happened.
      # Before the publisher, not after. `paper_trade.py` writes each cycle's
      # record - the quote posted, the fills that crossed it, what the path did -
      # back onto the forecast row, and `publish_live.py` reads it from there into
      # the three columns migration 010 created for it. Run the other way round,
      # as this was until 4 October, the row reaches the database before the
      # record exists and those columns are null on every live row ever written.
      - name: Restore the paper book
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: runs/live/books
          key: paper-book-kalshi-horizon-5m-${{ github.run_id }}
          restore-keys: paper-book-kalshi-horizon-5m-

      - name: Paper-trade the sweep
        if: always()
        shell: bash
        run: |
          if [ ! -f runs/live/forecasts.jsonl ]; then
            echo "no forecasts this run; the book is unchanged"
            exit 0
          fi
          python scripts/paper_trade.py \
            --topic kalshi-horizon-5m \
            --forecasts runs/live/forecasts.jsonl \
            --harness "${{ inputs.harness || 'harnesses/horizon-5m-jev.json' }}" \
            --state runs/live/books/kalshi-horizon-5m.json | tee -a live.txt \
            || echo "::warning::paper trading failed; the forecasts are in the run artifact"

      # Saved whenever there is a state to save, whether or not this run
      # traded, so the next sweep starts where this one stopped.
      - name: Publish to the reader
        if: always() && env.SUPABASE_DB_URL != ''
        shell: bash
        run: |
          pip install -q psycopg2-binary
          python scripts/publish_live.py | tee -a live.txt \
            || echo "::warning::publishing failed; the forecasts are in the run artifact"
          if [ -s live.txt ]; then
            { echo '```'; tail -n 40 live.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The paper book: what this sweep's forecasts would have bought. The
      # trader starts from the previous run's state, restored here by prefix -
      # each run saves under its own run id and the newest match wins - so the
      # book runs on across sweeps. `always()`, for the same reason the publish
      # is: a cancelled sweep still left forecasts on disk. The cache is a
      # convenience with a week's TTL, not the record. The database is the
      # durable copy, and `paper_trade.py --restore-from-db --topic kalshi-horizon-5m`
      # rebuilds the state from it when the cache has been evicted.
      - name: Save the paper book
        if: always() && hashFiles('runs/live/books/**') != ''
        uses: actions/cache/save@v4
        with:
          path: runs/live/books
          key: paper-book-kalshi-horizon-5m-${{ github.run_id }}

      # The trades and marks appended this run, and the book's running stats.
      # Same sidecar as the forecasts: only rows past the last commit go.
      - name: Publish the paper book
        if: always() && env.SUPABASE_DB_URL != ''
        shell: bash
        run: |
          pip install -q psycopg2-binary
          python scripts/publish_trading.py --topic kalshi-horizon-5m | tee -a live.txt \
            || echo "::warning::publishing the paper book failed; it is in the run artifact"

      # The sweep's own files, off the runner before it is recycled.
      #
      # Postgres is the durable home for a live forecast and its book, and
      # runs/live/ is gitignored on purpose - this workflow must never write to
      # the branch the loop chains its generations off. What was missing is a copy
      # for the days the publish fails: the artifact below holds one for a
      # fortnight and then it is gone. The loop's trajectories now live under
      # s3://$TRACE_BUCKET/rsi-arena/<topic>/<run>/; the sweeps live beside them
      # under rsi-arena/live/<topic>/<date>/, one prefix per UTC day.
      #
      # sync, not cp: several sweeps a day append to the same jsonl, so each one
      # uploads what the last one did not rather than the file again.
      #
      # A failed sync here is a warning, not a job failure - unlike loop.yml,
      # where S3 is the only home the rollouts have left. Here the rows are
      # already in Postgres, and an issue every time a sync blips teaches people
      # to stop reading the issues.
      - name: Keep the sweep in S3
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
          TRACE_BUCKET: ${{ secrets.TRACE_BUCKET }}
          TOPIC: kalshi-horizon-5m
        run: |
          # Checked in the body, not in `if:`. A step's own env block is not in
          # scope when its `if:` is evaluated - the same trap that kept
          # SUPABASE_DB_URL reading empty and the reader unfed for a fortnight.
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice title=no AWS credentials::the sweep stays in Postgres and the run artifact"
            exit 0
          fi
          if [ -z "$TRACE_BUCKET" ]; then
            echo "::notice title=no bucket::AWS credentials are set but TRACE_BUCKET is not; skipping"
            exit 0
          fi
          if [ -z "$(ls -A runs/live 2>/dev/null)" ]; then
            echo "::notice::nothing in runs/live to upload"
            exit 0
          fi
          # The whole directory: this runner only ever holds one topic's sweep
          # (the paper-book cache is keyed per topic), so there is nothing here
          # that belongs under another topic's prefix.
          dest="s3://$TRACE_BUCKET/rsi-arena/live/$TOPIC/$(date -u +%Y-%m-%d)/"
          for attempt in 1 2 3; do
            if aws s3 sync runs/live "$dest" --only-show-errors; then
              echo "- sweep in \`$dest\` (attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::S3 sync attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep $((attempt * 20 - 10))
          done
          echo "::warning::S3 sync failed after three attempts; the sweep is in Postgres and in the run artifact"

      # The only copy outside Postgres. Kept for the days the publish fails, and
      # kept short: nothing here is worth a month of storage.
      - name: Keep the forecasts as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ github.run_id }}
          # runs/live/books - the paper book's state - rides in it, so a run
          # whose cache was evicted still has yesterday's book somewhere.
          path: |
            runs/live
            runs/live/books
          retention-days: 14
          if-no-files-found: ignore

      # Identification degrading is the one failure this job raises loudly, and
      # until now it raised it into a step summary nobody opens.
      - name: Say so if this failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "live collection failed: $(date -u +%Y-%m-%d) run ${{ github.run_id }}" \
            --body "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed — most likely the fixture-identification alarm or the feed." \
            || echo "::warning::could not open an issue about the failure"
