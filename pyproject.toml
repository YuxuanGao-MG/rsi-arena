[project]
name = "rsi-arena"
version = "0.1.0"
description = "Harness-vs-harness arena with a self-improvement loop, applied first to Kalshi soccer markets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "gepa>=0.1.4",
    # Undeclared, and used. The Kalshi client signs with it; the publisher needs
    # psycopg2. Both were being installed by hand or not at all — one scheduled
    # run installed psycopg2-binary inline in the workflow.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "tqdm>=4.66"]
publish = ["psycopg2-binary>=2.9"]

[project.scripts]
rsi-arena = "rsi_arena.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rsi_arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
