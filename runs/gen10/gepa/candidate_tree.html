ath\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"pattern_check\",\n      \"output_key\": \"pattern\",\n      \"prompt\": \"Contract: {{question}}\\nGame state: {{game}}\\nCurrent book: {{quote}}\\nMinute bars: {{path}}\\nRecent prints: {{tape}}\\n\\nIdentify whether ANY of these three tradeable patterns exists RIGHT NOW:\\n\\n1. ACTIVE POST-GOAL SPIKE FADE (rare, very short window):\\n   - A goal was scored in the last 1-3 minutes (check recent_events timestamp and candlestick volume spike)\\n   - Price spiked 10+ cents and has NOT yet drifted back to pre-spike\\n   - Pattern: -1 to -3c fade over next 5 min as book digests\\n   - If the goal was >4 minutes ago OR price already drifted back, this pattern is NOT active\\n\\n2. LATE-MATCH TIME DECAY (the most reliable, but narrow conditions):\\n   - Score is NOT level (one team leads)\\n   - Clock shows <25 minutes remaining in the match (check period and clock)\\n   - For the TRAILING team's contract: -0.5 to -2c per 5 min\\n   - For the LEADING team's contract: +0.5 to +2c per 5 min\\n   - Magnitude depends on current price (stronger at mid-range prices, weaker at extremes)\\n   - If score is level OR >25 min remain, this pattern does NOT apply\\n\\n3. THIN-BOOK DRIFT BACK (uncommon):\\n   - A single large order moved the mid 2+ cents in the last 5-10 minutes\\n   - Volume in that minute was 3x+ normal\\n   - No goal or card to justify the move\\n   - Pattern: -1 to -2c drift back toward prior level\\n\\nCheck each pattern's conditions carefully. Most of the time (early in match, level score, goal absorbed, stable book) NONE of these patterns exist.\\n\\nBe strict: if clock >25 min remain, time decay does NOT exist yet. If a goal was >4 min ago, spike fade is over. If the book has been stable, there's no drift pattern.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"minutes_remaining\": {\n            \"type\": \"number\",\n            \"description\": \"Minutes left in match (90 min total, account for period)\"\n          },\n          \"active_pattern\": {\n            \"type\": \"string\",\n            \"enum\": [\"post_goal_fade\", \"time_decay\", \"book_drift\", \"none\"],\n            \"description\": \"Which pattern exists right now, or none\"\n          },\n          \"pattern_confidence\": {\n            \"type\": \"string\",\n            \"enum\": [\"strong\", \"weak\"],\n            \"description\": \"How clearly the pattern conditions are met\"\n          },\n          \"pattern_reasoning\": {\n            \"type\": \"string\",\n            \"description\": \"Why this pattern exists or why none exists. Be specific about timing, score, and price action.\"\n          }\n        },\n        \"required\": [\"minutes_remaining\", \"active_pattern\", \"pattern_confidence\", \"pattern_reasoning\"],\n        \"additionalProperties\": false\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Pattern analysis: {{pattern}}\\nCurrent book: {{quote}}\\nGame: {{game}}\\n\\nForecast the 5-minute delta_cents:\\n\\nIF pattern.active_pattern == \\\"none\\\":\\n  - Predict delta_cents = 0\\n  - Set half_width_cents = 2 to 3 (acknowledging normal book noise)\\n  - Confidence = 0.5 to 0.7 (predicting no-change is a real call)\\n  - Most of the time, especially early in matches or with level scores, the right answer is zero.\\n\\nIF pattern.active_pattern == \\\"time_decay\\\" AND pattern_confidence == \\\"strong\\\":\\n  - If this contract is for the TRAILING team: predict -0.5 to -2c depending on current price level\\n  - If this contract is for the LEADING team: predict +0.5 to +2c depending on current price level\\n  - Magnitude: stronger at 20-60c range, weaker at extremes (<10c or >80c)\\n  - Set half_width_cents = 1.5 to 2.5\\n  - Confidence = 0.6 to 0.75\\n\\nIF pattern.active_pattern == \\\"post_goal_fade\\\" AND pattern_confidence == \\\"strong\\\":\\n  - Predict -1 to -3c fade back toward pre-spike level\\n  - Check candlesticks to see how much it already faded\\n  - Set half_width_cents = 2 to 3\\n  - Confidence = 0.5 to 0.65\\n\\nIF pattern.active_pattern == \\\"book_drift\\\":\\n  - Predict -1 to -2c drift back\\n  - Set half_width_cents = 2.5 to 3.5\\n  - Confidence = 0.4 to 0.55\\n\\nIF pattern_confidence == \\\"weak\\\" on any pattern:\\n  - Reduce magnitude by 50% or predict 0\\n  - Widen half_width by 0.5-1c\\n\\nRemember: delta_cents is the CHANGE (positive or negative), not an absolute price. Zero is a valid and often correct prediction.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, positive for up, 0 when no pattern exists.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of your two-sided quote, in cents. Tighter (1.5-2.5) for strong patterns, wider (2.5-3.5) for weak/none.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1 scale. Around 0.5-0.7 for none, 0.6-0.75 for strong patterns.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"Name the specific pattern driving your call, or explicitly state why nothing will move it.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would prove this forecast wrong before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.50)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.50)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.49)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
