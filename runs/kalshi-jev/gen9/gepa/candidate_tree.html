ict zero.\n   \n   - **Goals that happen during your five-minute forecast window are unpredictable.** Example 1 (mid stable at 0.575-0.58 for 15+ minutes, then jumped +7.5c during the window) and Example 3 (mid stable at 0.515 for 20+ minutes, then dropped -3c during the window) both showed surprise goals. The correct forecast in each case was zero\u2014there was no basis to predict these events. You are measured against no-change, which also misses surprise goals. Do not try to \"predict\" goals by adding risk premia or small directional biases.\n\n3. **Check the game clock for time decay.** Time decay is meaningful **only in the final 10-15 minutes** of a match:\n   \n   - At 85', 88', or stoppage time, five minutes of clock can move a \"will score\" or \"will tie\" probability by 1-2 cents as the window closes.\n   \n   - At 75', 65', 55', 45', 25', or earlier, five minutes changes the probability by less than 0.5 cents. **This is below the noise floor.** Predict zero.\n   \n   - Example 5 (75' in MLS, mid 0.085): The book was stable. Predicted -0.1c, market moved -0.5c (a surprise goal), earned +0.10 skill only because the direction happened to match. At 75' with 15+ minutes remaining, decay is negligible and the correct forecast was zero. The -0.5c move was a goal during the window.\n   \n   - **Halftime (45') and early second half (45'-50')** do not have meaningful time decay on a five-minute horizon. Example 1 (45' second half start) and Example 8 (45' second half start) both had stable mids before the window; predicting zero would have been correct. In Example 1, the market jumped +7.5c (surprise goal); in Example 8, it rose +1c (possibly a goal or book adjustment).\n\n4. **Check for book mean reversion.** This requires:\n   \n   - A discontinuous jump in the last 1-2 minutes (not a gradual drift).\n   - Low volume on that jump (suggesting a thin book hit by one order).\n   - The mid at a new level for less than 3 minutes.\n   \n   If these conditions hold, predict a small retracement (1-2 cents). Otherwise, predict zero. A mid that has been stable for 3+ minutes is not reverting.\n\n5. **If no catalyst is present, predict zero with a tight half_width (0.3-0.5c).**\n\n**What does NOT qualify as a catalyst:**\n\n- Small time decay at 25', 45', 55', 65', or 75'. Examples 1, 5, 6, 7, 8 all had clocks between 45' and 75'. None had meaningful time decay. The moves that occurred were surprise goals, not decay.\n\n- Goals that already happened and are reflected in stable prices. If the candlesticks show the mid has been flat for 5+ minutes, the goal is absorbed. Examples 1, 2, 3, 4 all had stable candlesticks for many minutes before their windows\u2014the large moves during the windows were new goals, unpredictable.\n\n- General \"volatility\" or \"momentum.\" Example 2 (25' in MLS, 0-0): Mid stable at 0.525 for 20+ minutes. Predicted -0.0c (correct). Market stayed at 0.485-0.495, earning +0.02 skill. The book was stable and the correct forecast was zero.\n\n- Market direction based on score alone. A team being ahead or behind does not tell you where the price will be in five minutes unless the clock is under 80' and time decay applies, or a goal just happened in the last 1-2 minutes.\n\n**When you do predict a non-zero move:**\n\n- State the specific catalyst clearly: \"Time decay: at 88' on a 0-0 draw, five minutes reduces 'home score' probability from 21.5c to ~20c\" or \"Book mean reversion: mid jumped from 0.185 to 0.215 in the last 90 seconds on low volume, expect partial drift back to 0.20-0.21\" or \"Goal absorption: mid moved from 0.57 to 0.75 at 47', now 48', market may add another 1-2c as full impact is priced.\"\n\n- Typical moves when they actually happen are 1-4 cents. Do not predict 0.1c, 0.2c, 0.5c moves\u2014either predict zero or predict at least 1 cent.\n\n- Your half_width should reflect genuine uncertainty. If you predict zero, use 0.3-0.5c (you are confident nothing will happen). If you predict a 2-cent move but are uncertain whether the catalyst will fire, use 1-2c.\n\n**Scoring and skill:**\n\nSkill is measured as 1 minus (your error / no-change error), pooled over windows. \n\n- Predicting zero when the market stays flat earns exactly zero skill (you match no-change). This is the correct baseline. Examples 4, 6, 7 all predicted near-zero on flat markets and earned -0.03, -0.01, +0.00 skill\u2014essentially neutral.\n\n- Predicting zero when the market moves earns negative skill, but only if the move was predictable. Examples 1, 3, 5, 8 all had surprise moves during the window (goals); predicting zero would have earned zero skill, which is correct\u2014you cannot predict surprise goals.\n\n- Only predicting the direction and rough size of moves that actually happen earns positive skill. But most moves are surprise goals during your window, which you cannot predict. Example 2 earned +0.02 skill by predicting zero on a book that stayed near its level.\n\n**Paper trading:**\n\nRound-trip fees on Kalshi are 2-3 cents. A forecast is only worth trading if the expected move exceeds the round-trip cost plus your half_width. If you predict a 1-cent move with 0.5c half_width, the edge is 1 - (2.5 + 0.5) = -2 cents\u2014no trade. You need to predict at least 3-4 cents to clear the friction.\n\nDo not predict tiny moves to \"be cautious.\" Predict zero unless the expected move is large and confident enough to trade profitably.\n\n**Critical rule: When in doubt, predict zero.**\n\nThe feedback shows that predicting zero on a stable book is the correct baseline. Examples 2, 4, 6, 7 all had stable books and predicted near-zero, earning neutral to slightly positive skill. Examples 1, 3, 5, 8 all had surprise moves that were unpredictable\u2014predicting zero would have been correct.\n\nYour goal is not to predict every wiggle. Your goal is to identify the rare windows where a specific catalyst will move the price by enough to matter, and to predict zero the rest of the time.\n\n const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.50)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.50)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.50)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.50)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.50)", fillcolor=cyan, tooltip=" "];
    5 [label="5\\n(0.50)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.50)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
    1 -> 4;
    3 -> 5;
    1 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
