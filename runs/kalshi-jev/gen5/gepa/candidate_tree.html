s negligible (maybe 0.2c). Predict zero.\n   - For contracts near boundaries (below 0.10 or above 0.90), even strong time decay is compressed. A contract at 0.015 can only fall 1.5c total. At 85' it might decay 0.3c, which is noise. Predict zero.\n\n4. GOAL LIKELIHOOD:\n   - Goals happen randomly at a base rate of one every 35-40 minutes in soccer (~2.5 per 90-minute match)\n   - A random five-minute window has ~10-15% chance of containing a goal\n   - You CANNOT predict when a goal will happen from score, clock, or recent events alone\n   - Goals cause large moves (10-30 cents depending on the contract), but they are not forecastable from the available data\n   - When a goal happens and you predicted zero, you score zero skill (not negative)\u2014this is correct\n   - Do not predict a move based on \"attacking momentum,\" \"pressure,\" or \"expectation\" of a goal\n\nIF NONE OF THESE FOUR CATALYSTS EXIST, PREDICT ZERO.\n\nCHECKING THE CATALYSTS:\n\nBefore predicting anything other than zero, verify:\n\n- Check recent_events: Is there a goal in the last 2-3 minutes? If yes, check candlesticks to see if the mid is still moving. If the mid has been stable for 2+ minutes, absorption is done.\n\n- Check candlesticks: Has the mid been at the same level (within 0.5c) for the last 3-5 minutes? If yes, the book is stable. Predict zero unless a new catalyst arrives.\n\n- Check previous_trades: When was the last trade? If it was 3+ minutes ago, the book is quiet. If recent trades are heavy (multiple trades of 100+ contracts in the last 60 seconds), check if this aligns with a recent goal. If not, it's normal activity.\n\n- Check the clock: Is there less than 10 minutes remaining in regulation? If not, time decay is negligible. Predict zero.\n\nEXAMPLE ANALYSIS:\n\nExample 1 (25' into a 0-0 game, mid 0.145): No recent goals. Candlesticks show mid oscillating between 0.125-0.135 for 20+ minutes, now at 0.145. Recent trades show 62 and 0.02 contracts just seconds ago. No catalyst. Predict zero. \u2713 Correct (actual: +0.0c).\n\nExample 2 (55' into a 0-1 game, mid 0.575): No recent goals (last goal was in first half). Candlesticks show mid stable around 0.58-0.60 since the goal, now at 0.575. Recent trades show 41 and 33 contracts just seconds ago. Clock is 55' with 35 minutes left. No catalyst. Predict zero. \u2713 Correct (actual: +0.0c).\n\nExample 4 (55' into a 0-0 game, mid 0.430): No recent goals. Candlesticks show mid drifting down from 0.57 to 0.43 over 40 minutes\u2014this is a slow drift, not a sharp move. Recent trades show 437 and 108 contracts just seconds ago. No catalyst. Predict zero. (Actual: +1.5c, but this was unpredictable noise. Predicting zero was correct.)\n\nExample 7 (5' into a 0-0 game, mid 0.630): Game just started. Candlesticks show mid stable around 0.635 for the last 5 minutes. Recent trades show 4.57 and 1.52 contracts just seconds ago. No catalyst. Predict zero. (Actual: +0.5c, unpredictable noise. Predicting zero was correct.)\n\nExample 8 (65' into a 0-1 game, mid 0.525): No recent goals (last goal was in first half). Candlesticks show mid volatile between 0.54-0.60 over the last 30 minutes, now at 0.525. Recent trades show 27 and 365 contracts just seconds ago. Clock is 65' with 25 minutes left. No catalyst. Predict zero. (Actual: -3.0c, which may have been a goal or large order. Unpredictable. Predicting zero was correct.)\n\nHALF WIDTH:\n\nWhen you predict zero, use half_width 0.5c. This reflects that the market should stay within a narrow range if no catalyst exists.\n\nIf a strong catalyst exists (e.g., ongoing goal absorption visible in candlesticks, or final 5 minutes with material time decay), use half_width 0.8-1.2c to reflect genuine uncertainty about timing and magnitude.\n\nPOSITION SIZING:\n\nThe harness has been successfully avoiding trades (7 out of 8 examples show \"hold 0%\"). This is correct when predicting zero: there is no edge, so no trade.\n\nWhen you do identify a catalyst and predict a non-zero move, the default rule applies: edge = |delta| - (round-trip cost + half_width). Only trade if edge is positive.\n\nYOUR GOAL:\n\nScore positive skill by calling moves that actually happen. Predicting zero when no catalyst exists is the right answer and earns zero skill, which is better than negative skill. The only way to earn positive skill is to identify one of the four catalysts when it exists and predict the direction and rough magnitude of the resulting move.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"forecast\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"questions\": {\n        \"move\": {\n          \"type\": \"score\",\n          \"instructions\": \"How many cents the contract's mid price moves over the next five minutes, from the book shown now. Positive is up. A quiet book at a settled score usually stays within half a cent.\",\n          \"criteria\": [\n            \"down 4 cents or more\",\n            \"down const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.50)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.50)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.50)", fillcolor=cyan, tooltip=" "];
    3 [label="3\\n(0.50)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.50)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.50)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.50)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
    2 -> 4;
    1 -> 5;
    3 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
