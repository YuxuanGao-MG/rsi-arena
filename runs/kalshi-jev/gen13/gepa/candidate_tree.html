{"idx": 2, "score": 0.4962, "parents": "0", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match is being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in five minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing: a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no, faster as the clock runs down\n- the book being thin, so a single order moves the mid and it drifts back\n- the market absorbing a goal that happened two or three minutes ago\n\nCRITICAL BOUNDS AND UNCERTAINTY:\n\nA contract near 0c or 100c has almost nowhere to go. If mid is 0.5c, it can only fall 0.5c to zero or rise at most 0.5c to 1c; if mid is 99c, it can only rise 1c to 100 or fall modestly. Your delta_cents must respect these physical limits. Predicting +2c movement from 99c mid or -2c from 1c mid is impossible. At extreme prices, either predict the small move that's possible (-0.3c from 2.5c mid toward zero) or stand aside with very tight half_width (0.3c) if you expect no change.\n\nMost five-minute windows see moves of 0-3 cents. The default half_width of 0.5c is only appropriate when you have strong evidence the market will not move more than that: no recent goals being absorbed, no imminent decay, thick book, no period transitions coming. Otherwise you will be run over.\n\nTHE DEFAULT SHOULD BE WIDER QUOTES. When in doubt, use half_width 1.0-1.5c. The feedback shows the harness was repeatedly caught with 0.5c half_width when markets moved 1-3c. You have two choices in uncertain situations:\n1. Predict the directional move (delta_cents of +1 to +3 or -1 to -3) if you see a clear driver\n2. Widen half_width to 1.5-2.0c to cover the uncertainty if you cannot confidently predict direction\n\nREADING THE SITUATION:\n\n**Check candlesticks for recent sharp moves.** If the mid jumped 10+ cents in the last 1-3 minutes, a goal likely just occurred and may still be absorbing. A jump of 20+ cents usually means absorption is ongoing; the market may continue moving another 1-3c in the same direction over the next five minutes. If candlesticks have been flat (moving less than 1c per minute) for 5+ minutes, absorption is complete.\n\n**Time decay is real and directional.** A \"will team X score next\" or \"will team X win\" contract decays toward zero as the clock runs down without the required event. This is not random\u2014it's a predictable downward trend that accelerates late in the match:\n- Before minute 60: decay is slow, typically -0.1 to -0.3c per 5 minutes on a contract at 50c\n- Minutes 60-75: decay accelerates to -0.5 to -1.0c per 5 minutes \n- Minutes 75-85: decay is -1.0 to -2.0c per 5 minutes depending on current price\n- After minute 85: decay can be -2 to -5c per 5 minutes as time runs out\n\nIf the contract is 40c+ after minute 70 with no recent event pushing it up, predict negative delta_cents. The higher the price and later the clock, the larger the decay. At 75' with mid 66.5c (Example 1), decay of -0.5 to -1.5c over five minutes is typical. Do not predict delta near zero in these situations.\n\n**Thin books drift after single orders.** If volume is under 1000 contracts total and recent trades are one-sided (all buys or all sells), the mid may have moved 1-2c on a single participant's orders and could mean-revert. But this is unreliable\u2014only predict reversion if you have strong evidence (tape showing clear imbalance then reversal, or sudden jump with no game event visible).\n\n**Goal absorption timing:** When recent_events shows a goal 1-4 minutes ago, check candlesticks:\n- If mid already jumped 15-25c and has been stable for 3+ minutes: absorption complete, predict delta near zero with half_width 0.5-1.0c\n- If mid jumped 10-20c in the last 1-2 minutes: absorption ongoing, predict continued y continue. Check candlesticks: if price jumped then stabilized for 3+ minutes, absorption is likely complete; predict +0c with half_width 1.0-1.5c. If price jumped <3 minutes ago, predict continuation +1 to +2c in same direction with half_width 1.0c.\n\n**Late match (60-75 minutes):** Time decay accelerates. For \"will score\" or \"will win\" contracts:\n  - If mid 30-60c, predict -0.5 to -1.5c with half_width 1.0-1.5c\n  - If mid 10-30c, predict -0.3 to -1.0c with half_width 0.8-1.2c\n  - If mid <10c, decay is slow (already near floor); predict -0.2 to -0.5c with half_width 0.5-0.8c\n\n**Very late (75-90 minutes):** Strong time decay unless a goal just occurred. \n  - If mid 40-70c, predict -1.0 to -2.5c with half_width 1.0-1.5c\n  - If mid 20-40c, predict -0.5 to -1.5c with half_width 1.0c\n  - If mid <20c or >80c, contract is nearly settled; predict -0.2 to -0.5c with narrow width 0.5-0.8c or stand aside\n\n**Thin book (volume <500 in last 10 min):** Single orders move the mid; mean reversion possible. If recent candlesticks show a 1-2c drift with low volume, predict reversion -1 to +1c depending on direction, with half_width 1.5-2.0c.\n\n**High-mid contracts (mid >80c):** These decay slowly in absolute terms but can still move 1-2c on book noise. Use half_width 1.0-1.5c unless very late in match (>80 minutes) with outcome nearly certain.\n\n**Low-mid contracts (mid <20c):** Decay is slow near the floor. But these can jump 5-10c on a sudden event. Early match: use half_width 2.0-3.0c. Late match (70+ min): use half_width 0.5-1.0c if outcome is nearly decided.\n\nREADING THE SITUATION:\n\n1. **Check candlesticks for recent moves:**\n   - If mid jumped 15+ cents in last 2-4 minutes: a goal likely occurred. Absorption may still be ongoing for 1-3 minutes. If jump was <3 min ago, predict +1 to +3c continuation in same direction with half_width 1.0c. If jump was 3-5 min ago and candlesticks flat since, absorption complete; predict +0c with half_width 1.0-1.5c.\n   - ht were run over, all with half_width 0.5c in situations that warranted 1.5-3.0c.\n\nYour forecast is posted as a two-sided quote. Narrow quotes get filled and scored on realized P&L; wide quotes rarely trade but protect you from being run over. Err on the side of width. A missed trade costs nothing; a bad fill costs thousands.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"forecast\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"questions\": {\n        \"move\": {\n          \"type\": \"score\",\n          \"instructions\": \"How many cents the contract's mid price moves over the next five minutes, from the book shown now. Positive is up. A quiet book at a settled score usually stays within half a cent.\",\n          \"criteria\": [\n            \"down 4 cents or more\",\n            \"down 2 to 3 cents\",\n            \"down about 1 cent\",\n            \"unchanged, within half a cent either way\",\n            \"up about 1 cent\",\n {"idx": 5, "score": 0.4958, "parents": "3", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match is being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in five minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing: a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no, faster as the clock runs down\n- the book being thin, so a single order moves the mid and it drifts back\n- the market absorbing a goal that happened two or three minutes ago\n\nCRITICAL BOUNDS AND UNCERTAINTY:\n\nA contract near 0c or 100c has almost nowhere to go. If mid is 1.5c, it can only fall 1.5c to zero or rise modestly; if mid is 98c, it can only rise 2c to 100 or fall modestly. Your delta_cents must respect these physical limits.\n\nThe feedback shows persistent under-estimation of baseline volatility. Even when no event occurs, markets routinely move 1-2 cents over five minutes due to:\n- Book microstructure noise (thin books, order flow imbalance)\n- Gradual absorption of recent events\n- Small time decay effects\n- Liquidity-driven mean reversion after jumps\n\nREVISED DEFAULT BEHAVIOR:\n\n**When in doubt, widen.** You are punished for fills that go against you, never for declining to trade.\n\n**Early match (0-30 minutes):** Extreme uncertainty. Goals can happen at any time, and early scores drastically reshape probabilities. Use half_width 2.5-3.5c minimum unless the book is thick (volume >5000 in last 10 min) and stable (flat candlesticks 5+ min), in which case 2.0c minimum. Even \"stable\" early situations can move 3-5 cents on a single event.\n\n**Mid-match stable (30-60 minutes, no goal in last 10 min, flat candlesticks 5+ min, volume >2000):** Predict delta near zero with half_width 1.5-2.0c. Book noise alone causes 1-2c drift.\n\n**Mid-match after recent goal (jump of 15+ cents in last 5 minutes):** Check timing carefully. If jump was <2 minutes ago, absorption may continue; predict +0.5 to +1.5c in same direction with half_width 1.5c. If jump was 2-4 minutes ago, absorption likely complete; predict +0c with half_width 1.5-2.0c. If jump was >5 minutes ago and candlesticks flat since, predict +0c with half_width 1.0-1.5c.\n\n**Late match (60-75 minutes):** Time decay accelerates. For \"will score\" or \"will win\" contracts:\n  - If mid 30-60c, predict -0.5 to -1.0c with half_width 1.5-2.0c\n  - If mid 10-30c, predict -0.3 to -0.8c with half_width 1.2-1.5c\n  - If mid <10c, decay is slow (already near floor); predict -0.2 to -0.4c with half_width 1.0-1.2c\n\n**Very late (75-90 minutes):** Strong time decay unless a goal just occurred. \n  - If mid 40-70c, predict -1.0 to -2.0c with half_width 1.5-2.0c\n  - If mid 20-40c, predict -0.5 to -1.2c with half_width 1.2-1.8c\n  - If mid <20c or >80c, contract is nearly settled; predict -0.2 to -0.5c with half_width 1.0-1.5c\n\n**Thin book (volume <1000 in last 10 min):** Single orders move the mid; mean reversion possible. If recent candlesticks show a 1-3c drift with low volume, predict reversion -0.5 to +0.5c depending on direction, with half_width 2.0-3.0c to cover high noise.\n\n**High-mid contracts (mid >70c):** These decay slowly in absolute terms but can still move 1-2c on book noise. Use half_width 1.5-2.5c unless very late in match (>80 minutes) with outcome nearly certain AND thick book.\n\n**Low-mid contracts (mid <20c):** Decay is slow near the floor. But these can jump 5-15c on a sudden event. Early match: use half_width 2.5-3.5c. Late match (70+ min): use half_width 1.2-2.0c depending on book thickness.\n\nREADING THE SITUATION:\n\n1. **Check candlesticks for recent moves:**\n   - If mid jumped 15+ cents in last 2 minutes: goal just occurred, absorption ongoing. Predict +0.5 to +1.5c continuation with half_width 1.5c.\n   - If mid jumped 15+ cents 2-4 minutes ago: absorption likely wrapping up. Predict +0c with half_width 1.5-2.0c.\n   - If mid jumped 15+ cents 5-10 minutes ago and flat since: absorption complete. Predict decay or +0c with half_width 1.5c.\n   - If candlesticks flat for 5+ minutes with high volume (>2000): book stable but noise still causes 1-2c moves; use half_width 1.5-2.0c.\n   - If candlesticks flat but volume <1000: thin book, vulnerable to single-order moves; use half_width 2.0-3.0c.\n   - If mid drifted 1-3c with low volume: mean revert possible, but wide half_width 2.0-3.0c to cover continuation risk.\n\n2. **Time decay is real and directional:**\n   - \"Will X score\" or \"Will X win\" contracts decay toward zero as clock runs without scoring/winning.\n   - Decay rates (calibrated from feedback):\n     - 0-30': ~0.1-0.3c per 5 min (very slow, swamped by noise)\n     - 30-60': ~0.3-0.6c per 5 min (detectable but still noisy)\n     - 60-75': ~0.5-1.2c per 5 min (clear signal, faster at higher prices)\n     - 75-90': ~1.0-2.5c per 5 min (strong decay above 40c, moderate 20-40c, slow <20c)\n   - This is directional and should be captured. But decay is NOT the only force; book noise and absorption effects also matter.\n\n3. **Price bounds constrain movement:**\n   - Mid at 2c can fall at most 2c. Predict -0.2 to -0.5c or +0 to +1c. Use half_width 1.0-1.5c if late match, 2.5-3.5c if early.\n   - Mid at 95c can rise at most 5c. Predict -0.5 to -1.5c or +0 to +1c. Use half_width 1.5-2.5c.\n   - At extremes (<5c or >95c), contract is nearly settled. Either predict small move toward middle or use half_width 1.5-2.5c and decline to trade if uncertain.\n\n4. **Volume and book thickness:**\n   - Volume >5000 in last 10 min = thick book, mid relatively stable but still moves 1-2c; use half_width 1.5-2.0c minimum.\n   - Volume 1000-5000 = moderate; use half_width 1.5-2.5c.\n   - Volume <1000 = thin book, single orders move mid 2-5c; use half_width 2.5-3.5c.\n\nEXAMPLES FROM FEEDBACK REINTER ntract. Candlesticks show gradual decay from 28.5c over 15+ minutes. Volume moderate (~1600 recent). Predicted -0.6c width 0.6c, realized -4.0c. ERROR: At 75 minutes, time decay is strong. But at 22.5c, contract still has room to fall. The -0.6c prediction was directionally right but too small. Should have predicted -1.0 to -1.5c with half_width 1.5-2.0c to allow for volatility. Still would have been hit, but error smaller.\n\nEx 7 (BRE-TOT 15', mid 69.5c): Early match, home up 1-0, goal at 11' (4 minutes ago). Candlesticks show jump from 46.5c to 69.5c after goal, now stable. Volume very high (>28000). Predicted -0.4c width 0.5c, realized 0c. ERROR: At 15 minutes, even after a goal, extreme uncertainty remains. Another goal can happen any time. Should have used half_width 2.0-2.5c minimum despite thick book.\n\nEx 8 (SPA-ZWO 55', mid 33.5c): Mid second half, 1-1 draw. Candlesticks show chaotic movement in first half, now more stable but very thin book (volume ~3 total!). Predicted -0.2c width 0.5c, realized 0c. ERROR: Extremely thin book (<10 volume) makes mid unreliable. Single orders can move it 5-10c. Should have used half_width 3.0-4.0c or declined to trade entirely.\n\nDECISION FRAMEWORK:\n\n1. Determine match phase and base width:\n   - Early (0-30'): half_width 2.5-3.5c base\n   - Mid (30-60'): half_width 1.5-2.5c base\n   - Late (60-75'): half_width 1.5-2.0c base\n   - Very late (75-90'): half_width 1.2-2.0c base\n\n2. Adjust for book thickness:\n   - Volume >5000: keep base or reduce by 0.5c if very stable\n   - Volume 1000-5000: keep base\n   - Volume <1000: add 0.5-1.0c to base\n\n3. Check for recent events:\n   - Goal <2 min ago: predict continuation +0.5 to +1.5c, use base width\n   - Goal 2-5 min ago: predict +0c, keep base width\n   - Goal 5-10 min ago: predict decay or +0c, can reduce width by 0.3c if stable\n   - No goal in 10+ min: apply time decay\n\n4. Apply time decay if no recent goal:\n   - Early match: decay negligible, predict near +0c\n   - Mid match: decay -0.3 to -0.6c depending on price level\n   - Late match: decay -0.5 to -2.0c depending on clock and price level\n\n5. Respect price bounds:\n   - If mid <5c: can't fall much, predict -0.2 to -0.4c or +0c\n   - If mid >95c: can't rise much, predict -0.5 to -1.5c or +0c\n   - Adjust predicted delta to not exceed physical bounds\n\n6. Final width check:\n   - Never go below 1.0c width unless very late (>80') and thick book (>5000 volume) and near-certain outcome (mid <5c or >95c)\n   - Typical minimum: 1.5c\n   - Early match minimum: 2.5c\n   - Thin book minimum: 2.5c\n\n7. When in doubt, widen:\n   - If you cannot confidently call direction, predict delta near 0 and use half_width 2.0-3.0c\n   - You lose nothing by declining to trade, but are charged for bad fills\n\nYour forecast is posted as a two-sided quote. Narrow quotes earn P&L when right but lose when wrong. Wide quotes rarely trade but protect you from being run over. The skill score rewards calling direction and size of moves that actually happen; it does not reward trading for its own sake.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output     rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.50)", fillcolor=orange, tooltip=" "];

    2 -> 4;
    3 -> 5;
    1 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
