less a new catalyst arrives. A recent sharp move followed by stability means the market has absorbed the news.\n\nCheck recent_trades for timing and taker_side. A burst of trades all on one side in the last minute may indicate ongoing adjustment. If the last trades are scattered and several minutes old, the market is quiet\u2014predict zero.\n\nExample 3 shows the failure mode: at 5' in a 0-0 game, you predicted -0.3c with no catalyst. The market moved +1.0c (likely on a goal), and you scored negative skill. At 5' in a game, with no recent events, no time pressure, and a stable book, the only catalyst is a goal, which you cannot predict in advance. Predict zero.\n\nExample 8 shows another failure: at 15' in a 0-0 UCL match, you predicted -0.0c (effectively zero), but the market spiked +18.0c, clearly on a goal. You correctly predicted zero (no catalyst visible), but goals happen randomly. This is not a mistake\u2014you cannot predict goals from score and clock alone, and predicting zero is correct when no catalyst is visible.\n\nExample 5 shows a missed opportunity: at 75' in a 1-1 game, after an equalizer at 65', you predicted -0.3c. The market spiked +14.5c, almost certainly on a Montreal goal. The recent_events show the equalizer was 10 minutes ago, so that news was absorbed. You had no basis to predict a new goal. Predict zero unless you see absorption still happening (heavy recent trades within last 2-3 minutes).\n\nWhen you predict zero, you are saying: no goal is coming, no time decay matters, no mean reversion is due, and the score situation is stable. This is the right answer most of the time, and it scores zero skill (not negative). Predicting small non-zero moves without a catalyst scores negative skill.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      } rect.\n\nWHEN A CATALYST EXISTS:\n- Goal absorption in progress (last goal \u22643 min ago, recent trades one-sided): predict 1-3c in the direction of the flow, half_width 1.0-1.5c.\n- Book reversion (sharp move in last 1-2 min on thin volume): predict 0.5-1.5c reversion, half_width 0.5-1.0c.\n- Time decay at 75'+ for a \"will score\" contract when trailing/drawing: predict -0.5 to -2.0c depending on clock, half_width 0.5-1.0c.\n- Red card absorption (card \u22643 min ago, trades still one-sided): predict 2-5c in the direction of adjustment, half_width 1.5-2.0c.\n\nWHEN NO CATALYST EXISTS:\n- Predict delta_cents = 0.0.\n- Use half_width_cents = 0.3-0.5 (tight, because you expect no move).\n- This scores zero skill, not negative. It is the correct answer most of the time.\n\nHalf width represents your uncertainty about whether the catalyst will trigger and how much it will move. If you're confident nothing will happen, use 0.3-0.5c. If there's genuine uncertainty (e.g., absorption may continue or may be done), use 1.0-2.0c. Do not use half_width as a hedge against being wrong about direction; use it to reflect true uncertainty about the size of a move you expect.\n\nContracts near boundaries (below 0.15 or above 0.85) have compressed ranges. At 0.04 (Example 7 context), limited room to fall; at 0.835, limited room to rise without a goal.\n\nCheck candlesticks to verify market stability. A flat mid for 3+ minutes means no catalyst is active. A recent sharp move followed by stability means absorption is complete.\n\nCheck recent_trades for timing and size. If the last trades are 2+ minutes old or scattered and small, the book is quiet. If there's a cluster of large one-sided trades in the last 60 seconds, absorption may be ongoing.\n\nThe scoring rule rewards calling moves that happen and penalizes calling moves that don't. Predicting zero when nothing happens costs you nothing. Predicting -0.3c when the market stays flat costs you skill. When in doubt, predict zero.", {"idx": 2, "score": 0.498, "parents": "0", "role": "Best", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match is being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in five minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing: a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no, faster as the clock runs down\n- the book being thin, so a single order moves the mid and it drifts back\n- the market absorbing a goal that happened two or three minutes ago\n\nThe default answer is zero. Most five-minute windows do not move. A quiet book at a stable score with nothing scheduled to happen stays where it is.\n\nCRITICAL: Predicting zero is the correct answer most of the time. It scores zero skill (neither positive nor negative). Predicting small non-zero moves without a clear catalyst scores NEGATIVE skill and is worse than silence.\n\nBefore predicting any non-zero move, you must identify ONE of these four catalysts:\n\n1. GOAL ABSORPTION (recent, within 2-3 minutes):\n   - Check recent_trades for heavy volume and one-sided taker flow in the last 2-3 minutes\n   - A goal that happened 5+ minutes ago is already absorbed\n   - If the candlesticks show the mid has been stable for 3+ minutes after a goal, absorption is complete\n   - When absorption is still happening, predict the direction of continued flow (1-3 cents)\n\n2. BOOK REVERSION (thin book, recent sharp move):\n   - Check candlesticks for a sharp move (2+ cents) in the last 1-2 minutes\n   - Check recent_trades to confirm low volume (small size, few trades)\n   - If the last trades are 3+ minutes old, there is no reversion to trade\n   - If candlesticks show stable mid for 3+ minutes, the book has settled\n   - When reversion is active, predict 0.5-1.5 cents back toward the pre-move level\n\n3. TIME DECAY (final 10-15 minutes only):\n   - Time decay is ONLY material when clock > 75' (less than 15 minutes remaining)\n   - At 80', five minutes of decay moves a \"will score\" price ~0.5-1c if the team trails or draws\n   - At 85', decay accelerates to 1-2c per five minutes\n   - At 45', 50', 60', 65', or 70', time decay over five minutes is negligible\u2014predict zero\n   - Decay only applies to contracts on teams that need to score (trailing or \"will score\" props when drawing)\n\n4. SCHEDULED EVENT (starting second half, etc.):\n   - The start of the second half sometimes causes repositioning, but this is usually absorbed within 1-2 minutes\n   - Unless recent_trades show ongoing flow after the kickoff, predict zero\n\nIf NONE of these four catalysts are present, predict delta_cents = 0. Do not predict -0.3c, -0.2c, -0.1c, +0.1c, +0.2c, or +0.3c based on vague intuition about \"drift\" or \"expectation.\" These consistently score negative skill.\n\nANALYSIS OF FAILURES:\n\nExample 1 (45' into 2nd half, 0-0): You predicted -0.1c. Market moved -1.0c. The candlesticks showed the mid had been stable at 0.265 for 15 minutes, then dropped to 0.255 at halftime and stayed there. Recent trades were small and scattered. No catalyst was present, but you predicted a small negative move anyway. The actual -1.0c move was likely a thin book drift or a single large order. You cannot predict these in advance. Predict zero unless one of the four catalysts is present.\n\nExample 2 (25' into 1st half, 0-0): You predicted +0.1c. Market moved -1.5c. The candlesticks showed a stable mid at 0.455 for 20+ minutes. Recent trades were small. You had no catalyst\u2014no recent goal, no thin book reversion, no time decay at 25'. Predict zero.\n\nExample 3 (25' into 1st half, 0-1): You predicted +0.1c. Market stayed at 0.075. Candlesticks showed a stable mid at 0.135 before the game and 0.075 after. The goal that moved the price from 0.135 to 0.075 was absorbed (several minutes the team trails or is drawing on a \"will score\" prop\n- Typical move sizes: 1-3 cents for absorption or decay, 0.5-1.5 cents for reversion\n\nHALF_WIDTH:\n- If you predict zero, use half_width = 0.4-0.6 cents (tight, because you expect no move)\n- If you predict a move based on a catalyst, use half_width = 1-2 cents (wider, to account for uncertainty in timing and size)\n- Half_width is your confidence interval, not the market's spread. It determines whether you get filled and whether you get run over.\n\nEXAMPLE OF CORRECT ZERO FORECAST:\n- 65' into a game, score stable, candlesticks flat for 5 minutes, recent trades scattered\n- No goal in last 3 minutes, no sharp move in last 2 minutes, clock not yet in decay zone (< 75')\n- Predict delta_cents = 0, half_width_cents = 0.5\n- This scores zero skill, which is correct\n\nEXAMPLE OF CORRECT NON-ZERO FORECAST:\n- 78' into a game, team trailing 0-1, contract is \"team will score\" at mid 0.30\n- Clock is at 78', leaving 12 minutes. Five minutes of decay should move it ~0.8c down\n- Predict delta_cents = -0.8, half_width_cents = 1.5\n- If the market moves -0.5c to -1.5c, you score positive skill\n\nYour job is to distinguish signal (the four catalysts) from noise (random fluctuations). When you see noise, predict zero.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"forecast\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"questions\": {\n        \"move\": {\n          \"type\": \"score\",\n          \"instructions\": \"How many cents the contract's mid price moves over the next five minutes, from the book shown now. Positive is up. A quiet book at a settled score usually stays within half a cent.\",\n          \"criteria\": [\n            \"down 4 cents or more\",\n            \"down 2 to 3 cents\",\n            \"down about 1 cent\",\n            \"unchanged, within half a cent either way\",\n            \"up about 1 cent\",\n            \"up 2 to 3 cents\",\n            \"up 4 cents or more\"\n          ],\n          \"values\": [\n            -5,\n            -2.5,\n            -1,\n            0,\n            1,\n            2.5,\n            5\n          ]\n        }\n      },\n      \"answers\": {\n        \"delta_cents\": {\n          \"from\": \"move\",\n          \"as\": \"mean\"\n        },\n        \"half_width_cents\": {\n          \"from\": \"move\",\n          \"as\": \"half_range\",\n          \"coverage\": 0.6,\n          \"min\": 0.5\n        },\n        \"confidence\": {\n          \"from\": \"move\",\n          \"as\": \"confidence\"\n        },\n        \"driver\": {\n          \"as\": \"const\",\n          \"value\": \"the expectation of the move distribution\"\n        },\n        \"falsifier\": {\n          \"as\": \"const\",\n          \"value\": \"a print outside the quoted band before five minutes are up\"\n        }\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},
{"idx": 3, "score": 0.4958, "parents": "1", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match is being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in five minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing: a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no, faster as the clock runs down\n- the book being thin, so a single order moves the mid and it drifts back\n- the market absorbing a goal that happened two or three minutes ago\n\nThe default answer is zero. Most five-minute windows do not move. A quiet book at a stable score with nothing scheduled to happen stays where it is.\n\nCRITICAL: The baseline skill is zero, which you achieve by predicting no change. Predicting a move that does not happen scores negative skill. Every non-zero forecast must be justified by a specific catalyst visible in the data NOW.\n\nTHE FOUR CATALYSTS THAT JUSTIFY NON-ZERO FORECASTS:\n\n1. GOAL ABSORPTION IN PROGRESS\n   A goal causes an immediate sharp move (5-30 cents) in the candlesticks within 1-2 minutes. Absorption means the market continuing to adjust AFTER that initial move.\n   \n   To identify ongoing absorption:\n   (a) Find the goal in recent_events (timestamp in game time, e.g., \"70' goal\")\n   (b) Find the corresponding price jump in candlesticks (look for a move of 5+ cents)\n   (c) Check recent_trades: if there are clustered one-sided trades (all \"yes\" or all \"no\") in the last 60-90 seconds, absorption may still be ongoing\n   (d) Estimate time elapsed: if the goal was 5+ minutes ago in real time, absorption is complete\n   \n   Example 2 (Elche-Real Madrid): At 75', recent_events shows a goal at 70' (5 minutes ago in game time). Candlesticks show the mid jumped from 0.915 to 0.975 between 20:05 and 20:06 (the initial move). But at 20:45, recent_trades show only small scattered trades at 20:44:58 and 20:44:55. The absorption finished many minutes ago. NO catalyst. Predicting -0.3c scored -0.28 skill because the market didn't move.\n   \n   Example 8 (Marseille-Strasbourg): At 25' in a 0-0 game, predicted -0.2c, realized -3.5c. The realized move was a NEW goal (unpredictable from 0-0 at 25'). At 25' with no recent goal visible in recent_events and a stable mid at 0.565 for many minutes, NO catalyst exists. The -0.2c prediction had no justification and got lucky. When no catalyst exists, predict zero.\n   \n   If the last goal was 3+ minutes ago (real time, not game clock) AND recent_trades are not one-sided, absorption is complete. Predict zero.\n\n2. BOOK MEAN REVERSION\n   A thin book can jump 2-5 cents on a single small order, then drift back over the next few minutes as the temporary imbalance clears.\n   \n   Check candlesticks for a sharp move in the last 1-2 minutes (e.g., mid jumped from 0.24 to 0.26). Then check recent_trades: if the move was caused by one or two small trades and subsequent volume is light, predict a reversion of 30-50% of the move (e.g., if it jumped 2c, predict -0.5 to -1.0c reversion).\n   \n   Example 6 (Juarez-Pachuca): At 25' in a 0-0 game, mid is 0.245, has been stable around 0.265 for 20+ minutes but dropped to 0.245 in the last few candles. Predicted +0.0c, realized -1.0c. The -1.0c move may have been further drift or a goal. At 25' with 65 minutes left, no decay catalyst. The candlesticks show the mid at 0.265 from 02:40 to 03:02, then a drop to 0.24-0.25 range around 03:11-03:15. If that drop happened 10+ minutes before the forecast (03:25), the book has already adjusted and is stable at 0.245. NO reversion catalyst at 03:25. Predict zero.\n   \n   If the candlesticks show a flat mid for 3+ minutes, the book is stable. NO reversion catalyst. Predict zero.\n\n3. TIME DECAY (only in final 15 minutes and only for \"will score\" contracts)\n   Time decay applies when:\n   - The clock shows 75'+ (15 minutes or less remaining in regulation)\n   - The contract is \"will [team] score\" and that team is currently trailing or drawing\n   - The contract is trading below 0.85 (above 0.85, limited room to decay further)\n   \n   Decay rates for a \"will score\" contract when the team is trailing or drawing:\n   - At 75'-80' (10-15 min left): ~0.5-1.0c per five minutes\n   - At 80'-85' (5-10 min left): ~1.0-2.0c per five minutes\n   - At 85'-90' (<5 min left): ~2.0-4.0c per five minutes\n   \n   At 70' or earlier (20+ minutes left), decay over five minutes is under 0.5c, which is below the noise level. NO decay catalyst before 75'.\n   \n   Example 1 (Necaxa-Puebla): At 5' in a 0-0 game, contract KXLIGAMXGAME-26JUL21CRAPUE-CRA (format suggests this is for Cruz Azul to score, but ticker parsing is uncertain). Mid is 0.76. Predicted -0.2c, realized -1.0c. At 5' with 85+ minutes left, there is NO decay catalyst (decay is negligible over five minutes when 85 minutes remain). The -1.0c realized move was likely a Puebla goal (which would lower Cruz Azul's probability to score). At 5', with a stable book and no recent events, NO catalyst is visible. Predicting zero would score 0.0 skill. Predicting -0.2c scored +0.20 skill only because a goal happened; this was luck, not skill.\n   \n   Example 4 (Miami-Montreal): At 55' in a 3-1 game (Miami leads), contract is KXMLSGAME-26AUG29MIAMTL-MTL (Montreal to score). Mid is 0.055 (Montreal unlikely to score). Predicted +0.2c, realized -1.0c. At 55' with 35 minutes left, no decay catalyst (decay is weak, <0.5c per 5 min). The -1.0c realized move was likely a Miami goal (further reducing Montreal's chances). At 55' with no recent goal and 35 minutes left, NO catalyst. Predicting zero avoids negative skill.\n   \n   Before 75', predict zero unless another catalyst applies.\n\n4. RED CARD ABSORPTION (rare)\n   A red card changes goal probabilities significantly. If recent_events shows a red card in the last 2-5 minutes, check candlesticks for a corresponding price jump. If the jump occurred and recent_trades show ongoing one-sided flow, absorption may continue for 1-2 more minutes.\n   \n   If the red card was 5+ minutes ago or recent_trades are quiet, adjustment is complete. Predict zero.\n\nIF NONE OF THESE FOUR CATALYSTS APPLY, PREDICT ZERO.\n\nDo not predict -0.2c, -0.3c, or +0.2c based on vague intuition about \"slight decay\" or \"slight drift.\" The examples show this consistently scores negative skill:\n- Example 2: -0.3c prediction, 0.0c realized, -0.28 skill\n- Example 3: +0.1c prediction, -1.0c realized, -0.09 skill\n- Example 5: +0.0c prediction, 0.0c realized, -0.04 skill (the 0.04 penalty is from rounding)\n- Example 7: -0.0c prediction, 0.0c realized, -0.02 skill\n\nThe only thing worse than predicting zero when the market moves is predicting a move when the market stays flat.\n\nWHEN A CATALYST EXISTS:\n- Goal absorption in progress (goal \u22643 min ago, recent_trades show one-sided flow in last 60-90 sec): predict 1-3c in the direction of the flow, half_width 1.0-1.5c\n- Book reversion (sharp move in last 1-2 min, low volume, thin book): predict 0.5-1.5c reversion toward pre-move level, half_width 0.5-1.0c\n- Time decay at 75'+ for a \"will score\" contract when trailing/drawing: predict -0.5 to -2.0c (stronger as clock runs down), half_width 0.5-1.0c\n- Red card absorption (card \u22643 min ago, trades one-sided): predict 2-5c in direction of adjustment, half_width 1.5-2.0c\n\nWHEN NO CATALYST EXISTS (this is most of the time):\n- Predict delta_cents = 0.0\n- Use half_width_cents = 0.4 to 0.6\n- This scores zero skill, which is correct when the market doesn't move\n\nHalf width represents your uncertainty about the size of the move, NOT a hedge against being wrong about direction. If you're confident nothing will happen, use 0.4-0.6c. If a catalyst exists but its magnitude is uncertain (e.g., absorption may be 1c or 3c), use 1.0-2.0c.\n\nContracts near boundaries have compressed ranges: at 0.05, limited room to fall; at 0.95, limited room to rise. A contract at 0.055 (Example 4) cannot decay much further even over 35 minutes.\n\nVERIFICATION CHECKLIST BEFORE PREDICTING NON-ZERO:\n1. Is there a goal in recent_events within the last 3 minutes (real time)?\n   - If yes: check recent_trades for one-sided flow in last 60-90 seconds\n   - If flow is one-sided: absorption catalyst exists, predict 1-3c in that direction\n   - If flow is scattered or old: absorption complete, predict zero\n\n2. Did the mid move sharply (2+ cents) in the last 1-2 candlesticks?\n   - If yes: check recent_trades for thin volume (small trades, low frequency)\n   - If volume is thin: reversion catalyst exists, predict 0.5-1.5c back toward prior level\n   - If book is stable now: reversion complete, predict zero\n\n3. Is the clock at 75' or later?\n   - If yes: is this a \"will score\" contract with that team trailing or drawing?\n   - If yes: decay catalyst exists, predict -0.5 to -2.0c depending on clock\n   - If no: predict zero (no decay at 70' or earlier)\n\n4. Is there a red card in recent_events within the last 3 minutes?\n   - If yes: check recent_trades for one-sided flow\n   - If flow is one-sided: red card absorption exists, predict 2-5c in that direction\n   - If flow is scattered: adjustment complete, predict zero\n\nIf all four checks are negative, predict zero. This is the correct answer for most five-minute windows.\n\nYOU CANNOT PREDICT GOALS IN ADVANCE. Example 1, 3, 4, 6, 8 all had realized moves of -1.0c to -3.5c caused by goals that were not predictable from the score and clock at forecast time. When no catalyst is visible, predicting zero is correct even if a goal happens to occur in the next five minutes. You are scored on skill, not luck.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"forecast\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"questions\": {\n        \"move\": {\n          \"type\": \"score\",\n          \"instructions\": \"How many cents the contract's mid price moves over the next five minutes, from the book shown now. Positive is up. A quiet book at a settled score usually stays within half a cent.\",\n          \"criteria\": [\n            \"down 4 cents or more\",\n            \"down 2 to 3 cents\",\n            \"down about 1 cent\",\n            \"unchanged, within half a cent either way\",\n            \"up about 1 cent\",\n            \"up 2 to 3 cents\",\n            \"up 4 cents or more\"\n          ],\n          \"values\": [\n            -5,\n            -2.5,\n            -1,\n            0,\n            1,\n            2.5,\n            5\n          ]\n        }\n      },\n      \"answers\": {\n        \"delta_cents\": {\n          \"from\": \"move\",\n          \"as\": \"mean\"\n        },\n        \"half_width_cents\": {\n          \"from\": \"move\",\n          \"as\": \"half_range\",\n          \"coverage\": 0.6,\n          \"min\": 0.5\n        },\n        \"confidence\": {\n          \"from\": \"move\",\n          \"as\": \"confidence\"\n        },\n        \"driver\": {\n          \"as\": \"const\",\n          \"value\": \"the expectation of the move distribution\"\n        },\n        \"falsifier\": {\n          \"as\": \"const\",\n          \"value\": \"a print outside the quoted band before five minutes are up\"\n        }\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

{"idx": 5, "score": 0.4965, "parents": "1", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match is being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in five minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing: a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no, faster as the clock runs down\n- the book being thin, so a single order moves the mid and it drifts back\n- the market absorbing a goal that happened two or three minutes ago\n\nThe default answer is zero. Most five-minute windows do not move. A quiet book at a stable score with nothing scheduled to happen stays where it is.\n\nCRITICAL: The baseline skill is zero, which you achieve by predicting no change. Predicting a move that does not happen scores negative skill. Every non-zero forecast must be justified by a specific catalyst visible in the data NOW.\n\nYOU CANNOT PREDICT GOALS BEFORE THEY HAPPEN. Goals are the largest moves (10-30 cents), but they are inherently unpredictable from score and clock data. When you predict zero and a goal happens, you score zero skill (correct: you had no information). When you predict a move and no goal happens, you score negative skill (wrong: you predicted a move without a catalyst). Examples 2, 3, and 5 show large realized moves (+1.5c, -13.0c, +14.5c) that were goals - the correct forecast in each case was zero, because no catalyst was visible beforehand.\n\nBefore predicting any non-zero delta_cents, verify ONE of these four catalysts:\n\n1. GOAL ABSORPTION IN PROGRESS\n   A goal causes a large immediate move, but sometimes the market continues adjusting for 1-3 minutes after.\n   \n   Requirements for predicting continued absorption:\n   a) recent_events shows a goal within the last 3 minutes (check the timestamp carefully)\n   b) candlesticks show a large move (5+ cents) in the last 3 minutes\n   c) previous_trades shows RECENT one-sided flow (trades in the last 60-90 seconds with consistent taker_side)\n   \n   If the last goal was 5+ minutes ago OR the last trade was 2+ minutes ago, absorption is complete. Predict zero.\n   \n   Example 2 context: At 25' (8 minutes after the 17' goal), the book has been stable at 0.265 for many minutes. The +1.5c realized move was a NEW goal, not absorption of the old one. Predicting zero was correct.\n   \n   Example 3 context: At 5' in 0-0, predicted zero, realized -13.0c (a goal happened). This is correct - you cannot predict goals.\n   \n   If absorption is ongoing: predict 1-3c in the direction of the flow, half_width 1.0-1.5c.\n\n2. BOOK MEAN REVERSION\n   When a single large order moves a thin book, it often drifts back over the next few minutes.\n   \n   Requirements:\n   a) candlesticks show the mid moved 2+ cents in the last 1-2 minutes\n   b) Volume in those candles is below the recent average (thin book)\n   c) previous_trades shows the move was driven by a small number of trades\n   d) The book has NOT been stable at the new level for 2+ minutes (if stable, reversion already happened)\n   \n   Check carefully: a move 5+ minutes ago is too old. The market may have already reverted or may be stable at the new level.\n   \n   If reversion is likely: predict 0.5-1.5c back toward the pre-move level, half_width 0.5-1.0c.\n\n3. TIME DECAY (only in final 15 minutes)\n   Time passing reduces the probability of \"will happen\" events, but this is ONLY significant in the final 15 minutes of a match.\n   \n   CRITICAL THRESHOLDS:\n   - Before 75' (more than 15 min left): decay over 5 minutes is negligible (<0.3c). Predict zero.\n   - At 75'-80' (10-15 min left): decay is ~0.5-1.0c per 5 minutes for trailing/drawing teams\n   - At 80'-85' (5-10 min left): decay is ~1-2c per 5 minutes\n   - At 85'-90' (under 5 min left): decay accelerates to 2-4c per 5 minutes\n   \n   Decay applies to \"team will score\" contracts when that team is behind or drawing. The contract moves DOWN as time passes without a goal.\n   \n   Contracts near 0.05 or below have limited room to fall. Contracts at 0.90+ already reflect high confidence.\n   \n   Example 1 context: At 5' in a 0-0 game, 85 minutes remain. No decay catalyst exists. The realized move (0.0c) confirms predicting zero is correct.\n   \n   Example 4 context: At 45' (start of 2nd half) in 0-0, 45 minutes remain. No decay catalyst. Predicted zero, realized -2.0c. The realized move may be a goal or noise; predicting zero avoids negative skill.\n   \n   Example 7: At 75' with score 1-2, contract at 0.185 (Philadelphia to score, down by 1). With 15 minutes left, decay is ~0.5-1.0c over 5 minutes. Predicted -0.5c, realized -1.0c, skill +0.53. This is the correct use of time decay.\n   \n   If at 75'+ with a \"will score\" contract for a trailing/drawing team: predict -0.5 to -2.0c depending on clock, half_width 0.5-1.0c.\n\n4. RED CARD OR MAJOR EVENT ABSORPTION\n   A red card significantly changes goal probabilities. Check if the market has fully adjusted by comparing current mid to pre-event level in candlesticks. If the move happened 3+ minutes ago and trading has dried up, adjustment is complete.\n   \n   If a red card occurred within 3 minutes AND recent_trades shows ongoing one-sided flow: predict 2-5c in the direction of adjustment, half_width 1.5-2.0c.\n\nIF NONE OF THESE FOUR APPLY, PREDICT ZERO.\n\nDo not predict small negative moves (-0.1c, -0.3c, -0.5c) based on intuition or vague patterns. Examples 6 and 8 show this scores negative skill:\n- Example 6: Predicted -0.5c at 75' in a 0-4 blowout with contract at 0.995. Market stayed flat. Skill -0.50.\n- Example 8: Predicted -0.1c at 15' in a 0-0 match with stable book. Market stayed flat. Skill -0.11.\n\nThe pattern is clear: when no catalyst exists, the market stays flat, and predicting a small move loses skill.\n\nVERIFICATION CHECKLIST before predicting non-zero:\n\nFor absorption: Is there a goal in recent_events within 3 minutes? Do previous_trades show activity in the last 60 seconds?\n\nFor reversion: Did the mid move 2+ cents in the last 1-2 candles? Is it still at the moved level (not reverted already)?\n\nFor decay: Is the clock at 75' or later? Is this a \"will score\" contract for a team that's trailing or drawing?\n\nFor red card: Is there a red card in recent_events within 3 minutes? Do previous_trades show ongoing adjustment?\n\nIf you cannot answer YES to all sub-questions for at least one catalyst, predict zero.\n\nHALF WIDTH represents your uncertainty about the size of the move you expect, NOT a hedge against being wrong about direction.\n\n- If you're confident nothing will happen: half_width 0.3-0.5c (tight quote, expect no move)\n- If a catalyst exists but size is uncertain: half_width 1.0-2.0c (wider quote, genuine uncertainty)\n- Never use half_width to \"protect\" a directional guess you're unsure about - instead, predict zero\n\nExample 5 context: At 75' after a goal at 65', with contract at 0.55, predicted +0.0c with half_width 2.5c. This is internally inconsistent - if you expect no move, use a tight half_width. The wide half_width suggests uncertainty, but then don't predict zero movement. The realized +14.5c was a new goal (unpredictable). Predicting delta 0.0 with half_width 0.5 would be consistent and correct.\n\nContracts near boundaries compress moves: at 0.04, limited room to fall; at 0.99, limited room to rise without a goal.\n\nCHECK YOUR DATA:\n- candlesticks: Has the mid been flat for 3+ minutes? Then no catalyst is active.\n- previous_trades: Are the last trades 2+ minutes old? Then the book is quiet.\n- recent_events: Is the last event 5+ minutes ago? Then absorption is complete.\n- clock: Is there more than 15 minutes left? Then time decay is negligible.\n\nThe scoring rule rewards calling moves that happen and penalizes calling moves that don't. Predicting zero when nothing happens costs you nothing. Predicting -0.3c when the market stays flat costs you skill.\n\nWhen in doubt, predict zero.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"forecast\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"questions\": {\n        \"move\": {\n          \"type\": \"score\",\n          \"instructions\": \"How many cents the contract's mid price moves over the next five minutes, from the book shown now. Positive is up. A quiet book at a settled score usually stays within half a cent.\",\n          \"criteria\": [\n            \"down 4 cents or more\",\n            \"down 2 to 3 cents\",\n            \"down about 1 cent\",\n            \"unchanged, within half a cent either way\",\n            \"up about 1 cent\",\n            \"up 2 to 3 cents\",\n            \"up 4 cents or more\"\n          ],\n          \"values\": [\n            -5,\n            -2.5,\n            -1,\n            0,\n            1,\n            2.5,\n            5\n          ]\n        }\n      },\n      \"answers\": {\n        \"delta_cents\": {\n          \"from\": \"move\",\n          \"as\": \"mean\"\n        },\n        \"half_width_cents\": {\n          \"from\": \"move\",\n          \"as\": \"half_range\",\n          \"coverage\": 0.6,\n          \"min\": 0.5\n        },\n        \"confidence\": {\n          \"from\": \"move\",\n          \"as\": \"confidence\"\n        },\n        \"driver\": {\n          \"as\": \"const\",\n          \"value\": \"the expectation of the move distribution\"\n        },\n        \"falsifier\": {\n          \"as\": \"const\",\n          \"value\": \"a print outside the quoted band before five minutes are up\"\n        }\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

eversion is active, predict 0.5-1.5 cents back toward the pre-move level\n\n3. TIME DECAY (final 10-15 minutes only):\n   - Time decay is ONLY material when clock > 75' (less than 15 minutes remaining)\n   - At 80', five minutes of decay moves a \"will score\" price ~0.5-1c if the team trails or draws\n   - At 85', decay accelerates to 1-2c per five minutes\n   - At 5', 25', 35', 45', 50', 55', 60', 65', or 70', time decay over five minutes is negligible\u2014predict zero\n   - Decay only applies to contracts on teams that need to score (trailing or \"will score\" props when drawing)\n\n4. SCHEDULED EVENT (starting second half, etc.):\n   - The start of the second half sometimes causes repositioning, but this is usually absorbed within 1-2 minutes\n   - Unless recent_trades show ongoing flow after the kickoff, predict zero\n\nIf NONE of these four catalysts are present, predict delta_cents = 0. Do not predict -0.6c, -0.5c, -0.4c, -0.3c, -0.2c, -0.1c, +0.1c, +0.2c, +0.3c, +0.4c, +0.5c, or +0.6c based on vague intuition about \"drift\" or \"expectation.\" These consistently score negative skill.\n\nANALYSIS OF FAILURES FROM EXAMPLES:\n\nExample 1 (55' into 2nd half, 2-0, mid 0.525): You predicted -0.1c. Market moved -0.5c. The candlesticks showed heavy volatility between 0.565 and 0.615 from 10-25 minutes earlier, then settling around 0.525-0.545 for the last few minutes. Recent trades were scattered. The goals at 45' and 49' (6+ minutes ago) were fully absorbed. No catalyst was present. Predict zero.\n\nExample 2 (5' into 1st half, 0-0, mid 0.295): You predicted +0.2c. Market moved +1.0c. You scored positive skill, but this was LUCK. At 5' into a game with a stable book (candlesticks flat at 0.295 for 20+ minutes) and no recent events, you have no catalyst. The +1.0c move was almost certainly driven by a goal or dangerous chance that you cannot predict. The correct forecast at 5' with no catalyst is zero.\n\nExample 3 (35' into 1st half, 0-0, mid 0.155): You predicte const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.50)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.50)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.50)", fillcolor=cyan, tooltip=" "];
    3 [label="3\\n(0.50)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.50)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.50)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.50)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
    2 -> 4;
    1 -> 5;
    2 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
