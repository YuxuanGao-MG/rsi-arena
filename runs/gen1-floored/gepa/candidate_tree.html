\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 12\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\\n\\nHow many cents does this mid move over the next 5 minutes, and how wide a market would you make around that? Zero cents is a real answer on a quiet book. Quote a width you would actually stand behind on both sides.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \\u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. This is your quote: you are saying you would buy at (prediction - this) and sell at (prediction + this). Narrow means you will trade; wide means you will not.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

efending a one-goal lead loses roughly 0.5-2\ncents per five minutes as the clock runs down in quiet play. Not 5 cents, not 10\ncents. If you forecast -1 cent from pure time decay, you are being aggressive. Be\nmore conservative.\n\n**Late equalisers happen.** When a team is trailing late and pressing hard, the\nprobability of an equaliser in the next five minutes is not zero \u2014 it is often 10-20%.\nIf the market is pricing the leading team at 75-80%, that is already accounting for\nrealistic comeback odds. Do not forecast further drift toward 85-90% unless the game\nis truly dead. Wide quotes (3-5 cents half-width) are appropriate when an equaliser\nwould move the price 30+ cents and the game is still live.\n\n**Zero is the right answer more often than you think.** Most five-minute windows in a\nfootball match see no goals, no cards, and no significant price movement. Copying the\ncurrent mid (predicting zero change) is not a failure \u2014 it is often correct and earns\nskill when the market stays flat. Only forecast movement when you have a concrete\nreason: a fresh event still being absorbed, time decay in a situation where it\nmatters, or a thin book visibly drifting.\n\n**Check for evidence before calling a move.** If candlesticks show the mid has been\nflat for 10+ minutes, recent trades are small and balanced, and nothing has happened\nin the game, the correct forecast is zero cents, not \"maybe -1 from time decay\". Only\nforecast decay when you can see it already happening in the data, or when the\nsituation is so clear (e.g., defending a lead in the 89th minute) that the market\nmust move.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 12\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\\n\\nHow many cents does this mid move over the next 5 minutes, and how wide a market would you make around that? Zero cents is a real answer on a quiet book. Quote a width you would actually stand behind on both sides.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \\u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. This is your quote: you are saying you would buy at (prediction - this) and sell at (prediction + this). Narrow means you will trade; wide means you will not.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze_context\",\n      \"output_key\": \"context\",\n      \"prompt\": \"Game: {{game}}\\nRecent minute bars: {{path}}\\n\\nAnalyze:\\n1. Time remaining: what minute is it, how many minutes left (90min match, account for period)\\n2. Recent price momentum: compare last 3-5 minute bars - is price trending up, down, or stable?\\n3. Goal timing: when was the most recent goal (check game events and candlestick spikes)? Has it been >5 min since a goal (absorbed) or <3 min (still spiking)?\\n4. Score situation: who's winning, and does time decay favor them or opponent?\\n\\nBe specific with numbers and timing.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"minutes_remaining\": {\n            \"type\": \"number\",\n            \"description\": \"Approximate minutes left in match\"\n          },\n          \"recent_trend\": {\n            \"type\": \"string\",\n            \"enum\": [\"rising\", \"falling\", \"stable\", \"post_spike_drift\"],\n            \"description\": \"Price momentum from last few minute bars\"\n          },\n          \"minutes_since_last_goal\": {\n            \"type\": \"number\",\n            \"description\": \"Minutes since most recent goal, or 999 if no recent goal\"\n          },\n          \"time_decay_direction\": {\n            \"type\": \"string\",\n            \"enum\": [\"up\", \"down\", \"neutral\"],\n            \"description\": \"Does running clock favor this outcome (up) or opponent (down) or neutral\"\n          },\n          \"reasoning\": {\n            \"type\": \"string\",\n            \"description\": \"Brief explanation of the analysis\"\n          }\n        },\n        \"required\": [\"minutes_remaining\", \"recent_trend\", \"minutes_since_last_goal\", \"time_decay_direction\", \"reasoning\"],\n        \"additionalProperties\": false\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nCurrent book: {{quote}}\\nGame state: {{game}}\\nRecent prints: {{tape}}\\nContext analysis: {{context}}\\n\\nForecast the 5-minute price move. Key patterns to consider:\\n\\n1. TIME DECAY (most reliable): If <20 minutes remain and one team leads, the trailing team's price decays -1 to -3c per 5min. The leading team's price rises +1 to +3c per 5min. This is continuous and predictable.\\n\\n2. POST-GOAL MEAN REVERSION: If a goal was scored <3 minutes ago (check spike in candlesticks), the price likely spiked and will drift back -1 to -2c as the book digests.\\n\\n3. MOMENTUM CONTINUATION: If price has been trending consistently for 5+ minutes, it may continue another +1 to -1c unless there's a clear reason to reverse.\\n\\n4. STALE BOOK DRIFT: On very thin books (small recent volume), a single large order may have moved the mid artificially; it drifts back -1 to +1c.\\n\\n5. QUIET PERIODS: If none of the above apply (early in match, stable score, no recent action), predict 0.\\n\\nBe willing to predict non-zero moves when patterns are clear. Time decay in final 20 minutes is especially reliable. Quote tighter spreads (1-2c half-width) when confident in the pattern, wider (3-4c) when uncertain.\\n\\nYour forecast is the CHANGE in cents, not the absolute price. Negative for down, positive for up.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. Narrow (1-2c) when pattern is clear, wide (3-4c) when uncertain.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will. Name the specific pattern.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

 \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze\",\n      \"output_key\": \"analysis\",\n      \"prompt\": \"Contract: {{question}}\\nGame state: {{game}}\\nCurrent book: {{quote}}\\nMinute bars (last 45m): {{path}}\\nRecent prints: {{tape}}\\n\\nAnalyze the price dynamics:\\n\\n1. MOMENTUM: Look at the last 5-10 minute bars. Is price trending up/down or stable? Calculate rough velocity (cents per minute over last 3-5 minutes).\\n\\n2. TIME DECAY: If we're past 70', does the leading team's win probability naturally increase as clock runs? How many cents per 5 minutes?\\n\\n3. RECENT EVENT ABSORPTION: If there was a goal in the last 10 minutes, has the price stabilized (3+ minutes flat) or still moving?\\n\\n4. TAPE DIRECTION: Are recent trades biased one way (70%+ on one side)? This suggests continued flow.\\n\\n5. VOLATILITY: Has price moved 5+ cents in the last 2 minutes? If so, it may revert or continue - which?\\n\\nBe quantitative. Estimate cents of move expected from each factor.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"momentum_cents_per_5min\": {\n            \"type\": \"number\",\n            \"description\": \"If current velocity continues, how many cents in 5 minutes?\"\n          },\n          \"time_decay_cents_per_5min\": {\n            \"type\": \"number\",\n            \"description\": \"Natural decay as clock runs (0 if before 70', or if tied)\"\n          },\n          \"recent_event_absorbed\": {\n            \"type\": \"boolean\",\n            \"description\": \"Has any recent goal/card been fully priced in?\"\n          },\n          \"tape_bias\": {\n            \"type\": \"string\",\n            \"enum\": [\"strong_buy\", \"buy\", \"neutral\", \"sell\", \"strong_sell\"],\n            \"description\": \"Direction of recent order flow\"\n          },\n          \"volatility_state\": {\n            \"type\": \"string\",\n            \"enum\": [\"quiet\", \"normal\", \"elevated\", \"spike\"],\n            \"description\": \"How much has price moved in last 2-3 minutes?\"\n          },\n          \"reasoning\": {\n            \"type\": \"string\",\n            \"description\": \"Brief quantitative summary of each factor\"\n          }\n        },\n        \"required\": [\"momentum_cents_per_5min\", \"time_decay_cents_per_5min\", \"recent_event_absorbed\", \"tape_bias\", \"volatility_state\", \"reasoning\"]\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nGame: {{game}}\\nCurrent mid: {{quote.mid}}\\n\\nAnalysis:\\n{{analysis}}\\n\\nNow forecast the next 5 minutes. Combine the factors:\\n- If momentum is strong and tape supports it, trust the trend\\n- Add time decay if applicable (late in match with a lead)\\n- If volatility is elevated and recent event NOT absorbed, expect continuation\\n- If quiet and absorbed, predict 0\\n\\nYour delta_cents should be the sum of momentum + time_decay + any unfinished move.\\nYour half_width should reflect confidence: tight (1-2c) if very confident, wide (4-5c) if uncertain.\\n\\nRemember: 0 is correct only when truly nothing is happening. Small moves (1-3 cents) are common and worth predicting.\\nThe market moves a lot - don't default to 0 unless analysis strongly supports it.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\"delta_cents\", \"half_width_cents\", \"confidence\", \"driver\", \"falsifier\"],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},
{"idx": 4, "score": 0.4515, "parents": "0", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match\nis being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in a\nfew minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing \u2014 a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no\n- the book being thin, so a single order moves the mid and it drifts back\n- the market still absorbing something that already happened\n\nWhat does not:\n- your view on which team is better. The market has that already.\n\nYou answer with two numbers.\n\n**How many cents it moves.** Not where the price is \u2014 where it goes. Zero is a real\nanswer and often the right one; a quiet book with nothing happening does not move.\nBut zero is a decision, not a default, and if the game has just changed you are\nexpected to say so in cents.\n\n**How wide a market you would make.** Half the width of the tightest two-sided quote\nyou would actually stand behind. Two cents means you would buy two under your number\nand sell two over it, and you would honour both sides. Ten cents means you barely\nknow. Quote what you would trade, not what is safe \u2014 but a width you cannot defend\nwill be paid for, because the trade goes on at your price and settles at the\nmarket's.\n\nCRITICAL DOMAIN FACTS:\n\n**Time decay direction matters.** When a team is WINNING, their win probability should\nINCREASE as time passes (fewer opportunities for opponent to equalize). When LOSING or\nDRAWING on a \"will score\" contract, probability DECREASES as time runs out. Example:\nat 70' with Newcastle 2-1 up, Liverpool win probability decays DOWN. But at 80' with\nUnited 1-0 up, United win probability should drift UP as they protect their lead.\n\n**Goals just scored create MULTI-MINUTE absorption windows.** When recent_events shows\na goal in the last 1-2 minutes, the market is still reacting. Price continues moving\nin the direction the goal implies for 2-5 minutes as orders arrive. Example: Arsenal\nscores at 49', you see it at 50' \u2014 the price will likely continue falling for Chelsea\nwin, not stabilize immediately.\n\n**Predicting zero requires HIGH confidence nothing will happen.** Zero means \"this\nbook will not move.\" That is rarely true. Even quiet books drift 1-2 cents on order\nflow. Only predict zero when you see: (1) extremely stable candlesticks for 10+\nminutes, (2) tight spread, (3) no game events, (4) no structural reason to move (not\napproaching halftime, not after a recent goal). Otherwise predict at least \u00b11-2 cents\nfor the direction time decay or order flow suggests.\n\n**Half-width must match uncertainty, not safety.** If you predict \u00b13 cents, you are\nsaying you would make a market 3 cents wide on each side (6 cent total spread). That\nis VERY wide \u2014 only justified when you truly don't know, like immediately after a\nshock event. Typical good forecasts have 1.5-3 cent half-width. Wider than 4 means\nyou should probably not trade this at all.\n\n**Check whether the price already moved.** Look at candlesticks: if the mid was 57 two\nminutes ago and is now 55, the market already absorbed some news. Your forecast is\nwhere it goes FROM HERE, not whether the original event mattered.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 12\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\\n\\nHow many cents does this mid move over the next 5 minutes, and how wide a market would you make around that? Zero cents is a real answer on a quiet book. Quote a width you would actually stand behind on both sides.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \\u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. This is your quote: you are saying you would buy at (prediction - this) and sell at (prediction + this). Narrow means you will trade; wide means you will not.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},
{"idx": 5, "score": 0.5303, "parents": "2", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match\nis being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in a\nfew minutes: delta_cents (how many cents it moves) and half_width_cents (half the\nwidth of a two-sided quote you would stand behind).\n\n## What moves prices on this horizon\n\n**Goals and cards the market hasn't absorbed yet.** A goal 2-3 minutes ago may still be\nmoving the price as the book digests it. Look at candlestick patterns: a spike followed\nby drift means absorption is ongoing.\n\n**Time decay.** When a team is behind and the clock runs, their win probability decays\ntoward zero. The rate accelerates as time runs out: -1c per 5 minutes with 30 minutes\nleft becomes -2 to -4c per 5 minutes with 15 minutes left. A draw contract decays\ntoward certainty (100) when the leading team protects their lead late.\n\n**Thin books drifting.** A single large order moves the mid, then it drifts back over\nminutes. Recent trades show if this is happening: one-sided flow at a new level that\ndoesn't hold.\n\n**Score changes.** Not just that a goal happened, but whether the price has fully\nadjusted. A trailing team's contract drops when they concede, but may continue drifting\ndown for several minutes after.\n\n## What does not move prices\n\nYour view on team quality. The market prices that already. A yellow card in minute 15\nwhen the score is 0-0. Substitutions unless they coincide with other events.\n\n## Critical facts about these contracts\n\n**Ticker format:** KXEPLGAME-[DATE][HOMECODE][AWAYCODE]-[WINNING_TEAM_CODE]\n\nThe last segment tells you which team the contract pays on. KXEPLGAME-26SEP06EVEMUN-MUN\nis a contract on Manchester United (MUN) winning. If United leads 1-0, this contract is\nin the money and rises with time decay. If Everton leads 1-0, this contract decays\ntoward zero.\n\n**Always check:** Does the score favor the contract team or oppose it? A 0-1 scoreline\nwhere away is winning means very different things for a home-team contract versus an\naway-team contract.\n\n## Your two numbers\n\n**Delta_cents: where it goes, not where it is.** Zero is real and often right when\nnothing is happening. But if the game state is actively driving the price (time decay\nwith 15 minutes left, post-goal drift), you must call it. A quiet book that hasn't\nmoved for 5 minutes: predict zero. A trailing team with 20 minutes left: predict\nnegative, and the magnitude scales with urgency.\n\n**Half_width_cents: what you'd actually trade.** Two cents means you buy at your\nprediction minus 2 and sell at plus 2, and you honor both sides. If you're unsure,\nwiden the quote, but remember: fees are 2-3 cents, so a 10-cent-wide market is too\nwide to be useful. Quote 1.5-3 cents when you're confident, 3-5 cents when uncertain,\nwider only when genuinely lost.\n\n## Common errors to avoid\n\n**Don't assume time decay is always small.** With 15 minutes left and one goal behind,\ndecay can be 2-4 cents per 5 minutes, not 0.5-1 cent.\n\n**Don't predict decay in the wrong direction.** If the contract team just scored and is\nnow winning, the contract rises with time, not falls. Check the ticker and the score.\n\n**Don't ignore ongoing absorption.** If the candlesticks show a goal caused a spike\n5 minutes ago and the price has been drifting since, that drift likely continues.\n\n**Don't predict zero by default.** Zero is for stable books with no driver. If there's\na clear driver (time decay, post-event drift), call it.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze_context\",\n      \"output_key\": \"context\",\n      \"prompt\": \"Game: {{game}}\\nRecent minute bars: {{path}}\\n\\nAnalyze:\\n1. Time remaining: what minute is it, how many minutes left (90min match, account for period)\\n2. Recent price momentum: compare last 3-5 minute bars - is price trending up, down, or stable?\\n3. Goal timing: when was the most recent goal (check game events and candlestick spikes)? Has it been >5 min since a goal (absorbed) or <3 min (still spiking)?\\n4. Score situation: who's winning, and does time decay favor them or opponent?\\n\\nBe specific with numbers and timing.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"minutes_remaining\": {\n            \"type\": \"number\",\n            \"description\": \"Approximate minutes left in match\"\n          },\n          \"recent_trend\": {\n            \"type\": \"string\",\n            \"enum\": [\"rising\", \"falling\", \"stable\", \"post_spike_drift\"],\n            \"description\": \"Price momentum from last few minute bars\"\n          },\n          \"minutes_since_last_goal\": {\n            \"type\": \"number\",\n            \"description\": \"Minutes since most recent goal, or 999 if no recent goal\"\n          },\n          \"time_decay_direction\": {\n            \"type\": \"string\",\n            \"enum\": [\"up\", \"down\", \"neutral\"],\n            \"description\": \"Does running clock favor this outcome (up) or opponent (down) or neutral\"\n          },\n          \"reasoning\": {\n            \"type\": \"string\",\n            \"description\": \"Brief explanation of the analysis\"\n          }\n        },\n        \"required\": [\"minutes_remaining\", \"recent_trend\", \"minutes_since_last_goal\", \"time_decay_direction\", \"reasoning\"],\n        \"additionalProperties\": false\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nCurrent book: {{quote}}\\nGame state: {{game}}\\nRecent prints: {{tape}}\\nContext analysis: {{context}}\\n\\nForecast the 5-minute price move. Key patterns to consider:\\n\\n1. TIME DECAY (most reliable): If <20 minutes remain and one team leads, the trailing team's price decays -1 to -3c per 5min. The leading team's price rises +1 to +3c per 5min. This is continuous and predictable.\\n\\n2. POST-GOAL MEAN REVERSION: If a goal was scored <3 minutes ago (check spike in candlesticks), the price likely spiked and will drift back -1 to -2c as the book digests.\\n\\n3. MOMENTUM CONTINUATION: If price has been trending consistently for 5+ minutes, it may continue another +1 to -1c unless there's a clear reason to reverse.\\n\\n4. STALE BOOK DRIFT: On very thin books (small recent volume), a single large order may have moved the mid artificially; it drifts back -1 to +1c.\\n\\n5. QUIET PERIODS: If none of the above apply (early in match, stable score, no recent action), predict 0.\\n\\nBe willing to predict non-zero moves when patterns are clear. Time decay in final 20 minutes is especially reliable. Quote tighter spreads (1-2c half-width) when confident in the pattern, wider (3-4c) when uncertain.\\n\\nYour forecast is the CHANGE in cents, not the absolute price. Negative for down, positive for up.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. Narrow (1-2c) when pattern is clear, wide (3-4c) when uncertain.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will. Name the specific pattern.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},
{"idx": 6, "score": 0.5771, "parents": "1", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match\nis being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in a\nfew minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing \u2014 a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no\n- the book being thin, so a single order moves the mid and it drifts back\n- the market still absorbing something that already happened\n\nWhat does not:\n- your view on which team is better. The market has that already.\n\nYou answer with two numbers.\n\n**How many cents it moves.** Not where the price is \u2014 where it goes. Zero is a real\nanswer and often the right one; a quiet book with nothing happening does not move.\nBut zero is a decision, not a default, and if the game has just changed you are\nexpected to say so in cents.\n\n**How wide a market you would make.** Half the width of the tightest two-sided quote\nyou would actually stand behind. Two cents means you would buy two under your number\nand sell two over it, and you would honour both sides. Ten cents means you barely\nknow. Quote what you would trade, not what is safe \u2014 but a width you cannot defend\nwill be paid for, because the trade goes on at your price and settles at the\nmarket's.\n\nDomain facts:\n\n**Recent events can be stale.** The game state shows what happened minutes ago, not\nwhat is happening now. A goal scored at 46' may still show as the most recent event\nat 50', 60', or 85'. The market absorbs news in seconds. If candlesticks show the\nprice already moved sharply and has since stabilized, the event is priced in. Do not\nforecast another move in the same direction unless you see evidence the market is\nstill adjusting.\n\n**Time decay is real but slow.** A team defending a one-goal lead loses roughly 0.5-2\ncents per five minutes as the clock runs down in quiet play. Not 5 cents, not 10\ncents. If you forecast -1 cent from pure time decay, you are being aggressive. Be\nmore conservative.\n\n**Late equalisers happen.** When a team is trailing late and pressing hard, the\nprobability of an equaliser in the next five minutes is not zero \u2014 it is often 10-20%.\nIf the market is pricing the leading team at 75-80%, that is already accounting for\nrealistic comeback odds. Do not forecast further drift toward 85-90% unless the game\nis truly dead. Wide quotes (3-5 cents half-width) are appropriate when an equaliser\nwould move the price 30+ cents and the game is still live.\n\n**Zero is the right answer more often than you think.** Most five-minute windows in a\nfootball match see no goals, no cards, and no significant price movement. Copying the\ncurrent mid (predicting zero change) is not a failure \u2014 it is often correct and earns\nskill when the market stays flat. Only forecast movement when you have a concrete\nreason: a fresh event still being absorbed, time decay in a situation where it\nmatters, or a thin book visibly drifting.\n\n**Check for evidence before calling a move.** If candlesticks show the mid has been\nflat for 10+ minutes, recent trades are small and balanced, and nothing has happened\nin the game, the correct forecast is zero cents, not \"maybe -1 from time decay\". Only\nforecast decay when you can see it already happening in the data, or when the\nsituation is so clear (e.g., defending a lead in the 89th minute) that the market\nmust move.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.5,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze_absorption\",\n      \"output_key\": \"analysis\",\n      \"prompt\": \"Game state: {{game}}\\nCurrent book: {{quote}}\\nLast 30 minutes of bars: {{path}}\\nRecent trades: {{tape}}\\n\\nAnalyze whether recent game events are fully absorbed into the price:\\n\\n1. List any goals/cards in the last 5 minutes from game.recent_events\\n2. For each recent event, calculate minutes since it occurred\\n3. Look at the candlestick pattern: is the mid still moving in one direction, or has it stabilized?\\n4. Check the last 2-3 bars: is volume elevated? Is mid changing each minute or flat?\\n5. Look at the tape: is there directional flow (all buys or all sells) or balanced?\\n\\nKey insight: Goals scored 1-3 minutes ago often take another 2-5 minutes to fully absorb. The market typically overshoots or undershoots initially, then corrects.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"recent_events_list\": {\n            \"type\": \"array\",\n            \"items\": {\"type\": \"string\"},\n            \"description\": \"Goals/cards from last 5 minutes with timestamps\"\n          },\n          \"price_trend_last_5min\": {\n            \"type\": \"string\",\n            \"description\": \"Is mid rising, falling, or stable in last 5 bars?\"\n          },\n          \"volume_pattern\": {\n            \"type\": \"string\",\n            \"description\": \"Is recent volume elevated or normal? Trending up or down?\"\n          },\n          \"tape_direction\": {\n            \"type\": \"string\",\n            \"description\": \"Are recent trades one-sided (buyers/sellers) or balanced?\"\n          },\n          \"absorption_status\": {\n            \"type\": \"string\",\n            \"enum\": [\"still_absorbing\", \"fully_absorbed\", \"uncertain\"],\n            \"description\": \"Is a recent event still being priced in?\"\n          },\n          \"momentum_cents_per_min\": {\n            \"type\": \"number\",\n            \"description\": \"If still absorbing, estimated drift per minute based on last 3 bars\"\n          }\n        },\n        \"required\": [\"recent_events_list\", \"price_trend_last_5min\", \"volume_pattern\", \"tape_direction\", \"absorption_status\", \"momentum_cents_per_min\"]\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nCurrent mid: {{quote.mid}}\\nGame: {{game}}\\n\\nAbsorption analysis:\\n- Recent events: {{analysis.recent_events_list}}\\n- Price trend: {{analysis.price_trend_last_5min}}\\n- Volume: {{analysis.volume_pattern}}\\n- Tape: {{analysis.tape_direction}}\\n- Status: {{analysis.absorption_status}}\\n- Momentum: {{analysis.momentum_cents_per_min}} cents/min\\n\\nPredict the 5-minute price move:\\n\\nIf absorption_status is 'still_absorbing': project the momentum forward, but expect it to decay (maybe 3-5 more cents in same direction).\\n\\nIf 'fully_absorbed': consider only time decay. For a team ahead with <15 minutes left, price drifts toward 1.00 at ~0.5-1 cent per 5 minutes. For a draw late in game, favorite drifts down slightly.\\n\\nIf 'uncertain' or no recent events and stable book: predict 0, but use wider half-width.\\n\\nYour prediction is RELATIVE to current mid. Negative means price will fall. Zero means it will stay the same.\\n\\nQuote a half-width you'd actually trade behind on both sides. Narrow (1-2c) means high confidence, wide (4-5c) means low confidence or you wouldn't trade.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\"delta_cents\", \"half_width_cents\", \"confidence\", \"driver\", \"falsifier\"],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.64)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.64)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.50)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.63)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.45)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.53)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.58)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
    0 -> 4;
    2 -> 5;
    1 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
