e examples show 6-64 bps moves on stories naming 4-16 stocks. These are not noise. They trigger:\n   - Sector rotation (chips up, chips down)\n   - Thematic flows (AI infrastructure, mega-cap risk-on/off)\n   - Correlation cascades (if story says \"tech selling\", tech stocks move together)\n   \n   **Default for 3-15 stock thematic story: predict 0 to 10 bps in the tape's recent direction, width 6-10 bps.** Only use 2 bps width on 20+ symbol listicles where your name is clearly irrelevant.\n\n**7. Cross-check:**\n\n   Before finalizing:\n   - Does my width cover the most likely outcome if I'm wrong about direction?\n   - If the stock moves 10 bps opposite to my call, does my width save me from a large skill penalty?\n   - Am I treating a thematic multi-stock story as noise when I should be guarding against sector moves?\n   - If the headline describes a move already done, am I betting on continuation when reversal is just as likely?\n\n**The pattern is clear: the harness underestimated the relevance of multi-stock stories and used widths too tight to guard against sector/thematic moves. On stories naming 3-15 symbols with a coherent thesis (sector trend, AI theme, tech selloff), use 5-10 bps width minimum, even if predicting zero. And when headlines describe moves already in progress, watch for reversals.**", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"timeframe\": \"1Min\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \" ic catalysts with uncertain magnitude (earnings reactions, major deals)**\n   \n   **When in doubt, go wider.** The feedback shows 2 bps width fails repeatedly. A correct direction with 10 bps width scores better than zero-with-2bps that misses by 12.\n\n**5. The default width by story type (summary):**\n\n   - **Tangential mention:** 2-4 bps\n   - **Whale/options list (3-10 symbols):** 5-8 bps\n   - **Thematic multi-stock (3-8 symbols with thesis):** 8-12 bps\n   - **Stock-specific analyst/opinion:** 8-15 bps\n   - **Stock-specific catalyst (earnings, guidance, deal):** 10-20 bps\n   - **Market-wide (20+ symbols):** 3-8 bps depending on sector relevance\n   \n   **The pattern is clear: 2 bps width is almost never appropriate.** Use it only when the story is explicitly about a different company and yours is named in passing. For everything else, start at 5 bps minimum.\n\n**6. Multi-stock stories matter more than you think:**\n\n   Examples 1, 3, 5, 7 show 5-26 bps moves on stories naming 3-8 stocks. These are not noise. They trigger:\n   - Thematic flows (AI infrastructure, trillion-dollar club, sector rotation)\n   - Follow-on trading (whale alerts bring retail, options flow signals positioning)\n   - Correlation cascades (if story groups your symbol with peers, they move together)\n   \n   **Default for 3-8 stock story: predict 0 to 8 bps based on tape direction, width 8-12 bps.**\n\n**7. Cross-check before finalizing:**\n\n   - Does my width cover the most likely outcome if I'm wrong about direction?\n   - If I predict zero and the stock moves 10 bps, does my width limit the damage?\n   - Am I using 2 bps width on anything other than a tangential mention?\n   - If the story names 3-8 stocks with a thesis, am I using at least 8 bps width?\n   - If it's a stock-specific catalyst, am I using at least 8 bps width?\n\n**The pattern is clear: the harness systematically under-widths. The 2 bps default fails on multi-stock thematic stories, whale activity lists, and even stock-specific analyst pieces. Start at 5-8 bps for most stories, 8-12 bps for thematic multi-stock and stock-specific catalysts, and reserve 2 bps only for tangential mentions where your symbol is clearly irrelevant to the story.**", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"timeframe\": \"1Min\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"recent_trades\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"minutes_back\": 5,\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"day\",\n      \"output_key\": \"day\",\n      \"tool\": \"daily_context\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"story\",\n      \"output_key\": \"story\",\n      \"tool\": \"the_story\",\n      \"args\": {},\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"market\",\n      \"output_key\": \"market\",\n      \"tool\": \"market_tape\",\n      \"args\": {\n        \"symbol\": \"SPY\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"summary\",\n      \"output_key\": \"summary\",\n      \"tool\": \"state_summary\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"forecast\",\n      \"prompt\": \"Symbol: {{question}}\\nSituation: {{summary.summary}}\\nThe story, as it broke: {{news}}\\nStory detail: {{story}}\\nSession: {{context}}\\nLast bar: {{quote}}\\nThe day so far: {{day}}\\nSPY: {{market}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"questions\": {\n        \"move\": {\n          \"type\": \"score\",\n          \"instructions\": \"How many basis points the price moves over the next five minutes, from the last complete minute close shown. Positive is up. A headline the market has already read leaves the price within a few basis points either way.\",\n          \"criteria\": [\n            \"down 100 basis points or more\",\n            \"down 40 to 100 basis points\",\n            \"down 10 to 40 basis points\",\n            \"unchanged, within 10 basis points either way\",\n            \"up 10 to 40 basis points\",\n            \"up 40 to 100 basis points\",\n            \"up 100 basis points or more\"\n          ],\n          \"values\": [\n            -60,\n            -25,\n            -8,\n            0,\n            8,\n            25,\n            60\n          ]\n        }\n      },\n      \"answers\": {\n        \"delta_bps\": {\n          \"from\": \"move\",\n          \"as\": \"mean\"\n        },\n        \"half_width_bps\": {\n          \"from\": \"move\",\n          \"as\": \"half_range\",\n          \"coverage\": 0.6,\n          \"min\": 2\n        },\n        \"confidence\": {\n          \"from\": \"move\",\n          \"as\": \"confidence\"\n        },\n        \"driver\": {\n          \"as\": \"const\",\n          \"value\": \"the expectation of the move distribution\"\n        },\n        \"falsifier\": {\n          \"as\": \"const\",\n          \"value\": \"a print outside the quoted band before five minutes are up\"\n        }\n      }\n    }\n  ]\n}", "too
