const NODES = [{"idx": 0, "score": 0.5166, "parents": "seed", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match\nis being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in a\nfew minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing \u2014 a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no\n- the book being thin, so a single order moves the mid and it drifts back\n- the market still absorbing something that already happened\n\nWhat does not:\n- your view on which team is better. The market has that already.\n\nYou answer with two numbers.\n\n**How many cents it moves.** Not where the price is \u2014 where it goes. Zero is a real\nanswer and often the right one; a quiet book with nothing happening does not move.\nBut zero is a decision, not a default, and if the game has just changed you are\nexpected to say so in cents.\n\n**How wide a market you would make.** Half the width of the tightest two-sided quote\nyou would actually stand behind. Two cents means you would buy two under your number\nand sell two over it, and you would honour both sides. Ten cents means you barely\nknow. Quote what you would trade, not what is safe \u2014 but a width you cannot defend\nwill be paid for, because the trade goes on at your price and settles at the\nmarket's.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 12\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\\n\\nHow many cents does this mid move over the next 5 minutes, and how wide a market would you make around that? Zero cents is a real answer on a quiet book. Quote a width you would actually stand behind on both sides.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \\u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. This is your quote: you are saying you would buy at (prediction - this) and sell at (prediction + this). Narrow means you will trade; wide means you will not.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

ownward.** If a team leads 1-0 at 65 minutes,\ntheir win probability rises as the clock runs without an equalizer. Time is their\nally. The price drifts up, not down. This is not \"time decay toward no\" \u2014 that\napplies to \"will X happen\" contracts, not \"will team Y win\" contracts when Y is\nalready winning.\n\n**Scoreless draws decay both ways toward a coin flip.** At 0-0, both team-win\ncontracts decay toward lower values as time passes without a goal, because a draw\nbecomes more likely.\n\n**When you predict zero movement, widen your market.** If the game is quiet and you\nexpect no change, you still face uncertainty about whether something will happen.\nA 1-2 cent half-width on a zero-delta forecast is overconfident. Use 2-3 cents\nminimum unless the book is locked and the clock is stopped.\n\n**Large sudden moves are possible and you must flag them.** Goals happen. A 0-0 game\ncan become 1-0 in the next minute, moving the price 10-30 cents instantly. If the\ngame is live and close, your half-width must reflect this. A 3-cent market when a\ngoal would move the price 20 cents is not defensible. Either predict the direction\nif you see momentum, or quote a wide market (5-10 cents) to cover the risk.\n\n**The current mid is not your baseline.** Predicting delta_cents: 0 because the mid\nis currently stable earns exactly zero skill. You are rewarded only for correctly\nanticipating moves that actually happen. If the game state suggests the price\nshould drift up 1-2 cents over five minutes, say so.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 12\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nBook now: {{quote}}\\nGame: {{game}}\\nMinute bars, last 45m: {{path}}\\nRecent prints: {{tape}}\\n\\nHow many cents does this mid move over the next 5 minutes, and how wide a market would you make around that? Zero cents is a real answer on a quiet book. Quote a width you would actually stand behind on both sides.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 6,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. Do not state a price \\u2014 state the change.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. This is your quote: you are saying you would buy at (prediction - this) and sell at (prediction + this). Narrow means you will trade; wide means you will not.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given how thin and noisy this book is.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The one thing you expect to move it, or why nothing will.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would show this call was wrong, before settlement.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

ownward.** If a team leads 1-0 at 65 minutes,\ntheir win probability rises as the clock runs without an equalizer. Time is their\nally. The price drifts up, not down. This is not \"time decay toward no\" \u2014 that\napplies to \"will X happen\" contracts, not \"will team Y win\" contracts when Y is\nalready winning.\n\n**Scoreless draws decay both ways toward a coin flip.** At 0-0, both team-win\ncontracts decay toward lower values as time passes without a goal, because a draw\nbecomes more likely.\n\n**When you predict zero movement, widen your market.** If the game is quiet and you\nexpect no change, you still face uncertainty about whether something will happen.\nA 1-2 cent half-width on a zero-delta forecast is overconfident. Use 2-3 cents\nminimum unless the book is locked and the clock is stopped.\n\n**Large sudden moves are possible and you must flag them.** Goals happen. A 0-0 game\ncan become 1-0 in the next minute, moving the price 10-30 cents instantly. If the\ngame is live and close, your half-width must reflect this. A 3-cent market when a\ngoal would move the price 20 cents is not defensible. Either predict the direction\nif you see momentum, or quote a wide market (5-10 cents) to cover the risk.\n\n**The current mid is not your baseline.** Predicting delta_cents: 0 because the mid\nis currently stable earns exactly zero skill. You are rewarded only for correctly\nanticipating moves that actually happen. If the game state suggests the price\nshould drift up 1-2 cents over five minutes, say so.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze_recent_action\",\n      \"output_key\": \"analysis\",\n      \"prompt\": \"Contract: {{question}}\\nGame state: {{game}}\\nCurrent book: {{quote}}\\nMinute bars (last 45m): {{path}}\\nRecent prints: {{tape}}\\n\\nAnalyze the price action over the last 10-15 minutes:\\n\\n1. Has there been a large jump (10+ cents) in the last few minutes that suggests a goal or major event NOT YET reflected in the game state?\\n2. Has the price been stable, drifting slowly, or bouncing around?\\n3. Is the current mid consistent with the score and time, or does it look like it's still absorbing recent news?\\n4. What is the typical spread and how liquid is this book?\\n\\nBe specific about timing - look at the timestamps.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"recent_jump\": {\n            \"type\": \"boolean\",\n            \"description\": \"True if there was a 10+ cent move in the last 5-10 minutes\"\n          },\n          \"jump_direction\": {\n            \"type\": \"string\",\n            \"description\": \"up, down, or none\"\n          },\n          \"jump_size_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Size of the recent jump if any, in cents\"\n          },\n          \"price_stability\": {\n            \"type\": \"string\",\n            \"description\": \"stable, drifting, volatile, or absorbing\"\n          },\n          \"current_mid_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Current mid price in cents\"\n          },\n          \"five_minutes_ago_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Mid price approximately 5 minutes ago, in cents\"\n          },\n          \"spread_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Current spread in cents\"\n          },\n          \"diagnosis\": {\n            \"type\": \"string\",\n            \"description\": \"What is happening in this market right now? Is it still digesting news, quiet, or balanced?\"\n          }\n        },\n        \"required\": [\n          \"recent_jump\",\n          \"jump_direction\",\n          \"jump_size_cents\",\n          \"price_stability\",\n          \"current_mid_cents\",\n          \"spread_cents\",\n          \"diagnosis\"\n        ]\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nGame: {{game}}\\nCurrent quote: {{quote}}\\n\\nMarket analysis: {{analysis}}\\n\\nNow forecast the next 5 minutes:\\n\\nKey rules:\\n1. If there was a recent large jump ({{analysis.recent_jump}}), the market may still be absorbing it - continuation in the same direction is possible, OR mean reversion if it overshot.\\n2. Time decay is TINY - a typical move is only 1-3 cents over 5 minutes. Don't predict large time-decay moves unless very late in the game (85+ minutes).\\n3. Zero cents is often correct on a stable book.\\n4. The only things that move prices significantly are: goals (10-30 cents instantly), red cards (5-15 cents), and very late game time (80+ minutes, 1-2 cents per 5 min).\\n5. If the price jumped recently but the game state doesn't show a new goal, the market may know something - predict continuation or consolidation.\\n6. Wide spreads (2+ cents) mean thin books where noise dominates - be conservative.\\n\\nHow many cents will the mid MOVE (not where will it be) over the next 5 minutes?\",\n      \"to {"idx": 3, "score": 0.5168, "parents": "2", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match\nis being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in a\nfew minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing \u2014 a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no\n- the book being thin, so a single order moves the mid and it drifts back\n- the market still absorbing something that already happened\n\nWhat does not:\n- your view on which team is better. The market has that already.\n\nYou answer with two numbers.\n\n**How many cents it moves.** Not where the price is \u2014 where it goes. Zero is a real\nanswer and often the right one; a quiet book with nothing happening does not move.\nBut zero is a decision, not a default, and if the game has just changed you are\nexpected to say so in cents.\n\n**How wide a market you would make.** Half the width of the tightest two-sided quote\nyou would actually stand behind. Two cents means you would buy two under your number\nand sell two over it, and you would honour both sides. Ten cents means you barely\nknow. Quote what you would trade, not what is safe \u2014 but a width you cannot defend\nwill be paid for, because the trade goes on at your price and settles at the\nmarket's.\n\n## Critical patterns from recent events\n\n**Recent events can be stale.** A goal listed in recent_events may have happened\nminutes ago and be fully absorbed by the current mid. Check candlesticks and\nprevious_trades to see if the price already moved. If it spiked and settled, the\nevent is priced. If the goal was at 46' and you're forecasting at 50', the market\nhas had four minutes to react \u2014 assume it did unless the tape shows otherwise.\n\n**Direction matters more than you think.** Wrong-direction forecasts score worse than\npredicting zero. If you predict +1c and the market moves -1c, you score negative\nskill. If you predict 0c when it moves -1c, you score zero skill. Getting the sign\nwrong is costly. When uncertain about direction, predict zero and widen your quote.\n\n**Time decay for a team WINNING goes UP, not down.** This is the most common error.\nIf Chelsea leads 1-0 at 70', their win probability RISES as the clock runs without\nan equalizer. Each passing minute makes it harder for the opponent to score. The\nprice drifts UP. This is not \"time decay toward no\" \u2014 that applies to \"will X happen\"\ncontracts. A team defending a lead grows MORE likely to win as time expires.\n\n**Time decay for a team LOSING goes DOWN.** If Chelsea trails 0-1 at 70', their win\nprobability FALLS as time passes. Fewer minutes remain to equalize and then win.\nThe price drifts DOWN.\n\n**Scoreless draws decay both ways toward a coin flip.** At 0-0, both team-win\ncontracts decay toward lower values as time passes without a goal, because a draw\nbecomes more likely. But this is a weak effect early in the match.\n\n**Absorption takes time but not as much as you think.** A goal moves the price\n10-30 cents instantly, but full absorption happens within 2-3 minutes, not 10-15.\nIf a goal happened 6+ minutes ago and candlesticks show the price has been stable\nfor 3+ minutes, it is fully priced. Do not predict continued \"absorption drift\"\nlong after the event. The market is faster than you expect.\n\n**After absorption, time decay dominates.** Once a goal is absorbed and the price\nstabilizes, the next driver is time decay. If the score is not level, the winning\nteam's price drifts up (or the losing team's price drifts down) at roughly 0.5-1.5\ncents per five minutes in the first half, and faster (1-3 cents per five minutes)\nin the second half when time remaining matters more.\n\n**When you predict zero movement, widen your market significantly.** If the game is\nquiet and you expect no change, you still face uncertainty about whether something\nwill happen. A 2-3 cent half-width on a zero-delta forecast is overconfident when\nthe game is live. Use 3-5 cents for a quiet game in the first half, 5-8 cents in\nthe second half when goals are more likely and move the price further.\n\n**Large sudden moves are possible and you must account for them in width.** Goals\nhappen. A 0-0 game can become 1-0 in the next minute, moving the price 15-25 cents\ninstantly. If the game is live and close, your half-width must reflect this. A 3-cent\nmarket when a goal would move the price 20 cents is not defensible. Either predict\nthe direction if you see signs of momentum, or quote a wide market (5-10 cents) to\ncover the two-sided risk.\n\n**The current mid is not your baseline.** Predicting delta_cents: 0 because the mid\nis currently stable earns exactly zero skill. You are rewarded only for correctly\nanticipating moves that actually happen. If the game state suggests the price should\ndrift up 1-2 cents over five minutes due to time decay, say so. But if you are\nunsure of the direction, zero is better than guessing wrong.\n\n**Check the score and clock to determine time decay direction.** Before predicting:\n1. Is one team winning? The winning team's price drifts UP as time passes.\n2. Is the score level? Both team prices drift DOWN slightly (draw becomes more likely).\n3. How much time remains? More time remaining = slower decay. Less time = faster decay.\n4. Has a recent goal been absorbed? Check candlesticks. If stable for 3+ minutes, it's priced.\n\n**When trailing by a goal late in the match, decay accelerates downward.** A team\nlosing 0-1 at 80' has their price collapse faster than at 60'. The effect is\nnonlinear. Do not underestimate late-game time decay.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.75,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze_recent_action\",\n      \"output_key\": \"analysis\",\n      \"prompt\": \"Contract: {{question}}\\nGame state: {{game}}\\nCurrent book: {{quote}}\\nMinute bars (last 45m): {{path}}\\nRecent prints: {{tape}}\\n\\nAnalyze the price action over the last 10-15 minutes:\\n\\n1. Has there been a large jump (10+ cents) in the last few minutes that suggests a goal or major event NOT YET reflected in the game state?\\n2. Has the price been stable, drifting slowly, or bouncing around?\\n3. Is the current mid consistent with the score and time, or does it look like it's still absorbing recent news?\\n4. What is the typical spread and how liquid is this book?\\n\\nBe specific about timing - look at the timestamps.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"recent_jump\": {\n            \"type\": \"boolean\",\n            \"description\": \"True if there was a 10+ cent move in the last 5-10 minutes\"\n          },\n          \"jump_direction\": {\n            \"type\": \"string\",\n            \"description\": \"up, down, or none\"\n          },\n          \"jump_size_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Size of the recent jump if any, in cents\"\n          },\n          \"price_stability\": {\n            \"type\": \"string\",\n            \"description\": \"stable, drifting, volatile, or absorbing\"\n          },\n          \"current_mid_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Current mid price in cents\"\n          },\n          \"five_minutes_ago_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Mid price approximately 5 minutes ago, in cents\"\n          },\n          \"spread_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Current spread in cents\"\n          },\n          \"diagnosis\": {\n            \"type\": \"string\",\n            \"description\": \"What is happening in this market right now? Is it still digesting news, quiet, or balanced?\"\n          }\n        },\n        \"required\": [\n          \"recent_jump\",\n          \"jump_direction\",\n          \"jump_size_cents\",\n          \"price_stability\",\n          \"current_mid_cents\",\n          \"spread_cents\",\n          \"diagnosis\"\n        ]\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nGame: {{game}}\\nCurrent quote: {{quote}}\\n\\nMarket analysis: {{analysis}}\\n\\nNow forecast the next 5 minutes:\\n\\nKey rules:\\n1. If there was a recent large jump ({{analysis.recent_jump}}), the market may still be absorbing it - continuation in the same direction is possible, OR mean reversion if it overshot.\\n2. Time decay is TINY - a typical move is only 1-3 cents over 5 minutes. Don't predict large time-decay moves unless very late in the game (85+ minutes).\\n3. Zero cents is often correct on a stable book.\\n4. The only things that move prices significantly are: goals (10-30 cents instantly), red cards (5-15 cents), and very late game time (80+ minutes, 1-2 cents per 5 min).\\n5. If the price jumped recently but the game state doesn't show a new goal, the market may know something - predict continuation or consolidation.\\n6. Wide spreads (2+ cents) mean thin books where noise dominates - be conservative.\\n\\nHow many cents will the mid MOVE (not where will it be) over the next 5 minutes?\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move. This is the CHANGE, not the price level.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would actually stand behind, in cents. Minimum 2 cents for thin books, can be 1-1.5 for liquid markets where you're confident.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure, given the book thickness and price action.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The primary reason for your prediction: recent jump still absorbing, thin book noise, time decay, or expecting stability.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would prove this wrong within 5 minutes.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},
{"idx": 4, "score": 0.4968, "parents": "2", "role": "Pareto Front", "components": {"context": "You forecast the short-term path of a Kalshi sports contract while the match\nis being played.\n\nYou are not asked who wins. You are asked where this contract's mid price will be in a\nfew minutes, which is a narrower and more answerable question.\n\nWhat moves a price on this horizon:\n- the game state changing \u2014 a goal, a red card, a period ending\n- time simply passing, which decays any \"will happen\" contract toward no\n- the book being thin, so a single order moves the mid and it drifts back\n- the market still absorbing something that already happened\n\nWhat does not:\n- your view on which team is better. The market has that already.\n\nYou answer with two numbers.\n\n**How many cents it moves.** Not where the price is \u2014 where it goes. Zero is a real\nanswer and often the right one; a quiet book with nothing happening does not move.\nBut zero is a decision, not a default, and if the game has just changed you are\nexpected to say so in cents.\n\n**How wide a market you would make.** Half the width of the tightest two-sided quote\nyou would actually stand behind. Two cents means you would buy two under your number\nand sell two over it, and you would honour both sides. Ten cents means you barely\nknow. Quote what you would trade, not what is safe \u2014 but a width you cannot defend\nwill be paid for, because the trade goes on at your price and settles at the\nmarket's.\n\n## Critical patterns from recent events\n\n**Recent events can be stale.** A goal listed in recent_events may have happened\nminutes ago and be fully absorbed by the current mid. Check candlesticks and\nprevious_trades to see if the price already moved. If it spiked and settled, the\nevent is priced. If the goal was at 46' and you're forecasting at 50', the market\nhas had four minutes to react \u2014 assume it did unless the tape shows otherwise.\n\n**A team winning decays upward, not downward.** If a team leads 1-0 at 65 minutes,\ntheir win probability rises as the clock runs without an equalizer. Time is their\nally. The price drifts up, not down. This is not \"time decay toward no\" \u2014 that\napplies to \"will X happen\" contracts, not \"will team Y win\" contracts when Y is\nalready winning.\n\n**Scoreless draws decay both ways toward a coin flip.** At 0-0, both team-win\ncontracts decay toward lower values as time passes without a goal, because a draw\nbecomes more likely.\n\n**When you predict zero movement, widen your market.** If the game is quiet and you\nexpect no change, you still face uncertainty about whether something will happen.\nA 1-2 cent half-width on a zero-delta forecast is overconfident. Use 2-3 cents\nminimum unless the book is locked and the clock is stopped.\n\n**Large sudden moves are possible and you must flag them.** Goals happen. A 0-0 game\ncan become 1-0 in the next minute, moving the price 10-30 cents instantly. If the\ngame is live and close, your half-width must reflect this. A 3-cent market when a\ngoal would move the price 20 cents is not defensible. Either predict the direction\nif you see momentum, or quote a wide market (5-10 cents) to cover the risk.\n\n**The current mid is not your baseline.** Predicting delta_cents: 0 because the mid\nis currently stable earns exactly zero skill. You are rewarded only for correctly\nanticipating moves that actually happen. If the game state suggests the price\nshould drift up 1-2 cents over five minutes, say so.", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"ticker\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"hours_back\": 0.25,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 30\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"detect_absorption\",\n      \"output_key\": \"absorption\",\n      \"prompt\": \"Contract: {{question}}\\nGame: {{game}}\\nQuote: {{quote}}\\nLast 15 min bars: {{path}}\\nRecent trades: {{tape}}\\n\\nDetect if the market is STILL ABSORBING a recent goal or major event:\\n\\n1. Look at the minute bars - was there a jump of 10+ cents in the LAST 1-3 MINUTES?\\n2. Check if game.recent_events shows a goal in the last 1-5 minutes.\\n3. If yes to either: the market may still be moving in that direction (continuation) for another 2-5 minutes.\\n4. If the jump was 5+ minutes ago, it's fully absorbed - no continuation expected.\\n\\nBe precise about timestamps. A goal at minute 17 when we're at minute 20 is 3 minutes old.\\n\\nKey insight: Goals cause 15-30 cent moves that take 2-4 minutes to fully absorb. If we're in that window, predict continuation. If not, predict zero.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"recent_goal_or_jump\": {\n            \"type\": \"boolean\",\n            \"description\": \"True if there was a goal in the last 5 minutes OR a 10+ cent price jump in the last 3 minutes\"\n          },\n          \"minutes_since_event\": {\n            \"type\": \"number\",\n            \"description\": \"How many minutes ago was the goal or jump? null if none.\"\n          },\n          \"jump_direction\": {\n            \"type\": \"string\",\n            \"enum\": [\"up\", \"down\", \"none\"],\n            \"description\": \"Direction of the recent jump if any\"\n          },\n          \"magnitude_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Size of the jump in cents, 0 if none\"\n          },\n          \"still_absorbing\": {\n            \"type\": \"boolean\",\n            \"description\": \"True if the event was less than 3 minutes ago and the market likely hasn't finished moving\"\n          },\n          \"current_mid_cents\": {\n            \"type\": \"number\"\n          },\n          \"three_minutes_ago_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Mid price 3 minutes ago\"\n          }\n        },\n        \"required\": [\"recent_goal_or_jump\", \"minutes_since_event\", \"jump_direction\", \"magnitude_cents\", \"still_absorbing\", \"current_mid_cents\", \"three_minutes_ago_cents\"]\n      }\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"predict\",\n      \"output_key\": \"prediction\",\n      \"prompt\": \"Contract: {{question}}\\nGame: {{game}}\\nQuote: {{quote}}\\nAbsorption analysis: {{absorption}}\\n\\nForecast the next 5 minutes using these rules:\\n\\n**DEFAULT TO ZERO**: Most 5-minute windows have no meaningful price movement. Only predict non-zero if one of these applies:\\n\\n1. **Still absorbing a recent goal** ({{absorption.still_absorbing}} = true): If a goal/major event happened less than 3 minutes ago and the price jumped {{absorption.magnitude_cents}} cents, it may continue another 20-40% of that move in the same direction. Predict continuation.\\n\\n2. **Thin book mean reversion**: If the spread is 2+ cents and the price just jumped 3+ cents in the last 1-2 minutes (but no goal in game state), it was likely a single order moving a thin book. Predict 50% retracement.\\n\\n3. **Very late game time decay** (85+ minutes): If one team leads and clock is 85'+, predict 0.5-1.0 cents per 5 minutes in favor of the leader. But ONLY at 85+, not at 60' or 70'.\\n\\nIf NONE of these apply, predict delta_cents = 0.\\n\\n**Calibration**:\\n- Typical goal causes 20 cent jump over 3-4 minutes (5-7 cents per minute initially, slowing down)\\n- At 2 minutes post-goal: predict 2-4 cents continuation\\n- At 5+ minutes post-goal: predict 0 cents\\n- Time decay before 80': essentially zero, maybe 0.2 cents per 5 min\\n- Time decay 80-85': 0.5 cents per 5 min for leading team\\n- Time decay 85'+: 1-1.5 cents per 5 min for leading team\\n\\n**Half-width**: \\n- Use current spread as baseline (quote.spread * 100 cents)\\n- Add 1-2 cents for your forecast uncertainty\\n- Tighter (1.5-2 cents) when predicting zero on a stable liquid book\\n- Wider (3-4 cents) when predicting non-zero or book is thin\\n\\nOutput delta_cents (the CHANGE in mid, negative for down), half_width_cents, confidence, driver, falsifier.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move (the most common answer). This is the CHANGE, not the price level.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would stand behind, in cents. Typically current spread plus 1-2 cents for uncertainty.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure you are.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The primary reason: 'still absorbing recent goal', 'thin book reversion', 'late-game time decay', or 'stable/no catalyst'.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would prove this wrong within 5 minutes.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n          \"confidence\",\n          \"driver\",\n          \"falsifier\"\n        ],\n        \"additionalProperties\": false\n      }\n    }\n  ]\n}", "tools": "market_quote, candlesticks, previous_trades"}},

0,\n        \"hourly\": false\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"previous_trades\",\n      \"args\": {\n        \"ticker\": \"{{question}}\",\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"prompt\",\n      \"name\": \"analyze\",\n      \"output_key\": \"analysis\",\n      \"prompt\": \"Contract: {{question}}\\nGame state: {{game}}\\nCurrent book: {{quote}}\\nMinute bars (last 60min): {{path}}\\nRecent prints: {{tape}}\\n\\nAnalyze the market state:\\n\\n1. RECENT EVENT ABSORPTION: Look at recent_events. If a goal/card happened in the last 1-3 minutes, compare current mid to the candlestick history. Has the price already spiked and stabilized? Or is it still moving?\\n\\n2. TIME DECAY DIRECTION: \\n   - If a team is WINNING: their win probability INCREASES as time passes without the other team scoring. Their price should drift UP.\\n   - If a team is LOSING: their win probability DECREASES as time passes. Their price should drift DOWN.\\n   - If DRAWING: both win probabilities decrease; the draw becomes more likely.\\n   \\n3. MAGNITUDE: Goals that just happened (0-2 min ago) can cause 10-20 cent moves as they're absorbed. Time decay in stable situations is typically 0-2 cents per 5 minutes.\\n\\n4. BOOK QUALITY: Wide spread or thin tape means less confidence.\\n\\nProvide structured analysis of these factors.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"event_status\": {\n            \"type\": \"string\",\n            \"description\": \"absorbed|absorbing|stable - whether recent events are already priced in\"\n          },\n          \"time_decay_direction\": {\n            \"type\": \"string\",\n            \"description\": \"up|down|neutral - which way time passing should move this contrac ot downward.** If a team leads 1-0 at 65 minutes,\ntheir win probability rises as the clock runs without an equalizer. Time is their\nally. The price drifts up, not down. This is not \"time decay toward no\" \u2014 that\napplies to \"will X happen\" contracts, not \"will team Y win\" contracts when Y is\nalready winning. Expect +0.5 to +1.5 cents per five minutes late in the match.\n\n**A team losing decays downward.** The mirror image: if you're forecasting the\nlosing team's win contract, it decays toward zero as time passes. The longer they\nfail to equalize, the less likely they win. Expect -0.5 to -1.5 cents per five\nminutes late in the match.\n\n**Scoreless draws decay both ways toward a coin flip.** At 0-0, both team-win\ncontracts decay toward lower values as time passes without a goal, because a draw\nbecomes more likely. Expect -0.3 to -0.8 cents per five minutes as the match\nprogresses without a goal.\n\n**After a goal, check if the market has absorbed it.** If recent_events shows a\ngoal but candlesticks show the price already spiked and stabilized minutes ago,\nthe move is done. If the goal is fresh (within 1-2 minutes of current time) and\nthe tape shows ongoing volume at a new level, there may be further drift of 1-3\ncents in the same direction as the initial move.\n\n**When you predict zero movement, widen your market.** If the game is quiet and you\nexpect no change, you still face uncertainty about whether something will happen.\nA 1-2 cent half-width on a zero-delta forecast is overconfident. Use 3-5 cents\nminimum unless the book is locked and the clock is stopped. Live soccer has goal\nrisk every minute.\n\n**Large sudden moves are possible and you must flag them.** Goals happen. A 0-0 game\ncan become 1-0 in the next minute, moving the price 10-30 cents instantly. If the\ngame is live and close, your half-width must reflect this. A 2-3 cent market when a\ngoal would move the price 20 cents is not defensible. Either predict the direction\nif ially, slowing down)\\n- At 2 minutes post-goal: predict 2-4 cents continuation\\n- At 5+ minutes post-goal: predict 0 cents\\n- Time decay before 80': essentially zero, maybe 0.2 cents per 5 min\\n- Time decay 80-85': 0.5 cents per 5 min for leading team\\n- Time decay 85'+: 1-1.5 cents per 5 min for leading team\\n\\n**Half-width**: \\n- Use current spread as baseline (quote.spread * 100 cents)\\n- Add 1-2 cents for your forecast uncertainty\\n- Tighter (1.5-2 cents) when predicting zero on a stable liquid book\\n- Wider (3-4 cents) when predicting non-zero or book is thin\\n\\nOutput delta_cents (the CHANGE in mid, negative for down), half_width_cents, confidence, driver, falsifier.\",\n      \"tools\": [],\n      \"max_tool_iterations\": 0,\n      \"output_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"delta_cents\": {\n            \"type\": \"number\",\n            \"description\": \"How many cents the mid will MOVE over the next five minutes. Negative for down, 0 for no move (the most common answer). This is the CHANGE, not the price level.\"\n          },\n          \"half_width_cents\": {\n            \"type\": \"number\",\n            \"description\": \"Half the width of the tightest two-sided market you would stand behind, in cents. Typically current spread plus 1-2 cents for uncertainty.\"\n          },\n          \"confidence\": {\n            \"type\": \"number\",\n            \"description\": \"0-1. How sure you are.\"\n          },\n          \"driver\": {\n            \"type\": \"string\",\n            \"description\": \"The primary reason: 'still absorbing recent goal', 'thin book reversion', 'late-game time decay', or 'stable/no catalyst'.\"\n          },\n          \"falsifier\": {\n            \"type\": \"string\",\n            \"description\": \"What would prove this wrong within 5 minutes.\"\n          }\n        },\n        \"required\": [\n          \"delta_cents\",\n          \"half_width_cents\",\n const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
