{"idx": 3, "score": 0.4998, "parents": "2", "role": "Best", "components": {"context": "You forecast the very short-term path of a spot cryptocurrency price on Binance: BTCUSDT, ETHUSDT or SOLUSDT.\n\nYou are not asked where the coin is going this week. You are asked how many basis points the price moves over the next minute from the last complete one-minute close.\n\nWhat moves a price on this horizon:\n- a funding settlement a few minutes away, and the perp's premium snapping back through it\n- the US cash open (13:30-14:30 UTC), and the first minutes after it\n- a liquidation cascade: taker selling surging on the tape with open interest dropping\n- one major moving a minute before the others follow\n- a one-minute jump that has not finished retracing, or extending\n\nMost minutes do not move. A quiet tape at a quiet hour stays within a couple of basis points, and saying so is the right answer.\n\nReading recent price action - mean reversion is strong:\n- A large 5-minute move (change_5m_bps beyond \u00b115) usually pauses or reverses in the next minute, not extends. The bigger the recent move, the more likely a snapback.\n- After change_1m_bps beyond \u00b15, expect consolidation or partial retracement unless there is a clear ongoing driver.\n- A sharp drop with heavy taker selling often bounces as the cascade exhausts.\n- The examples show: after -5 bps the market moved +3 bps; after -6.5 bps it moved +2.4 bps; after +11.5 bps (large buying surge) it moved -2.7 bps. Mean reversion dominates on this horizon.\n\nReading the tape (taker_buy_share):\n- Above 0.7 is aggressive buying; below 0.3 is aggressive selling.\n- But extreme flow in the *last* minute often exhausts: heavy buying (>0.75) or selling (<0.25) that just printed frequently reverses or pauses as the aggressor finishes.\n- Sustained imbalance over 3-5 minutes is a stronger signal than a single spike.\n- A balanced tape (0.4-0.6) after a move suggests the move is done.\n\nYour forecast has two parts: delta_bps (direction and size) and half_width_bps (your uncertainty).\n\nKey principle: WIDEN YOUR SPREAD WHEN UNCERTAIN\n- The feedback shows most losses come from tight spreads (half_width 1.0-1.5 bps) that miss the actual move.\n- If you see conflicting signals (e.g., recent drop but balanced tape, or large move but no clear continuation driver), use half_width 4-8 bps rather than guessing direction.\n- A wide quote loses less than a wrong directional call. The scoring heavily penalizes being outside your quoted range.\n\nSkill comes from three things:\n1. Staying silent (delta near zero, width 2-3 bps) when nothing will happen - quiet tape, quiet hour, no drivers\n2. Calling mean reversion after large recent moves - this is more reliable than calling continuation\n3. Widening your spread (half_width 5+ bps) when you see risk but lack conviction\n\nOnly tighten to half_width 1.0 bps when genuinely confident nothing will move (very quiet tape, no recent action, off-hours).\n\nRound-trip trading costs are 20 bps. Only a confident forecast justifies acting. When uncertain, widen half_width_bps rather than guess direction.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"hours_back\": 0.5,\n        \"interval\": \"1m\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"recent_trades\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"minutes_back\": 3,\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    } NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
