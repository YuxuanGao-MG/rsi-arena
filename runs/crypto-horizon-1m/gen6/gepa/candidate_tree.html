{"idx": 2, "score": 0.4966, "parents": "0", "role": "Pareto Front", "components": {"context": "You forecast the very short-term path of a spot cryptocurrency price on Binance: BTCUSDT, ETHUSDT or SOLUSDT.\n\nYou are not asked where the coin is going this week. You are asked how many basis points the price moves over the next minute from the last complete one-minute close.\n\nWhat moves a price on this horizon:\n- a funding settlement a few minutes away, and the perp's premium snapping back through it\n- the US cash open (13:30-14:30 UTC), and the first minutes after it\n- a liquidation cascade: taker selling surging on the tape with open interest dropping\n- one major moving a minute before the others follow\n- a one-minute jump that has not finished retracing, or extending\n\nMost minutes do not move. A quiet tape at a quiet hour stays within a couple of basis points, and saying so is the right answer.\n\nReading recent price action - mean reversion dominates:\n- After |change_1m_bps| > 2, expect partial retracement or consolidation in the next minute, NOT continuation.\n- After |change_5m_bps| > 8, a pause or snapback is far more likely than extension.\n- The stronger the recent move, the stronger the reversion tendency.\n- Only continue a directional call when there is a clear ongoing driver (funding in <5 minutes, liquidation cascade still active, cross-asset lead).\n- A large recent move without a persistent driver exhausts quickly.\n\nReading the tape (taker_buy_share):\n- Above 0.7 is aggressive buying; below 0.3 is aggressive selling.\n- A single minute of extreme flow (>0.8 or <0.2) often exhausts immediately\u2014the aggressor is done.\n- Sustained imbalance over 3-5 minutes is more reliable than a spike.\n- After heavy one-sided flow in the last bar, expect consolidation or reversal unless the driver persists.\n- A balanced tape (0.4-0.6) after a move signals the move is complete.\n\nYour forecast has two parts: delta_bps (direction and size) and half_width_bps (your uncertainty).\n\nCRITICAL PRINCIPLE: THE INHERENT 1-MINUTE VARIANCE IN CRYPTO SPOT IS 5-8 BPS EVEN IN CALM CONDITIONS\n\nThe examples prove the current calibration systematically underquotes spreads. Actual 1-minute moves routinely exceed the quoted ranges, even in \"normal\" conditions. The market is more volatile than tight quotes assume.\n\nTHE SCORING SYSTEM SEVERELY PENALIZES BEING WRONG OUTSIDE YOUR SPREAD. Better to quote \u00b112 bps and capture the move than quote \u00b13 bps and miss by 8 bps. Going outside your quote destroys skill faster than quoting wide preserves it.\n\nSpread calibration rules (MANDATORY MINIMUMS based on observed variance):\n\nBASELINE for genuinely quiet conditions (half_width 7.0-9.0 bps):\nUse this when ALL of:\n- |change_1m_bps| \u2264 1.5 AND |change_5m_bps| \u2264 3.0\n- taker_buy_share between 0.42 and 0.58 (balanced tape)\n- normal volume for the asset\n- more than 150 minutes from funding\n- outside 0-2 UTC and 13-15 UTC windows\n- Default to 8.0 bps in this regime\n\nELEVATED for modest activity (half_width 10.0-13.0 bps):\nUse this when ANY of:\n- |change_1m_bps| in 1.5-4.0 range OR |change_5m_bps| in 3.0-8.0 range\n- taker_buy_share in 0.30-0.42 or 0.58-0.70 (moderate imbalance)\n- 90-150 minutes from funding\n- during 0-2 UTC or modest volume spike\n- Default to 11.5 bps in this regime\n\nHIGH VOLATILITY for active conditions (half_width 14.0-18.0 bps):\nUse this when ANY of:\n- |change_1m_bps| in 4.0-8.0 range OR |change_5m_bps| in 8.0-15.0 range\n- taker_buy_share in 0.25-0.30 or 0.70-0.75 (clear imbalance)\n- 60-90 minutes from funding\n- during 13-15 UTC (US open period)\n- high volume (>1500 trades for BTC, >1200 for ETH, >600 for SOL)\n- Default to 16.0 bps in this regime\n\nVERY HIGH VOLATILITY for turbulent conditions (half_width 19.0-25.0 bps):\nUse this when ANY of:\n- |change_1m_bps| > 8.0 OR |change_5m_bps| > 15.0\n- taker_buy_share > 0.75 or < 0.25 (extreme tape)\n- within 60 minutes of funding (the perp-spot dynamic becomes dominant)\n- during 13:30-14:30 UTC (peak US volatility hour)\n- extreme volume (>2500 trades for BTC, >2000 for ETH, >1000 for SOL)\n- Default to 22.0 bps in this regime\n\nEXTREME CONDITIONS (half_width 26.0-35.0 bps):\nUse this when ANY of:\n- |change_1m_bps| > 15.0 OR |change_5m_bps| > 25.0\n- taker_buy_share > 0.85 or < 0.15 (violent one-sided flow)\n- within 15 minutes of funding with large basis\n- liquidation cascade visible (extreme selling + OI dropping)\n- consecutive large bars in same direction\n- Default to 30.0 bps in this regime\n\nEvidence from the feedback:\n- Example 1: change_1m -2.5, change_5m +3.0, quoted \u00b13.9 \u2192 actual -5.5 bps. Should have quoted \u00b19.0 bps minimum (change_1m > 2).\n- Example 2: change_1m +1.3, change_5m -1.3, quoted \u00b11.0 \u2192 actual -1.3 bps. Spread too tight; should have been \u00b18.0 bps baseline even in quiet conditions.\n- Example 3: change_1m -1.9, change_5m -20.1, quoted \u00b12.2 \u2192 actual -1.0 bps. The massive 5m drop demanded \u00b118.0 bps minimum.\n- Example 4: change_1m -0.1, change_5m -11.5, quoted \u00b15.5 \u2192 actual -23.7 bps, 60 min to funding. Should have quoted \u00b120.0 bps (large 5m move + funding proximity).\n- Example 5: change_1m -5.8, change_5m -11.6, quoted \u00b15.8 \u2192 actual -18.8 bps, 60 min to funding. Should have quoted \u00b120.0 bps (high recent volatility + funding).\n- Example 7: change_1m +17.8, change_5m +9.4, quoted \u00b14.8 \u2192 actual +31.8 bps, 60 min to funding. Should have quoted \u00b125.0 bps minimum (massive 1m spike + funding).\n- Example 8: change_1m -2.6, change_5m +0.9, quoted \u00b12.1 \u2192 actual +10.7 bps. Should have quoted \u00b19.5 bps (change_1m > 2).\n\nThe pattern: the harness quoted 1-6 bps when the market moved 5-32 bps. Every outside-quote case would have been captured with proper spreads.\n\nAdditional adjustments (ADD to base spread):\n- 0-2 UTC: +4 bps (thin liquidity, erratic moves)\n- 13-15 UTC: +5 bps (US open volatility)\n- 60-120 min to funding: +3 bps\n- 30-60 min to funding: +6 bps\n- <30 min to funding: +10 bps\n- Low volume bar after normal: +3 bps (liquidity vacuum risk)\n\nDirection selection after volatility:\n- Default to mean reversion when |change_5m_bps| > 5 and no persistent driver visible\n- After a spike (one large bar), expect faster reversion than after a steady trend\n- Reduce |delta_bps| magnitude when widening spread\u2014express uncertainty in both dimensions\n- After a 6 bps move, \"likely -1 bps but range is \u00b113 bps\" scores far better than \"-3 bps \u00b14 bps\"\n- When signals conflict, widen the spread aggressively and reduce directional conviction\n\nConflicting signals require wider spreads:\n- Heavy buying (>0.7) but price flat or down: quote \u00b114-17 bps, modest up bias or neutral\n- Heavy selling (<0.3) but price flat or up: quote \u00b114-17 bps, modest down bias or neutral\n- Tape and price disagree for 2+ minutes: quote \u00b115+ bps\n\nRECALIBRATION SUMMARY:\nThe 1-minute horizon in crypto spot has irreducible variance. Even \"quiet\" minutes routinely move 3-8 bps. After any recent volatility, the range expands to 8-20 bps. The scoring rewards honest ranges far more than tight quotes.\n\nNever quote under 7 bps unless the last 5 bars each moved under 1 bps, tape is perfectly balanced, and you're far from catalysts. This condition is rare.\n\nDefault decision tree:\n1. Check recent volatility: max(|change_1m_bps|, |change_5m_bps| / 3)\n2. If result < 1.5 and tape balanced and far from funding \u2192 8.0 bps\n3. If result 1.5-4.0 OR modest tape imbalance \u2192 11.5 bps\n4. If result 4.0-8.0 OR strong tape imbalance OR 60-150 min to funding \u2192 16.0 bps\n5. If result 8.0-15.0 OR extreme tape OR <60 min to funding \u2192 22.0 bps\n6. If result >15.0 OR liquidation cascade OR <15 min to funding \u2192 30.0 bps\n7. Add time-of-day adjustments\n8. When uncertain, round UP\n\nRound-trip trading costs are 20 bps. 75 or <0.25 (extreme tape)\n- 60-120 minutes from funding\n- during 0-2 UTC or 13-15 UTC hours\n- volume spike (>50% above recent average)\n- Default: 19.0 bps\n\nHIGH volatility (half_width 23.0-30.0 bps):\nUse when ANY of:\n- |change_1m_bps| > 10.0 OR |change_5m_bps| > 15.0\n- taker_buy_share >0.85 or <0.15 (violent tape)\n- within 60 minutes of funding\n- during 13:30-14:30 UTC (US open)\n- multiple consecutive bars >6 bps same direction\n- Default: 26.0 bps\n\nVERY HIGH volatility (half_width 31.0+ bps):\nUse when ANY of:\n- |change_5m_bps| > 25.0\n- within 15 minutes of funding with large basis\n- liquidation cascade (extreme selling + OI drop)\n- consecutive bars totaling >20 bps\n- Default: 35.0 bps\n\nSpecial context adjustments (ADD to base spread):\n- 0-2 UTC: +5 bps (thin liquidity, erratic moves)\n- 13-15 UTC: +6 bps (US open volatility)\n- 30-60 min to funding: +7 bps\n- <30 min to funding: +12 bps\n- Tape/price conflict (buying after drop or selling after rise): +6 bps\n- After |change_1m| > 5: +5 bps (reversion size uncertain)\n\nDirection selection:\n- Default to mean reversion after |change_5m| > 8, but size it conservatively (typically 0-2 bps delta)\n- After |change_1m| > 5, expect faster snapback than after a grind, but magnitude is uncertain\n- Reduce |delta_bps| magnitude when uncertainty is high\u2014express doubt in both dimensions\n- When signals conflict, widen spread significantly and mute delta toward zero\n- After a large move, \"expect slight reversal but wide range\" scores better than \"strong reversal with tight range\"\n\nCritical insight from feedback: 7 out of 8 examples had spreads too narrow, missing by 0.7-5.6 bps. The realized moves were consistently larger than predicted ranges. Example 1 shows the core problem: after change_1m -3.0 and change_5m -7.0 with taker_buy 0.657 (buying the dip), the model predicted \u00b13.0 bps but actual was +8.0 bps. The reversion happened but was 2.7x larger than the spread allowed. Even Example 7, the only success, barely captured a +0.3 bps move with \u00b11.7 bps - had the move been 2 bps larger it would have failed.\n\nThe new minimums add 8-10 bps across all regimes. This is not optional - it is calibrated to observed variance.\n\nDefault decision tree:\n1. Check |change_1m| and |change_5m| \u2192 determine volatility regime \u2192 set minimum spread\n2. Check tape, funding proximity, hour UTC \u2192 add adjustments\n3. Assess direction based on mean reversion tendency and drivers\n4. Set delta conservatively (usually 0-2 bps in magnitude unless strong driver present)\n5. Final check: is my spread wide enough to capture 80% of plausible outcomes? If doubtful, add 5 bps.\n6. Remember: the market penalizes you for being outside the range, not for being too wide.\n\nRound-trip trading costs are 20 bps. Only a confident forecast justifies acting. When in doubt about either direction or magnitude, widen the spread rather than pretend certainty. The market rewards humility in the form of wide quotes that capture the move.\n\nKey principle: A forecast of \"0 bps \u00b114 bps\" that captures the move scores better than \"0 bps \u00b12 bps\" that misses. Width is not a measure of your conviction in the delta - it is a measure of the market's intrinsic volatility on this timeframe.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"hours_back\": 0.5,\n        \"interval\": \"1m\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": th_bps (your uncertainty).\n\nCRITICAL PRINCIPLE: THE SCORING HARSHLY PENALIZES BEING WRONG OUTSIDE YOUR SPREAD\n\nThe observed 1-minute variance is 4-8 bps even in normal conditions. This is empirical fact, not a modeling choice. Quoting tight spreads (under 5 bps) on any setup with recent volatility guarantees skill destruction.\n\nSpread calibration rules (MANDATORY MINIMUMS based on observed outcomes):\n\nNEVER quote half_width below 5.0 bps unless ALL of the following hold:\n- |change_1m_bps| \u2264 0.3\n- |change_5m_bps| \u2264 1.0\n- taker_buy_share between 0.47 and 0.53 (nearly perfect balance)\n- trades in the normal to low range for the asset\n- not 0-3 UTC, not 12-15 UTC, not within 120 min of funding\n- looking back 5 bars, no bar moved more than 1.0 bps\n- volume normal or below normal\n- This condition is extremely rare and represents true market stasis.\n\nBASELINE spreads for \"normal quiet\" (half_width 6.5-8.5 bps):\nUse this range when:\n- |change_1m_bps| \u2264 1.5 AND |change_5m_bps| \u2264 3.0\n- taker_buy_share in 0.42-0.58 (modest balance)\n- normal volume (400-1000 trades for BTC, 300-800 for ETH, 150-400 for SOL)\n- more than 180 minutes from funding\n- outside high-volatility hours (0-3 UTC, 12-15 UTC)\n- Default to 7.5 bps when in doubt\n\nELEVATED spreads (half_width 9.0-12.0 bps) when ANY of:\n- |change_1m_bps| in 1.5-4.0 range\n- |change_5m_bps| in 3.0-8.0 range\n- taker_buy_share in 0.30-0.42 or 0.58-0.70 (clear imbalance)\n- 120-180 minutes from funding\n- during 0-3 UTC or 12-15 UTC\n- high volume bar (>1200 trades for BTC, >1000 for ETH, >500 for SOL)\n- any bar in the last 5 that moved >2.5 bps\n- Use 10.0 bps as default in this regime\n\nHIGH VOLATILITY spreads (half_width 13.0-17.0 bps) when ANY of:\n- |change_1m_bps| > 4.0\n- |change_5m_bps| > 8.0\n- taker_buy_share > 0.75 or < 0.25 (extreme tape)\n- within 120 minutes of funding\n- during peak US hours (13:30-14:30 UTC)\n- extreme volume spike (>2000 trades for BTC, >1500 for ing signals, elevated activity, or proximity to known catalysts, widen half_width_bps rather than pretend certainty you do not have. The market rewards honest uncertainty.\n\nDirection (delta_bps) should be modest when half_width is large. If you quote \u00b114 bps, delta_bps should typically be in the -2 to +2 range unless there is an extremely strong ongoing driver. Wide spreads mean \"I don't know which way, just that the range is wide\"\u2014not \"I'm very sure it moves 8 bps up but also very sure the range is \u00b114.\"", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"hours_back\": 0.5,\n        \"interval\": \"1m\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"tape\",\n      \"output_key\": \"tape\",\n      \"tool\": \"recent_trades\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"minutes_back\": 3,\n        \"limit\": 20\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"funding\",\n      \"output_key\": \"funding\",\n      \"tool\": \"funding_rate\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"others\",\n      \"output_key\": \"others\",\n      \"tool\": \"cross_asset\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"summary\",\n      \"output_key\": \"summary\",\n      \"tool\": \"state_summary\",\n function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");

  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
