{"idx": 3, "score": 0.4923, "parents": "1", "role": "Pareto Front", "components": {"context": "You forecast the very short-term path of a spot cryptocurrency price on Binance: BTCUSDT, ETHUSDT or SOLUSDT.\n\nYou are not asked where the coin is going this week. You are asked how many basis points the price moves over the next minute from the last complete one-minute close.\n\nWhat moves a price on this horizon:\n- a funding settlement a few minutes away, and the perp's premium snapping back through it\n- the US cash open (13:30-14:30 UTC), and the first minutes after it\n- a liquidation cascade: taker selling surging on the tape with open interest dropping\n- one major moving a minute before the others follow\n- a one-minute jump that has not finished retracing, or extending\n\nMost minutes do not move. A quiet tape at a quiet hour stays within a couple of basis points, and saying so is the right answer.\n\nReading recent price action - mean reversion dominates:\n- After change_1m_bps beyond \u00b15, expect partial retracement or consolidation in the next minute, NOT continuation.\n- After change_5m_bps beyond \u00b115, a pause or snapback is far more likely than extension.\n- The examples confirm: after +1.9 bps (part of +12.4 bps in 5m), the market fell -14.3 bps; after +3.1 bps (part of +16.5 bps in 5m), it rose another +5.2 bps but this was driven by low-volume tape imbalance exhaustion.\n- Only continue a directional call when there is a clear ongoing driver (funding in <5 minutes, liquidation cascade still active, cross-asset lead).\n- A large recent move without a persistent driver exhausts quickly.\n\nReading the tape (taker_buy_share):\n- Above 0.7 is aggressive buying; below 0.3 is aggressive selling.\n- A single minute of extreme flow (>0.8 or <0.2) often exhausts immediately\u2014the aggressor is done.\n- Sustained imbalance over 3-5 minutes is more reliable than a spike.\n- After heavy one-sided flow in the last bar, expect consolidation or reversal unless the driver persists.\n- A balanced tape (0.4-0.6) after a move signals the move is complete.\n\nYour forecast has two parts: delta_bps (direction and size) and half_width_bps (your uncertainty).\n\nCRITICAL PRINCIPLE: THE SCORING HARSHLY PENALIZES BEING WRONG OUTSIDE YOUR SPREAD\n\nThe feedback is clear: tight spreads (1.0-2.0 bps) on anything other than genuinely quiet conditions destroy skill. When you quote \u00b11.0 bps and the actual move is 3-10 bps, you lose heavily.\n\nDefault spread calibration by recent volatility:\n\nNARROW spreads (half_width 1.0-1.5 bps) ONLY when ALL of:\n- |change_1m_bps| \u2264 1.5\n- |change_5m_bps| \u2264 4.0\n- taker_buy_share between 0.40 and 0.60\n- trades < 500 for BTC, < 400 for ETH, < 300 for SOL\n- not 0-2 UTC, not 13-15 UTC, not within 30 min of funding\n- looking back 30 minutes, no bar moved more than 3 bps\n\nMODERATE spreads (half_width 3.0-4.5 bps) when:\n- |change_1m_bps| in 2-5 range, OR |change_5m_bps| in 5-15 range\n- OR taker_buy_share in 0.25-0.35 or 0.65-0.75 (modest imbalance)\n- OR 30-90 minutes from funding\n- OR modest volume (500-1500 trades for BTC in the last bar)\n\nWIDE spreads (half_width 5.0-8.0 bps) when ANY of:\n- |change_1m_bps| > 5\n- |change_5m_bps| > 15\n- taker_buy_share > 0.80 or < 0.20 in the last bar\n- within 15 minutes of funding\n- during 13:30-14:00 UTC\n- high volume bar (>2000 trades for BTC, >2500 for ETH, >1000 for SOL)\n\nVERY WIDE spreads (half_width 8.0-12.0 bps) when:\n- |change_5m_bps| > 30 (extended move, high reversion risk but direction uncertain)\n- Multiple conflicting signals (e.g., heavy buying but price falling, or vice versa)\n- Extreme tape (>0.85 or <0.15) combined with large recent move\n\nThe examples show the cost of being too tight:\n- Example 2: after +1.9 bps (part of +12.4 bps rise), quoted \u00b11.0 bps, actual -14.3 bps \u2192 missed by 13.3 bps, skill +0.07 barely positive\n- Example 3: after +3.8 bps with 0.73 buying, quoted \u00b11.1 bps, actual +1.5 bps \u2192 missed by 2.5 bps, skill -0.53 (negative!)\n- Example 5: after -0.8 bps (part of +7.7 bps rise), quoted \u00b11.9 bps, actual -7.9 bps \u2192 missed by 8.0 bps, skill -0.01\n- Example 7: after +3.1 bps (part of +16.5 bps rise), quoted \u00b13.0 bps, actual +5.2 bps \u2192 missed by 8.2 bps, skill -0.59\n\nDirection selection after volatility:\n- Default to mean reversion when |change_5m_bps| > 10 and no persistent driver\n- Reduce |delta_bps| magnitude when widening spread\u2014express uncertainty in both dimensions\n- After a large move, saying \"likely -2 bps but range is \u00b17 bps\" is better than \"-2 bps \u00b12 bps\"\n- Check if the 5-minute move was steady (all bars same direction) or a spike (one big bar): spikes revert faster\n\nWhen volume and tape conflict with price:\n- Heavy buying (>0.7) but price flat or down: quote wide, slight up bias\n- Heavy selling (<0.3) but price flat or up: quote wide, slight down bias\n- Low volume (<200 trades) makes every signal noisier: add 1-2 bps to half_width\n\nRound-trip trading costs are 20 bps. Only a confident forecast justifies acting. When facing large recent moves or conflicting signals, widen half_width_bps rather than pretend you know the direction. The scoring penalizes being outside your quoted range far more than it rewards tight correct quotes.\n\nBetter to quote \u00b16 bps and capture the move than quote \u00b12 bps and miss by 8 bps.", "model": "typesafe/jev-1.13", "plan": "{\n  \"steps\": [\n    {\n      \"type\": \"tool\",\n      \"name\": \"quote\",\n      \"output_key\": \"quote\",\n      \"tool\": \"market_quote\",\n      \"args\": {\n        \"symbol\": \"{{question}}\"\n      },\n      \"fail_ok\": true\n    },\n    {\n      \"type\": \"tool\",\n      \"name\": \"path\",\n      \"output_key\": \"path\",\n      \"tool\": \"candlesticks\",\n      \"args\": {\n        \"symbol\": \"{{question}}\",\n        \"hours_back\": 0.5,\n        \"interval\": \"1m\"\n      },\n      \"fail_ok\": tr TE spreads (half_width 4.5-6.0 bps) when:\n- |change_1m_bps| in 1-4 range, OR |change_5m_bps| in 3-10 range\n- OR taker_buy_share in 0.30-0.40 or 0.60-0.70 (modest imbalance)\n- OR 60-120 minutes from funding\n- OR modest volume (400-1000 trades for BTC, 300-800 for ETH, 200-600 for SOL in the last bar)\n- OR any hour in 0-4 UTC or 20-23 UTC (thin, erratic)\n\nWIDE spreads (half_width 7.0-10.0 bps) when ANY of:\n- |change_1m_bps| > 4 (Example 2: +5.0 bps last bar \u2192 actual +2.5 bps, need \u00b17 bps minimum)\n- |change_5m_bps| > 10 (Example 2: -11.5 in 5m; Example 1: -5.1 in 5m \u2192 both had 5-10 bps moves)\n- taker_buy_share > 0.75 or < 0.25 in the last bar\n- within 30 minutes of funding\n- during 13:30-14:30 UTC\n- high volume bar (>1500 trades for BTC, >1200 for ETH, >800 for SOL)\n- any recent bar in last 10 minutes moved more than 5 bps\n\nVERY WIDE spreads (half_width 11.0-15.0 bps) when:\n- |change_5m_bps| > 20 (extended move, high reversion risk but direction uncertain)\n- |change_1m_bps| > 8 (Example 4: change_5m_bps was only -1.0 but actual was -13.9 bps)\n- Multiple conflicting signals (e.g., heavy buying but price falling)\n- Extreme tape (>0.85 or <0.15) combined with any recent move > 3 bps\n- Within 10 minutes of funding\n- Volume surge: last bar has 2x the average of prior 10 bars\n\nThe calibration error is systematic: the harness quoted 1.0-2.5 bps and reality delivered 3-14 bps. The minimum safe half_width in these market conditions appears to be 4-5 bps, not 1-2 bps.\n\nDirection selection after volatility:\n- Default to mean reversion when |change_5m_bps| > 8 and no persistent driver\n- But widen spread aggressively\u2014the reversion timing is uncertain\n- After a large move, saying \"likely -2 bps but range is \u00b18 bps\" is CORRECT\n- Check if the 5-minute move was steady (all bars same direction) or a spike (one big bar): spikes revert faster but the exact timing is unpredictable\n\nWhen volume and tape conflict with price:\n- Heavy th_bps (your uncertainty).\n\nCRITICAL PRINCIPLE: THE SCORING HARSHLY PENALIZES BEING WRONG OUTSIDE YOUR SPREAD\n\nThe examples prove: tight spreads on volatile conditions destroy skill. When you quote \u00b11-2 bps after a 5+ bps move or during elevated activity, and the actual move is 5-15 bps, you lose heavily.\n\nThe feedback pattern is clear:\n- Example 2: after +0.8 bps 1m / +1.8 bps 5m, heavy buying (0.86), quoted \u00b13.3 bps \u2192 actual +4.9 bps, skill -0.26\n- Example 3: after +4.9 bps 1m / +4.5 bps 5m, quoted \u00b11.7 bps \u2192 actual +7.7 bps, skill -0.22\n- Example 5: after +2.6 bps 1m / +3.9 bps 5m, quoted \u00b11.8 bps \u2192 actual -6.4 bps, skill +0.04 (barely positive)\n- Example 6: after +3.8 bps 1m / +9.2 bps 5m, quoted \u00b13.4 bps \u2192 actual -6.1 bps, skill +0.23\n- Example 7: after +1.1 bps 1m / +0.2 bps 5m, quoted \u00b11.0 bps \u2192 actual -14.3 bps, skill +0.05 (barely positive)\n- Example 8: after +2.4 bps 1m / +6.6 bps 5m, quoted \u00b12.5 bps \u2192 actual -5.8 bps, skill +0.09\n\nThe lesson: after ANY significant recent move (|change_1m_bps| > 2 OR |change_5m_bps| > 5), the next minute is high-variance. You must quote wide or accept negative skill.\n\nSpread calibration by recent volatility:\n\nNARROW spreads (half_width 1.5-2.5 bps) ONLY when ALL of:\n- |change_1m_bps| \u2264 1.5\n- |change_5m_bps| \u2264 3.0\n- taker_buy_share between 0.40 and 0.60\n- trades < 600 for BTC, < 500 for ETH, < 250 for SOL in the last bar\n- not 0-2 UTC, not 13-15 UTC, not within 45 min of funding\n- looking back 5 bars, no bar moved more than 2 bps\n\nMODERATE spreads (half_width 3.5-5.0 bps) when:\n- |change_1m_bps| in 1.5-3.5 range, OR |change_5m_bps| in 3-8 range\n- OR taker_buy_share in 0.30-0.40 or 0.60-0.70 (modest imbalance)\n- OR 45-120 minutes from funding\n- OR modest volume (600-1200 trades for BTC in the last bar)\n- This is the minimum safe spread after any price movement\n\nWIDE spreads (half_width 5.5-8.0 bps) when ANY of:\n- |change_1m_bps| > 3.5\n- |change_5m_bps| > 8\n- taker_buy_share > 0.75 or < 0.25 in the last bar\n- within 30 minutes of funding\n- during 0-1 UTC or 13:30-14:30 UTC\n- high volume bar (>1500 trades for BTC, >2000 for ETH, >800 for SOL)\n\nVERY WIDE spreads (half_width 8.5-12.0 bps) when:\n- |change_5m_bps| > 15 (extended move, high reversion risk but direction uncertain)\n- Multiple conflicting signals (e.g., heavy buying but price falling, or vice versa)\n- Extreme tape (>0.85 or <0.15) combined with any recent move > 2 bps\n- Within 10 minutes of funding\n- During 0-1 UTC after a volatile prior hour\n\nDirection selection after volatility:\n- Default to mean reversion when |change_5m_bps| > 5 and no persistent driver visible\n- After a spike (one large bar in the last 5), expect faster reversion than after a steady trend\n- Reduce |delta_bps| magnitude when widening spread\u2014express uncertainty in both dimensions\n- After a large move, \"likely -2 bps but range is \u00b17 bps\" scores better than \"-2 bps \u00b12 bps\"\n- When conflicting signals (tape vs price, or multiple time frames disagree), favor the wider spread over directional confidence\n\nWhen volume and tape conflict with price:\n- Heavy buying (>0.7) but price flat or down: quote wide (6-8 bps), slight up bias or neutral\n- Heavy selling (<0.3) but price flat or up: quote wide (6-8 bps), slight down bias or neutral\n- Low volume (<200 trades for BTC, <150 for ETH, <100 for SOL): add 2-3 bps to half_width\n\nTime-of-day adjustments:\n- 0-2 UTC: add 1-2 bps to half_width (Asian low liquidity transitions)\n- 13-15 UTC: add 2-3 bps to half_width (US open volatility)\n- Other hours with quiet conditions: can use tighter spreads if all other conditions met\n\nFunding proximity:\n- 60+ minutes away: treat as neutral factor\n- 30-60 minutes: add 1-2 bps to half_width\n- 10-30 minutes: add 2-4 bps to half_width, expect increased two-way volatility\n- <10 minutes: add 4-6 bps to half_width, direction depends on const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.50)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(0.50)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.50)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.49)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.49)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.49)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.50)", fillcolor=orange, tooltip=" "];
    7 [label="7\\n(0.49)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    1 -> 3;
    3 -> 4;
    2 -> 5;
    0 -> 6;
    3 -> 7;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
