<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1114" media="(prefers-color-scheme: dark)">
<meta name="description" content="Three generations of a self-rewriting forecasting harness, and whether any rewrite beat the incumbent on held-out matches.">
<title>rsi-arena</title>
<link rel="stylesheet" href="app.css">
<script>
  // The anon key is public by design — a browser would hold it anyway — but it
  // is injected at serve time rather than committed, so rotating it does not
  // mean editing HTML. If these placeholders survive, the page is being read
  // off disk or the service has no environment; data.js says so in words
  // rather than letting every fetch go relative and come back as HTML.
  window.RSI = { url: "__SUPABASE_URL__", key: "__SUPABASE_ANON_KEY__" };
  // Applied before first paint so a manual choice never flashes the other theme.
  try {
    var t = localStorage.getItem("rsi_theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode: the media query still decides */ }
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="site">
  <div class="bar">
    <a class="brand" href="#/"><span class="dot" aria-hidden="true"></span> rsi-arena</a>
    <nav class="main" aria-label="Sections"><ul id="nav"></ul></nav>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" type="button" aria-pressed="false">
      <span id="theme-label">Theme</span>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript>
    <div class="panel"><div class="panel-b prose">
      <h1>rsi-arena</h1>
      <p>This page reads its numbers from Supabase in the browser, so it needs
      JavaScript to show anything. The same data is in the repository under
      <code>runs/</code>: each generation's <code>manifest.json</code> holds both
      scoreboards and the gate's verdict, and <code>rollouts/</code> holds every
      scored window.</p>
    </div></div>
  </noscript>
  <div id="view"><div class="msg">Loading…</div></div>
</main>

<div id="announce" class="visually-hidden" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
